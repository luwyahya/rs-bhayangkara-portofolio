<div class="grid_12">
	<div kendo-window="popUp" k-title="'Order Non Layanan'" k-visible="false" k-on-open="win2visible = true"
		k-on-close="win2visible = false">
		<div class="panel panel-default container_12" style="padding: 0px 10px;">
			<div class="grid_12">
				<div class="grid_12">
					<label c-label real>Jenis Order</label>
					<input required style="width: 100%;" kendo-combo-box k-ng-model="item.jenisOrder"
						k-data-text-field="'jenisorder'" k-filter="'contains'" k-minLength="'3'"
						k-data-value-field="'id'" k-data-source="listJenisOrder" />
				</div>
				<div class="dialog_buttons pull-right" style="margin-top:5%">
					<input type="button" class="confirm_no k-button" value="Order" style="width: 70px"
						ng-click="OrderNonLayanan()" />
					&nbsp;
					<input type="button" class="confirm_yes k-button" value="Batal" style="width: 70px"
						ng-click="batalOrder()" />
				</div>
			</div>
		</div>
	</div>
</div>

<div kendo-window="popUpUbahPenjamin" k-title="'Ubah Penjamin'" k-visible="false" k-on-open="win2visible = true"
		k-on-close="win2visible = false">
		<div class="panel panel-default container_12" style="padding: 0px 10px;">
			<div class="grid_12">
				<div class="grid_12">
					<label c-label real>Ubah Penjamin</label>
					<input required style="width: 100%;" kendo-combo-box k-ng-model="item.ubahpenjamin"
						k-data-text-field="'penjamin'" k-filter="'contains'" 
						k-data-value-field="'id'" k-data-source="listUbahPenjamin" />
				</div>
			</div>
			<div class="grid_12">
				<div class="grid_12">
					<label c-label real>Ubah Rekanan</label>
					<input required style="width: 100%;" kendo-combo-box k-ng-model="item.ubahrekanan"
						k-data-text-field="'namarekanan'" k-filter="'contains'" 
						k-data-value-field="'id'" k-data-source="listUbahRekanan" />
				</div>
			</div>
			<div class="grid_12">
				<div class="grid_12">
					<label c-label real>Jaminan Khusus</label>
					<input required style="width: 100%;" kendo-combo-box k-ng-model="item.ubahjaminankhusus"
						k-data-text-field="'namaexternal'" k-filter="'contains'" 
						k-data-value-field="'id'" k-data-source="listUbahJaminanKhusus" />
				</div>
			</div>
			<div class="grid_12">
				<div class="grid_12">
					<label c-label item="item ">Password</label>
				</div>
				<div class="grid_6">
					<input c-text-box type="password" filter="'char'" class="k-textbox"
						ng-model="item.password2" />
				</div>
				<div class="grid_6">
					<input c-text-box type="input" filter="" class="k-textbox" ng-model="now"
					ng-disabled="true" />
				</div>
			</div>
			<div class="grid_12">
				<div class="grid_4" style="margin-top: 5px">
					<button class="btnTemplate1 cancel" style="margin-right: 50px;" ng-click="SaveUbahPenjamin()"> Simpan</button>
				</div>
			</div>
		</div>
	</div>

			</div>
