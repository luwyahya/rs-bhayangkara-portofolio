<div kendo-window="popUpPaket" k-title="'Paket'" k-width="1000" k-visible="false" k-on-close="customClicked()">
    <div class="panel panel-default container_12" style="padding: 0px 10px;">

        <fieldset class="effect-shadow" style=" border-radius: 4px;margin-top:10px">
            <legend id="filterData">
                <a ng-click="showAndHide()">Daftar Paket Tindakan</a>
            </legend>
            <div class="grid_12">

                <div class="grid_12" style="margin-top: 10px">

                    <div class="grid_6">
                        <div class="grid_12">
                            <label c-label item="item" c-label-text="Nama Paket"></label>
                        </div>
                        <div class="grid_12">
                            <input c-text-box type="input" filter="" class="k-textbox" ng-model="paket.namaPaket" />
                        </div>
                    </div>

                    <div class="grid_1">
                        <label c-label c-label-text=""></label>

                        <em style="margin-top:6px;" ng-click='resetFilterPaket()' id="iconButton" data-role="button"
                            class="k-button k-button-icon k-primary" role="button" aria-disabled="false"
                            tabindex="0"><span class="k-sprite k-icon k-i-cancel"></span></em>

                    </div>
                </div>
            </div>
            <div class="grid_12" style="margin-top: 10px">
                <div id="gridPaket" kendo-grid k-data-source="sourcePaket" k-selectable="'row'" k-pageable="'true'"
                    options="optionsPaket" k-ng-model="dataPaketSelect" ng-click="klikPaket(dataPaketSelect)">
                    <div k-detail-template>
                        <kendo-tabstrip>
                            <div>
                                <div id="kGridDetail" kendo-grid k-options="data2(dataItem)" k-sortable="'true'"
                                    k-selectable="'row'">
                                </div>
                            </div>
                        </kendo-tabstrip>
                    </div>
                </div>
            </div>
            <div class="grid_12">
                <div class="grid_3">
                    <label c-label item="model" c-label-text="tglPelayanan"></label>
                    <input style="width: 100%" k-ng-model="item.tglPelayanan" kendo-datetimepicker k-max="maxDate"
                        k-min="minDate" placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'"
                        parsedate="yyyy-MM-dd HH:mm" k-options="startDateOptions" />
                </div>
                <div class="grid_3">
                    <label c-label item="item">Jenis Pelaksana</label>
                    <input style="width: 100%;" kendo-combo-box k-ng-model="paket.jenisPelaksana"
                        k-data-text-field="'jenispetugaspe'" k-data-value-field="'id'" k-filter="'contains'"
                        k-auto-bind="false" k-data-source="listJenisPelaksana" k-on-change='getPegawaiByJenis()' />
                    <!-- ng-disabled="item.paramedis == true" -->
                </div>
                <div class="grid_6" style="margin-bottom:5px">
                    <label c-label item="item">Petugas Pelaksana</label>
                    <select kendo-multi-select k-options="selectOptions" k-data-source="dataSource"
                        k-data-text-field="'namalengkap'" k-data-value-field="'id'" k-ng-model="selectedPegawaiPaket" \>
                        <!--  ng-disabled="item.paramedis == true" -->
                    </select>
                </div>
            </div>

        </fieldset>
        <div class="grid_12">
            <div class="k-edit-buttons  k-state-default pull-right" style="margin-top:10px">

                <button class="k-button k-primary  k-button-icontext" ng-click="tambahPaket()"><span
                        class="k-icon fa fa-edit"></span>Tambah</button>
                <button class="k-button  btnHapus k-button-icontext" ng-click="tutupPaket()"><span
                        class="k-icon k-cancel"></span>Tutup</button>
            </div>
        </div>
    </div>

</div>

<div kendo-window="popupDokter" k-title="'Pilih Dokter Pengirim'" k-width="400" k-height="120" k-visible="false"
    k-on-open="win2visible = true" k-on-close="win2visible = false">
    <label c-label item="item " c-label-text="dokterPengirim "></label>
    <input style="width: 100%;" kendo-combo-box k-ng-model="item.namaDokter" k-data-text-field="'namalengkap'"
        k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listDokters" />
    <div class="clear">
        <button class="k-button" ng-click="simpanDokter()" style="float:right;margin-top:4%">Simpan</button>
    </div>
</div>


<!-- POP UP KOMPONEN -->
<div kendo-window="popupKomponen" k-title="'EDIT'" k-visible="false" k-width="600" k-height="400">
	<div class="panel panel-default container_12">
	
		<div class="grid_6">
			<div class="grid_12">
				<label c-label item="item" c-label-text="Nama Menu"></label>
			</div>
			<div class="clear"></div>

			<div class="grid_12">
				<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.namamenu"
					ng-disabled="true" />
			</div>
		</div>
        <div class="grid_6">
			<div class="grid_12">
				<label c-label item="item" c-label-text="Nama Bahan"></label>
			</div>
			<div class="clear"></div>

			<div class="grid_12">
				<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.namabahan"
					ng-disabled="true" />
			</div>
		</div>
	
			
        <div class="grid_4">
            <div class="grid_12">
                <label c-label item="item">QTY</label>
            </div>
            <div class="grid_12">
                <input c-text-box type="number" style="text-align: right" class="k-textbox"
                    ng-model="item.qty" />
            </div>
        </div>
			
			
			<div class="pull-right" style="margin-top:4%">
				<!-- <button class="k-button" ng-click="UpdateDiskonPorposi()">Discount Tindakan</button> -->
				<button class="k-button" ng-click="UpdateQty()" >SIMPAN</button>
				<button class="k-button" ng-click="tutup()">TUTUP</button>
			</div>
		</div>

	</div>
</div>
