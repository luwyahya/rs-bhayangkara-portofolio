<div ng-show="dataVOloaded1">
    <div class="grid_12 headerBox">
        <h1 style="color: white;"><b>Pembayaran Honor</b></h1>
    </div>

    <div class="grid_12" style="margin-top:60px">
        <div ng-include='"../app/template/Shared/TemplateLoading"'></div>
    </div>

    <div class="grid_12">
        <div class="grid_12">
            <label c-label item="item" c-label-text="Ruangan"></label>
        </div>
        <div class="grid_2" >
            <div class="grid_12">
                <input style="width: 100%;" kendo-combo-box k-ng-model="item.ruangan"
                    k-data-text-field="'namaruangan'" k-data-value-field="'id'"
                    k-filter="'contains'" k-auto-bind="false"
                    k-data-source="listRuangan" />
            </div>
        </div>
        <div class="grid_2" style="margin-top: -0.8%;">
            <label c-label item="item" c-label-text="Status Pegawai"></label>
            <div class="grid_12">
                <input style="width: 100%;" kendo-combo-box k-ng-model="item.statuspegawai"
				k-data-text-field="'kategorypegawai'" k-data-value-field="'id'"
				k-filter="'contains'" k-auto-bind="false" 
                k-data-source="ListStatusPegawai"/>
            </div>
        </div>
        <div class="grid_2 padDatePicker" style="margin-top: -0.8%;">
            <label c-label item="item" c-label-text="Periode"></label>
            <input style="width: 100%" k-ng-model="item.periode" kendo-datepicker
                placeholer="MMM yyyy" k-format="'MMM yyyy'" k-options="BulanTahunAja" />
        </div>
        <!-- <div class="grid_2">
            <div class="grid_12" style="margin-top: -16px;">
                <label c-label item="item" c-label-text="KedudukanPegawai"></label>
                <input style="width: 100%;" kendo-combo-box k-ng-model="item.kedudukan"
                    k-data-text-field="'name'" k-data-value-field="'id'"
                    k-filter="'contains'" k-auto-bind="false"
                    k-data-source="listKedudukan" />
            </div>
        </div> -->
        <!-- <div class="grid_2" style="margin-top: -0.8%;">
            <div class="grid_12 padDatePicker">
                <label c-label item="item" c-label-text="Periode"></label>
                <input style="width: 100%" k-ng-model="item.tanggal" kendo-date-picker k-options="yearUngkul"
                    placeholer="MMM yyyy" k-format="'MMM yyyy'" />
            </div>
        </div> -->
        <div class="grid_2" style="margin-top: -0.2%;">
            <button class="btnTemplate1"
            ng-click="Search()">Cari</button>
        </div>
    </div>

    <div class="grid_12">   
        <div class="grid_12" style="margin-top: 10px;">
            <div class="grid_12 borderBox">
                <kendo-grid k-data-source="dataSourceRek" k-selectable="'row'" k-ng-model="dataPasienSelected" ng-click="click(dataPasienSelected)"
                 options="columnGridRek" k-pageable="'true'" k-sortable="'true'" k-groupable="true">
                </kendo-grid>
            </div>
        </div>
    </div>

    <div class="grid_3">
        <div class="grid_12 headerBox containerBorderBox" style="padding:0px">
            <p></p>
        </div>
        <div class="grid_12 borderBox containerBorderBox">
            <!-- total pendapatan -->
            <div class="grid_12">
                <div class="grid_5">
                    <label c-label item="item" c-label-text="Total : "></label>
                </div>
                <div class="grid_8"></div>
                {{item.salary2}}
            </div>

        </div>
    </div>
    <div class="grid_12">
        <div class="grid_3">
            <button class="btnTemplate1"
            ng-click="cetakJasperRuangan()">Cetak Honor PTT Para Medis Dan Umum</button>
        </div>
        <div class="grid_3">
            <button class="btnTemplate1"
            ng-click="cetakJasperKelompok()">Cetak Honor PTT Medis</button>
        </div>
        <div class="grid_3">
            <button class="btnTemplate1"
            ng-click="cetakJasperRekap()">Cetak Rekap Pembayaran Honor PTT</button>
        </div>
    </div>
    <div id="tempatLaporan" ng-hide="istempatLaporan"></div>
</div>
