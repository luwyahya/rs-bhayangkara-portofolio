<div class="panel panel-default ">
    <div class="panel-heading headerBox"><span class="title" c-translate>Sensus Harian Sasaran Mutu</span>
    </div>
    <div class="grid_12">
        <div class="grid_2">
            <div class="grid_12">
                <center> <label c-label item="item"> Bulan :
                        {{item.bulan | date:" MMMM d, yyyy"}}</label>
                </center>
            </div>
            <div class="grid_12">
                <center>
                    <input style="width: 100%" k-ng-model="item2.bulan" kendo-date-picker placeholer="MMMM"
                        k-format="'MMMM'" k-options="monthSelectorOptions()" />
                </center>
            </div>
        </div>
        <div class="grid_2">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Departemen"></label>
            </div>
            <div class="grid_12">
                <input style="width: 100%;" kendo-combo-box k-ng-model="item2.departemen"
                    k-data-text-field="'departemen'" k-data-value-field="'value'" k-filter="'contains'"
                    k-auto-bind="false" enabled="statusAktif" k-data-source="listDepartemen"
                    k-on-change='getIsiComboRuangan()' />
            </div>
        </div>
        <div class="grid_2">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Ruangan"></label>
            </div>
            <div class="grid_12">
                <input style="width: 100%;" kendo-combo-box k-ng-model="item2.ruangan" k-data-text-field="'ruangan'"
                    k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listRuangan"
                    enabled="statusAktif" />
            </div>
        </div>
        <div class="grid_2">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Jenis Indikator"></label>
            </div>
            <div class="grid_12">
                <input style="width: 100%;" kendo-combo-box k-ng-model="item2.jenisIndikator"
                    k-data-text-field="'jenisindikator'" k-data-value-field="'id'" k-filter="'contains'"
                    k-auto-bind="false" k-data-source="listJenis" />
            </div>
        </div>
        <div class="grid_1" style="margin-top: 30px;">
            <input type="checkbox" class="k-checkbox" id="isPPI" ng-model="item.isPPI" value="true">
            <label class="k-checkbox-label" for="isPPI"><b>PPI</b></label>

            <input type="checkbox" class="k-checkbox" id="isPMKP" ng-model="item.isPMKP" value="true">
            <label class="k-checkbox-label" for="isPMKP"><b>PMKP</b></label>
        </div>
        <div class="grid_2" style="margin-top: 22px;">
            <button class="c-button" ng-click="compair()">Synchronize</button>
        </div>
        <div class="grid_2" style="margin-top: 22px;">
            <button class="c-button" ng-click="cariLaporan()">Cari
            </button>
        </div>

    </div>

<div kendo-window="popSynchronize" k-title="'Synchronize'" k-width="1000" k-visible="false"
    k-on-open="win2visible = true" k-on-close="win2visible = false">
    <div class="panel panel-default container_12" style="padding: 0px 10px;">
        <div class="grid_12">
            <legend>Synchronize akan membutuhkan waktu 90-120 seconds untuk pertanggal nya</legend>
        </div>
        <div class="grid_12">
            <div class="grid_6">
                <label>Tanggal Awal</label>
                <input style="width: 100%" k-ng-model='item.first' kendo-date-picker placeholer="dd-mm-yyyy"
                    k-format="'dd-MM-yyyy'" />
            </div>
            <div class="grid_6">
                <label>Tanggal Akhir</label>
                <input style="width: 100%" k-ng-model='item.last' kendo-date-picker placeholer="dd-mm-yyyy"
                    k-format="'dd-MM-yyyy'" />
            </div>
        </div>
        <div class="grid_6" style="margin-top: 10px">
            <button class="btnTemplate1 cancel" ng-click="synchronous()"><i
                    class="fa fa-refresh"></i>Synchronous</button>
        </div>
    </div>
