<div class="panel panel-default container_12">
    <div class="panel-heading"><label class='title' c-label item="item">Master Indikator</label></div>
    <div class="panel-body">
        <div class="grid_12">
            <div class="grid_3">
                <label c-label c-label-text="Indikator"></label>
                <input c-text-box type="input" filter="" class="k-textbox" ng-model="cari.indikator" />
            </div>
            <div class="grid_2">
                <label c-label> PIC</label>
                <input c-text-box type="input" filter="" class="k-textbox" ng-model="cari.pic" />
            </div>
            <div class="grid_3">
                <label c-label c-label-text="Jenis Indikator"></label>
                <input style="width: 100%;" kendo-combo-box k-ng-model="cari.jenisIndikator"
                    k-data-text-field="'jenisindikator'" k-data-value-field="'id'" k-filter="'contains'"
                    k-auto-bind="false" k-data-source="listJenis" />
            </div>
            <div class="grid_3">
                <label c-label c-label-text="Departemen"></label>
                <input style="width: 100%;" kendo-combo-box k-ng-model="cari.departemen"
                    k-data-text-field="'namadepartemen'" k-data-value-field="'id'" k-filter="'contains'"
                    k-auto-bind="false" k-data-source="listDepartemen" />
            </div>
            <div class="grid_1">
                <label c-label c-label-text=""></label>
                <em style="margin-top:6px;" ng-click='cariFilter()' id="iconButton" data-role="button"
                    class="k-button k-button-icon k-primary" role="button" aria-disabled="false" tabindex="0"><span
                        class="k-sprite k-icon k-i-search">Refresh</span></em>
                <em style="margin-top:6px;" ng-click='resetFilter()' id="iconButton" data-role="button"
                    class="k-button k-button-icon k-primary" role="button" aria-disabled="false" tabindex="0"><span
                        class="k-sprite k-icon k-i-cancel">Refresh</span></em>
            </div>
        </div>
        <div class="grid_12">
            <div class="panel-body grid_12">
                <kendo-grid id="gridMaster" k-selectable="'row'" k-data-source="dataSource"
                    ng-click="klikGrid(dataSelect)" k-ng-model="dataSelect" options="optionGridMaster"
                    class="max-height"></kendo-grid>
            </div>
        </div>
        <div class="grid_12 " style="float:left;" ng-hide="isHide">
            <div class="grid_2" style="float:right">
                <c-button style="width: 100%; font-size: 24px; padding:0px; margin:0px;" size="36" position=" 'right'"
                    ng-click="edit(true)">
                    <span class="title">Lihat Detail</span>
                </c-button>
            </div>
            <div class="grid_2" style="float:right;">
                <c-button class="error" style="width: 100%; font-size: 24px; padding:0px; margin:0px;" item="item"
                    size="36" position=" 'right'" ng-click="hapus()">
                    <span class="title">Hapus</span>
                </c-button>
            </div>
            <div class="grid_2" style="float:right">
                <c-button style="width: 100%; font-size: 24px; padding:0px; margin:0px;" size="36" position=" 'right'"
                    ng-click="edit(false)">
                    <span class="title">Edit</span>
                </c-button>
            </div>
            <div class="grid_2" style="float:right">
                <c-button style="width: 100%; font-size: 24px; padding:0px; margin:0px;" size="36" position=" 'right'"
                    ng-click="Tambah()">
                    <span class="title">Tambah</span>
                </c-button>
            </div>
            <div class="grid_2" style="float:right">
                <c-button style="width: 100%; font-size: 24px; padding:0px; margin:0px;" size="36" position=" 'right'"
                    ng-click="cetak()">
                    <span class="title">Cetak</span>
                </c-button>
            </div>
        </div>
    </div>
</div>
<!-- popup konfirmasi -->
<div kendo-window="dialogPopup" k-title="'Tambah'" k-width="1100" k-height="600" k-visible="false"
    k-on-close="customClicked()">
    <div class="panel panel-default panel-white container_12">
        <div class="grid_12">
            <div class="grid_12">
                <div class="grid_4">

                    </div>
                </div>
                <div class="grid_2">
                    <div class="grid_12">
                        <label c-label item="item">PIC</label>
                    </div>
                    <div class="grid_12">
                        <input c-text-box type="input" data-bind="value: pic" class="k-textbox" ng-model="item.pic"

                </div>
                <div class="grid_3">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Kategory Indikator"></label>
                    </div>
                    <div class="grid_12">
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.jenisIndikator"

                </div>
                <div class="grid_3">
                    <div class="grid_12">

                    <div class="grid_12">

            </div>

            <div class="grid_12">
                <div class="grid_4">
                    <div class="grid_12">

                    <div class="grid_12">
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.Departemen"

                <div class="grid_4">
                    <div class="grid_12">

                    </div>
                </div>
                <div class="grid_4">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Kode External"></label>

                    <div class="grid_12">
                        <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.kodeExternal"

                    </div>

                </div>



            </div>
            <div class="grid_12">

                </div>

                <div class="grid_12 borderBox containerBorderBox" style="overflow-y: scroll; height:300px;">

                        k-ng-model="dataSelectedRuangan" ng-click="klik2(dataSelectedRuangan)">
                    </div>
                </div>

            </div>
            <div class="grid_12">
                <div class="grid_4">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Dasar Pemikiran"></label>
                    </div>
                    <div class="grid_12">
                        <textarea class="k-textbox" style="height: 200px; width: 100%; " ng-model="item.dasarPemikiran"
                            ng-disabled='disabledText'></textarea>
                    </div>
                </div>
                <div class="grid_4">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="tujuan"></label>
                    </div>
                    <div class="grid_12">
                        <textarea class="k-textbox" style="height: 200px; width: 100%; " ng-model="item.tujuan"
                            ng-disabled='disabledText'></textarea>
                    </div>
                </div>
                <div class="grid_4">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Definisi Operasional"></label>
                    </div>
                    <div class="grid_12">
                        <textarea class="k-textbox" style="height: 200px; width: 100%; " ng-model="item.do"
                            ng-disabled='disabledText'></textarea>
                    </div>
                </div>

                <div class="grid_4">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Numerator"></label>
                    </div>
                    <div class="grid_12">
                        <textarea class="k-textbox" style="height: 200px; width: 100%; " ng-model="item.numerator"
                            ng-disabled='disabledText'></textarea>
                    </div>
                </div>
                <div class="grid_4">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Denominator"></label>

                    <div class="grid_12">
                        <textarea class="k-textbox" style="height: 200px; width: 100%; " ng-model="item.denominator"

                    </div>
                </div>
                <div class="grid_4">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Formula"></label>
                    </div>
                    <div class="grid_12">
                        <textarea class="k-textbox" style="height: 200px; width: 100%; " ng-model="item.formula"
                            ng-disabled='disabledText' disabled> </textarea>
                    </div>
                </div>
            </div>
            <div class="grid_12">

                <div class="grid_4">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Target Pencapaian"></label>

                    <div class="grid_12">
                        <input c-text-box type="input" class="k-textbox" ng-model="item.TargetPencapaian"
                            ng-disabled='disabledText' />
                    </div>
                </div>
            </div>
            <div class="grid_12">
                <div class="grid_4">
                    <div class="grid_12">
                        <label c-label item="item">Inklusi</label>
                    </div>
                    <div class="grid_12">
                        <input c-text-box type="input" data-bind="value: pic" class="k-textbox" ng-model="item.Inklusi"
                            ng-disabled='disabledText' />
                    </div>
                </div>
                <div class="grid_4">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Eksklusi"></label>
                    </div>
                    <div class="grid_12">
                        <input c-text-box type="input" data-bind="value: pic" class="k-textbox" ng-model="item.eksklusi"
                            ng-disabled='disabledText' />
                    </div>
                </div>
                <div class="grid_4">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Sumber Data"></label>
                    </div>
                    <div class="grid_12">
                        <input c-text-box type="input" class="k-textbox" ng-model="item.SumberData"
                            ng-disabled='disabledText' />
                    </div>
                </div>
            </div>
            <div class="grid_12">
                <div class="grid_4">
                    <div class="grid_12">
                        <label c-label item="item">Periode Pengumpulan Data</label>
                    </div>
                    <div class="grid_12">
                        <!-- <input c-text-box type="input" data-bind="value: pic" class="k-textbox"
                                                        ng-model="item.FrekuensiData" ng-disabled='disabledText' /> -->
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.FrekuensiData"
                            k-data-text-field="'frekuensi'" k-data-value-field="'id'" k-filter="'contains'"
                            k-auto-bind="false" k-data-source="listFrekuensiData" ng-disabled='disabledText' />
                    </div>
                </div>
                <div class="grid_4">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Pelaporan Data"></label>
                    </div>
                    <div class="grid_12">
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.JangkaWaktu"
                            k-data-text-field="'waktulaporan'" k-data-value-field="'id'" k-filter="'contains'"
                            k-auto-bind="false" k-data-source="listJangkaWaktu" ng-disabled='disabledText' />
                    </div>
                </div>
                <div class="grid_4">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Periode Analis"></label>
                    </div>
                    <div class="grid_12">
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.PeriodeAnalis"
                            k-data-text-field="'periode'" k-data-value-field="'id'" k-filter="'contains'"
                            k-auto-bind="false" k-data-source="listPeriodeAnalis" ng-disabled='disabledText' />
                    </div>
                </div>
            </div>
            <div class="grid_12">
                <div class="grid_4">
                    <div class="grid_12">
                        <label c-label item="item">Metodologi Pengumpulan Data</label>
                    </div>
                    <div class="grid_12">
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.Metologi"
                            k-data-text-field="'metologi'" k-data-value-field="'id'" k-filter="'contains'"
                            k-auto-bind="false" k-data-source="listMetologi" ng-disabled='disabledText' />
                    </div>
                </div>
                <div class="grid_4">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Satuan Pengukur"></label>
                    </div>
                    <div class="grid_12">
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.CakupanData"
                            k-data-text-field="'cakupandata'" k-data-value-field="'id'" k-filter="'contains'"
                            k-auto-bind="false" k-data-source="listCakupanData" ng-disabled='disabledText' />
                    </div>
                </div>
                <div class="grid_4">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Populasi Dan Sample"></label>
                    </div>
                    <div class="grid_12">
                        <input c-text-box type="input" class="k-textbox" ng-model="item.Sampel"
                            ng-disabled='disabledText' />
                    </div>
                </div>
            </div>
        </div>
        <div class="grid_12">
            <div class="grid_4">
                <div class="grid_12">
                    <label c-label item="item">Penanggung Jawab</label>
                </div>
                <div class="grid_12">
                    <input c-text-box type="input" data-bind="value: pic" class="k-textbox"
                        ng-model="item.PenanggungJawab" ng-disabled='disabledText' />
                </div>
            </div>
            <div class="grid_4">
                <div class="grid_12">
                    <label c-label item="item">Penyajian</label>
                </div>
                <div class="grid_12">
                    <input style="width: 100%;" kendo-combo-box k-ng-model="item.PublikasiData"
                        k-data-text-field="'publikasidata'" k-data-value-field="'id'" k-filter="'contains'"
                        k-auto-bind="false" k-data-source="listPublikasiData" ng-disabled='disabledText' />
                </div>
            </div>
            <div class="grid_4">
                <div class="grid_12">
                    <label c-label item="item">Metodologi Analisi Data</label>
                </div>
                <div class="grid_12">
                    <input style="width: 100%;" kendo-combo-box k-ng-model="item.MetodologiAnalisis"
                        k-data-text-field="'analisisdata'" k-data-value-field="'id'" k-filter="'contains'"
                        k-auto-bind="false" k-data-source="listMetodologiAnalisis" ng-disabled='disabledText' />
                </div>
            </div>
        </div>
        <div class="grid_12">
            <div class="grid_4">
                <div class="grid_12">
                    <label c-label item="item" c-label-text="Instrumen Pengambilan Data"></label>
                </div>
                <div class="grid_12">
                    <input c-text-box type="input" data-bind="value: pic" class="k-textbox"
                        ng-model="item.InstrumenData" ng-disabled='disabledText' />
                </div>
            </div>
            <div class="grid_4">
                <div class="grid_12">
                    <label c-label item="item" c-label-text="Keterangan Input"></label>
                </div>
                <div class="grid_12">
                    <input c-text-box type="input" data-bind="value: pic" class="k-textbox"
                        ng-model="item.keteranganInput" ng-disabled='disabledText' />
                </div>
            </div>
            <div class="grid_4">
                <div class="grid_12">
                    <label c-label item="item">Jenis Master</label>
                </div>
                <div class="grid_12">
                    <input style="width: 100%;" kendo-combo-box k-ng-model="item.jenisMaster"
                        k-data-text-field="'master'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
                        k-data-source="listJenisMaster" ng-disabled='disabledText' />
                </div>
            </div>
        </div>
        <div class="grid_12">
            <div class="grid_4">
                <div class="grid_12">
                    <label c-label item="item" c-label-text="No Urut"></label>
                </div>
                <div class="grid_12">
                    <input filter="'numeric'" c-text-box type="input" data-bind="value: pic" class="k-textbox"
                        ng-model="item.noUrut" ng-disabled='disabledText' />
                </div>
            </div>
            <div class="grid_4">
                <div class="grid_12">
                    <label c-label item="item" c-label-text="Max Lama Temuan"></label>
                </div>
                <div class="grid_12">
                    <input filter="'numeric'" c-text-box type="input" data-bind="value: pic" class="k-textbox"

                </div>
            </div>

        </div>
        <div class="grid_12">
            <div class="grid_4">
                <div class="grid_12">
                    <label c-label item="item">Jenis Mapping</label>
                </div>
                <div class="grid_12">
                    <input style="width: 100%;" kendo-combo-box k-ng-model="item.jenisMap"
                        k-data-text-field="'namaexternal'" k-data-value-field="'id'" k-filter="'contains'"
                        k-auto-bind="false" k-data-source="listJenisMap" ng-disabled='disabledText' />
                </div>
            </div>
        </div>

    </div>
    <div class="grid_12">
        <div class="k-edit-buttons k-state-default pull-right" style="margin-top:10px" ng-hide='isEdit'>
            <button class="k-button k-button-icontext k-primary k-grid-update" ng-click="Save()">
                <span class="k-icon k-update"></span>Update Indikator
            </button>
            <button class="k-button k-button-icontext k-primary k-grid-update" ng-click="SaveBaru()">
                <span class="k-icon k-update"></span>Simpan Baru Indikator
            </button>
            <button class="k-button k-button-icontext k-grid-cancel" ng-click="Batal()">
                <span class="k-icon k-cancel"></span>Tutup
            </button>
        </div>
    </div>
</div>

<!-- popup konfirmasi -->
<div kendo-window="popUpCetak" k-title="'Cetak'" k-width="1500" k-height="600" k-visible="false"
    k-on-close="customClicked()">
    <div class="grid_12" style="margin-top:10px">
        <div class="grid_12 headerBox">
            <p>Kamus Indikator Mutu</p>
        </div>
        <div class="clear"></div>

        <div class="grid_12 borderBox">
            <div id="kGrid" kendo-grid class="max-height" k-groupable="'true'" k-aggregate='aggregate'
                k-data-source="sourceLaporan" k-selectable="'row'" k-columns="columnLaporan" k-pageable="'true'"
                k-sortable="'true'" k-ng-model="dataPasienSelected" ng-click="click(dataPasienSelected)">
            </div>
        </div>

    </div>
    <div class="grid_12">
        <div class="k-edit-buttons k-state-default pull-right" style="margin-top:10px" ng-hide='isEdit'>
            <button class="k-button k-button-icontext k-grid-cancel" ng-click="tutupCetak()">
                <span class="k-icon k-cancel"></span>Tutup
            </button>
        </div>
    </div>
</div>

<div class="grid_12" style="margin-top:60px">

</div>
