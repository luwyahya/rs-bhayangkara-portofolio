<div class="panel panel-default">
    <div class="panel-body">
            <div class="grid_12">
                <div class="grid_12 headerBox">
                <h1 style="color: white;"><b>Resep Elektronik</b></h1>
            </div>
            <div class="grid_2">
                <div class="grid_12">
                    <label c-label c-label-text="TanggalOrder" real></label>
                </div>
                <div class="grid_12">
                    <div class="grid_6">
                        <input style="width: 100%" k-value='now' k-ng-model='startDate' kendo-date-picker
                            placeholer="dd-mm-yyyy" k-format="'dd-MM-yyyy'" />
                    </div>
                    <div class="grid_6">
                        <input style="width: 100%" k-value='now' k-ng-model='untilDate' kendo-date-picker
                            placeholer="dd-mm-yyyy" k-format="'dd-MM-yyyy'" />
                    </div>
                </div>
            </div>
            <div class="grid_1" style="margin-top: 5px;">
                <div class="grid_12">
                    <label c-label c-label-text="NoRM" real></label>
                </div>
                <div class="grid_12">
                    <input c-text-box type="input" ng-keypress="($event.which == 13)? refresh():noCm" class="k-textbox"
                        ng-model="noCm" />
                </div>
            </div>
            <div class="grid_1" style="margin-top: 5px;">
                <div class="grid_12">
                    <label c-label c-label-text="Nama Pasien" real></label>
                </div>
                <div class="grid_12">
                    <input c-text-box type="input" class="k-textbox" ng-model="namaPasien"
                        ng-keypress="($event.which == 13)? refresh():namaPasien" />
                </div>
            </div>
            <div class="grid_1" style="margin-top: 5px;">
                <div class="grid_12">
                    <label c-label c-label-text="NoPesanan" real></label>
                </div>
                <div class="grid_12">
                    <input c-text-box type="input" class="k-textbox" ng-model="noPesanan"
                        ng-keypress="($event.which == 13)? refresh():noPesanan" />
                </div>
            </div>
            <!-- <div class="grid_2" style="margin-top: 5px;">
				<div class="grid_12">
					<label c-label item="item" c-label-text="Instalasi"></label>
				</div>
				<div class="clear"></div>

				<div class="grid_12">
					<input style="width: 100%;" kendo-combo-box k-ng-model="departemen"
						k-data-text-field="'departemen'" k-data-value-field="'id'" k-filter="'contains'"
						k-auto-bind="false" k-data-source="listDepartemen" k-on-change='getIsiComboRuangan()' />
				</div>
			</div> -->
            <div class="grid_1" style="margin-top: 5px;">
                <div class="grid_12">
                    <label c-label item="item" c-label-text="Ruangan"></label>
                </div>
                <div class="clear"></div>

                <div class="grid_12">
                    <input style="width: 100%;" kendo-combo-box k-ng-model="ruangan" k-data-text-field="'namaruangan'"
                        k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
                        k-data-source="listRuangan" />
                </div>
            </div>
            <div class="grid_2" style="margin-top: 5px;">
                <div class="grid_12">
                    <label c-label item="item" c-label-text="Depo"></label>
                </div>
                <div class="clear"></div>

                <div class="grid_12">
                    <input style="width: 100%;" kendo-combo-box k-ng-model="depo" k-data-text-field="'namaruangan'"
                        k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
                        k-data-source="listRuanganDepo" />
                </div>
            </div>
            <div class="grid_1" style="margin-top: 5px;">
                <div class="grid_12">
                    <label c-label c-label-text="Status" real></label>
                </div>
                <div class="grid_12">
                    <select ng-show="listStatus.length" kendo-multi-select k-options="selectOptionStatus"

                    <!--                
                        	<input style="width: 100%;" kendo-combo-box k-ng-model="status"
						k-data-text-field="'status'" k-data-value-field="'id'" k-filter="'contains'"
						k-auto-bind="false" k-data-source="listStatus"  /> -->

                </div>
            </div>
            <div class="grid_1" style="margin-top: 20px;
                margin-left: 10px;">
                <input type="checkbox" class="k-checkbox" id="isTelemedicine" ng-model="item.isTelemedicine"
                    value="true" ng-click="cekTelemedicine(item.isTelemedicine)">
                <label class="k-checkbox-label" for="isTelemedicine"><b>Telemedicine</b></label>
            </div>
            <div class="grid_1" style="margin-top:5px">
                <label c-label c-label-text=""></label>
                <em style="margin-top:6px;" ng-click='refresh()' id="iconButton" data-role="button"
                    class="k-button k-button-icon" role="button" aria-disabled="false" tabindex="0"><span
                        class="k-sprite k-icon k-i-search">Cari</span></em>
            </div>
            <!-- <div class="grid_1">            
                <button class="btnTemplate1" style="margin-top: 25px;margin-right: 10px;" ng-click="refresh()"> <i

            </div> -->
        </div>

</div>
