    <script>
        $('.cb').on('change', function () { // on change of state
            UpdateCost();
        });
        function UpdateCost() {
            var sum = 0;
            var gn, elem;
            $('.cb:checked').each(function () {
                sum += Number($(this).val());
            })

            $('#totalcost').val(sum.toFixed(0));
        }
    </script>
