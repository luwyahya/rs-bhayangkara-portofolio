<div class="grid_12">
    <div class="grid_12">
        <div class="panel panel-default container_12">
            <div class="panel-heading" c-translate>Catatan Keperawatan</div>
        </div>
        <div class="grid_12" ng-show="grid">
            <div id="gridResumeHead" kendo-grid k-data-source="sourceResumeHead" options="resumeOptHead" k-ng-model="modelGrid" ng-click="klik(modelGrid)">
                <div k-detail-template>
                    <kendo-tabstrip>
                        <div>
                            <div id="kGridDetail" kendo-grid k-options="data2(dataItem)" k-sortable="'true'" k-selectable="'row'" k-ng-model="dataSelected2" ng-click="klikDetail(dataSelected2)">
                            </div>
                        </div>
                    </kendo-tabstrip>
                </div>
            </div>
        </div>
        <div class="grid_12" ng-show="grid">
            <div class="grid_2">
                <button class="btnTemplate1" ng-click="showInput()"><i class="fa fa-plus"></i>Tambah
                
                </button>
            </div>
            <div class="grid_2">
                <button class="btnTemplate1" ng-click="editGrid()"><i class="fa fa-edit"></i>Edit
                </button>
            </div>
            <div class="grid_2">
                <button class="btnTemplate1 cancel" ng-click="kembali()"><i class="fa fa-edit"></i>Kembali
                </button>
            </div>
            <!-- <div class="grid_2">
                <button class="btnTemplate1" ng-click="cetak()"><i class="fa fa-print"></i>Cetak
                </button>
            </div> -->
            <div class="grid_2">
                <button class="btnTemplate1" ng-click="cetakPdf()"><i class="fa fa-print"></i>Cetak Jasper
                </button>
            </div>
            <!-- <div class="grid_2">
                <button class="btnTemplate1" ng-click="Verifikasi()" ng-show="showbtn" ><i class="fa fa-plus-circle"></i>Verifikasi</button>
                <button class="btnTemplate1" ng-click="Unverifikasi2()" ng-show="!showbtn" ><i class="fa fa-plus-circle"></i>Unverifikasi</button>
            </div> -->
        </div>
        <div class="grid_12" style="margin-top: 10px;" ng-show="input">
            <div class="grid_12">
                <div class="grid_12">
                    <fieldset style="margin-top: 10px; ">
                        <legend><b>Catatan Keperawatan (Evaluasi)</b></legend>
                        <div class="grid_12" style="margin-top: 20px">
                            <table style="width:100%;color: #4c5356;">
                                <tr>
                                    <th style="width:15%;font-weight: bold;text-align: center;background-color: white;color: black;font-size: 15px;">
                                        TGL/JAM</th>
                                    <th style="width:25%;font-weight: bold;text-align: center;background-color: white;color: black;font-size: 15px;">
                                        DIAGNOSA</th>
                                    <th style="width:30%;font-weight: bold;text-align: center;background-color: white;color: black;font-size: 15px;">
                                        Tindakan Keperawatan dan Hasil</th>
                                    <th style="width:15%;font-weight: bold;text-align: center;background-color: white;color: black;font-size: 15px;">
                                        Tanda Tangan Nama</th>
                                    <!-- <th
                                            style="width:15%;font-weight: bold;text-align: center;background-color: white;color: black;font-size: 15px;">
                                            </th> -->
                                </tr>
                                <tr>
                                </tr>
                                <tr ng-repeat="name in data.names track by $index">
                                    <td>
                                        <div class="grid_12">
                                            <div class="grid_12">
                                                <div class="grid_12">
                                                    <input style="width: 100%" k-ng-model="data.names[$index].tgl" kendo-datetimepicker placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" parsedate="yyyy-MM-dd HH:mm" />
                                                </div>
                                            </div>
                                        </div>
                                    </td>
                                    <td>

                                        <div class="grid_8" style="margin-top:5px">
                                            <input style="width: 100%;" kendo-combo-box k-ng-model="data.names[$index].dg" k-data-text-field="'diagnosa'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listAskep" />
                                        </div>
                                        <div class="grid_4">
                                            <button class="btnTemplate1" ng-click="TambahSoap($index)"><i class="fa fa-plus-circle"></i>Tambah</button>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="grid_12">
                                            <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="data.names[$index].tkh" placeholder="Tindakan Keperawatan dan Hasil" style="height: 180px; width: 100%; " />
                                            <!-- END ASESMEN -->
                                        </div>
                                    </td>
                                    <td>
                                        <div class="grid_12" style="margin-top:5px">
                                            <input style="width: 100%;" kendo-combo-box k-ng-model="data.names[$index].pg" k-data-text-field="'namalengkap'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listPegawai" />
                                        </div>
                                    </td>
                                    <td>
                                        <div class="grid_12">
                                            <div class="grid_2">
                                                <button class="btnTemplate1" ng-click="Tambah($index)" ng-show="inputsave"><i class="fa fa-plus-circle"></i></button>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                            </table>
                        </div>
                </div>
                </fieldset>
            </div>
        </div>
        <!-- <div class="grid_12">
            <div ng-include='"../app/module/EMR/TemplateButtonDinamis" '></div>
        </div> -->
        <div class="grid_12">
            <div class="grid_8"></div>
            <div class="grid_2" ng-show="input">
                <div class="grid_2">
                    <button class="btnTemplate1" ng-click="Save()" style="width: 200px;" ng-show="inputsave"><i class="fa fa-edit"></i>Simpan
                    </button>
                    <button class="btnTemplate1" ng-click="Edit()" style="width: 200px;" ng-show="editsave"><i class="fa fa-edit"></i>Edit
                    </button>
                </div>
                <div class="grid_2">
                    <button class="btnTemplate1 cancel" ng-click="Back()" style="width: 200px; margin-left: 205px;"><i class="fa fa-edit"></i>Batal
                    </button>
                </div>
            </div>
            <!-- <div class="grid_2" style="margin-top: 33px;">
                <button class="btnTemplate1" ng-click="Verifikasi()" ng-show="showbtn" style="float: right;"><i class="fa fa-plus-circle"></i>Verifikasi</button>
                <button class="btnTemplate1" ng-click="Unverifikasi2()" ng-show="!showbtn" style="float: right;"><i class="fa fa-plus-circle"></i>Unverifikasi</button>
            </div> -->
            <!-- <div class="grid_1">
                
            </div> -->
        </div>
    </div>
</div>
