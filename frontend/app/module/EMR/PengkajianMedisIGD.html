                            <script>
                                var geom = kendo.geometry;
                                var Point = geom.Point;
                                var draw = kendo.drawing;
                                var Path = draw.Path;
                                var path;

                                $("#surface-container")
                                    .on("mousemove", function (e) {
                                        if (!path) {
                                            return;
                                        }

                                        var offset = $(this).offset();
                                        var newPoint = new Point(
                                            e.pageX - offset.left,
                                            e.pageY - offset.top
                                        );

                                        path.lineTo(newPoint);
                                    })
                                    .on("mousedown", function (e) {
                                        path = new Path({
                                            stroke: {
                                                color: "red",
                                                width: 2,
                                                lineCap: "round",
                                                lineJoin: "round",
                                            },
                                        });

                                        var offset = $(this).offset();
                                        var newPoint = new Point(
                                            e.pageX - offset.left,
                                            e.pageY - offset.top
                                        );

                                        for (var i = 0; i < 1; i++) {
                                            path.lineTo(newPoint.clone().translate(i * 1, 0));
                                        }

                                        surface.draw(path);
                                    }).on("mouseup", function (e) {
                                        path = undefined;
                                    }).on('touchmove', function(e) { //FOR MOBILE
                                    e.preventDefault();
                                    console.log("move")
                                    if (!path) {
                                    return;
                                    }

                                    var offset = $(this).offset();
                                    var pageX = e.originalEvent.touches[0].pageX;
                                    var pageY = e.originalEvent.touches[0].pageY;
                                    var newPoint = new Point(pageX - offset.left, pageY - offset.top);

                                    path.lineTo(newPoint);
                                }).on("touchstart", function(e) { //FOR MOBILE
                                    console.log(e)
                                    path = new Path({
                                    stroke: {
                                        color: 'red',
                                        width: 2,
                                        lineCap: "round",
                                        lineJoin: "round"
                                    }
                                    });
                                    
                                    var offset = $(this).offset();
                                    var pageX = e.originalEvent.touches[0].pageX;
                                    var pageY = e.originalEvent.touches[0].pageY;
                                    var newPoint = new Point(pageX - offset.left, pageY - offset.top);

                                    for (var i = 0; i < 1; i++) {
                                    path.lineTo(newPoint.clone().translate(i * 1, 0));
                                    }
                                    
                                    surface.draw(path);
                                }).on("touchend", function(e) { //FOR MOBILE
                                    path = undefined;
                                });

                                var surface = draw.Surface.create($(".surface"));
                                //

                                $(".clear").click(function () {
                                    surface.clear();
                                });
                            </script>
