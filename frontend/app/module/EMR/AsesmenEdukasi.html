<style>
    .grid_1, .grid_2, .grid_3, .grid_4, .grid_5, .grid_6,

        float: left;

        padding-left: 5px;
        padding-right: 5px;
    }
    .grid_1 { width: 8.333333%; }
    .grid_2 { width: 16.666667%; }
    .grid_3 { width: 25%; }
    .grid_4 { width: 33.333333%; }

    .grid_11 { width: 91.666667%; }

    /* Membersihkan float setelah grid */
    .row-pad::after, fieldset::after {
        content: "";
        display: table;
        clear: both;
    }
    .row-pad {
        margin-bottom: 8px; /* Jarak antar baris */
        width: 100%;
        display: block;
    }
    
    /* Judul per seksi */
    .section-title {
        font-weight: bold;
        font-size: 14px;
        background-color: #f2f2f2;
        padding: 5px 10px;
        margin-top: 15px;
        margin-bottom: 10px;
        border-left: 4px solid #2196F3; /* Warna biru standar */
        width: calc(100% - 10px);
    }

    .parentKeteranganFieldTambahan {
        position: relative; 
        display: block;
        width: 100%;
    }
    
    .parentKeteranganFieldTambahan .k-textbox {
        width: 100%;
        padding-right: 40px; /* Memberi ruang agar teks tidak tertutup satuan */
        box-sizing: border-box;
    }

    .keteranganFieldTambahan {
        position: absolute;
        right: 15px; 
        top: 50%;
        transform: translateY(-50%); 
        color: #777; 
        font-size: 12px;
        pointer-events: none; /* Agar klik diteruskan ke input di bawahnya */
        margin: 0 !important; 
    }

    .tg {
        border-collapse: collapse;
        border-spacing: 0;
        width: 100%;
        margin-bottom: 15px;
    }
    .tg th, .tg td {
        border: 1px solid #ccc;
        padding: 5px 8px;
        vertical-align: middle;
        font-size: 12px;
    }
    .tg th {
        background-color: #e6e6e6;
        text-align: center;
        font-weight: bold;
    }

    .dotted-input {
        border: none !important;
        border-bottom: 1px dotted #888 !important;
        background: transparent !important;
        box-shadow: none !important;
        border-radius: 0 !important;
    }
    .dotted-input:focus {
        border-bottom: 1px solid #2196F3 !important;
    }

    .row-pad label:not(.k-checkbox-label):not(.keteranganFieldTambahan) {
        display: inline-block; 
        margin-top: 10px;
    }

    /* Pengecualian untuk flexbox agar sejajar vertikal */
    div[style*="display: flex"] > label:not(.k-checkbox-label):not(.keteranganFieldTambahan),
    td > label:not(.k-checkbox-label):not(.keteranganFieldTambahan) {
        margin-top: 0 !important;
    }
</style>
