<style type="text/css">
.tg {border-collapse:collapse;border-spacing:0;border-color:#aabcfe;width:100%;}
.tg td{font-family:Arial, sans-serif;font-size:14px;padding:8px 5px;border-style:solid;border-width:1px;overflow:hidden;word-break:normal;border-color:#aabcfe;color:#333;background-color:#ffffff;}
.tg th{font-family:Arial, sans-serif;font-size:14px;font-weight:bold;padding:10px 5px;border-style:solid;border-width:1px;overflow:hidden;word-break:normal;border-color:#aabcfe;color:#039;background-color:#b9c9fe;text-align:center;}
.tg .tg-center{text-align:center;vertical-align:middle;}
.tg .nilai{vertical-align:middle;text-align:center;font-weight:bold;background-color:#e8edff;}
.radio-container {display: inline-block; margin-right: 15px; cursor: pointer;}
.radio-container input {cursor: pointer;}
</style>

<div class="grid_12" style="margin-bottom: 60px">
    <div class="panel panel-default">
        <div class="panel-heading" c-translate>Formulir Skrining Rawat Inap Geriatri</div>
        <div class="panel-body">
            
            <p style="font-weight: bold; margin-bottom: 10px;">Berikan tanda (v) pada kolom dibawah ini yang sesuai dengan kondisi pasien :</p>
            
            <div class="grid_12">
                <table class="tg">
                    <thead>
                        <tr>
                            <th style="width: 50px;">NO</th>
                            <th>SINDROM GERIATRI</th>
                            <th style="width: 200px;">JAWABAN</th>
                        </tr>
                    </thead>
                    <tbody>
                       <tr ng-repeat="itemSoal in listPertanyaanGeriatri">
                            <td class="tg-center">{{itemSoal.id}}</td>
                            <td>{{itemSoal.nama}}</td>
                            <td class="tg-center">
                                <span class="radio-container">
    <input
        type="radio"
        id="radio_ya_{{itemSoal.emrdfk}}"
        name="radio_group_{{itemSoal.emrdfk}}"
        ng-model="item.obj[itemSoal.emrdfk]"
        ng-value="true"
        ng-change="hitungTotal()">

    <label for="radio_ya_{{itemSoal.emrdfk}}">
        Ya
    </label>
</span>

<span class="radio-container">
    <input
        type="radio"
        id="radio_tidak_{{itemSoal.emrdfk}}"
        name="radio_group_{{itemSoal.emrdfk}}"
        ng-model="item.obj[itemSoal.emrdfk]"
        ng-value="false"
        ng-change="hitungTotal()">

    <label for="radio_tidak_{{itemSoal.emrdfk}}">
        Tidak
    </label>
</span>
                            </td>
                        </tr>
                        <tr>
                            <td class="nilai" colspan="2" style="text-align: right; padding-right: 15px;">Total Jawaban "Ya"</td>
                            <td class="nilai tg-center">{{totalJawabanYa}}</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Bagian Tindak Lanjut Otomatis Tercentang -->
            <div class="grid_12" style="margin-top: 20px;">
                <p style="font-weight: bold; text-decoration: underline;">Tindak Lanjut :</p>
                <div style="margin-left: 10px;">
                    <div style="margin-bottom: 8px;">
                        <input type="checkbox" id="tl1" ng-checked="totalJawabanYa < 6" disabled>
                        <label for="tl1">Bila Jawaban "Ya" &lt; 6, <b>tidak perlu Tatalaksana Komprehensif Geriatri</b></label>
                    </div>
                    <div>
                        <input type="checkbox" id="tl2" ng-checked="totalJawabanYa >= 6" disabled>
                        <label for="tl2">Bila Jawaban "Ya" &ge; 6, <b>perlu Tatalaksana Komprehensif Geriatri Pasien ditempatkan di Ruang Rawat Inap Geriatri Akut</b></label>
                    </div>
                </div>
            </div>

        </div>
    </div>
    
    <div ng-include="'../app/template/Shared/TemplateButtonSimpanNotFixed'"></div>
</div>
