                <div class="grid_12" style="margin-top: 5px;">
                    <div class="grid_12">
                        <div id="surface-container" style="background-image:url({{user.poto}}); height: 350px; width:100%; background-repeat: no-repeat; background-size: 70%; background-position: center;">
                            <div class="surface" style="background-image:url({{user.poto}}); height: 350px; width:100%; background-repeat: no-repeat; background-size: 70%; background-position: center;"></div>
                        </div>

                        <div class="grid_6">
                            <div class="grid_12">
                                <div class="grid_4">
                                    <button class='k-button clear'>Clear drawing</button>
                                </div>
                            </div>
                        </div>


                        <script>
                            var geom = kendo.geometry;
                            var Point = geom.Point;
                            var draw = kendo.drawing;
                            var Path = draw.Path;
                            var path;

                            $("#surface-container").on("mousemove", function(e) {
                                if (!path) {
                                    return;
                                }

                                var offset = $(this).offset();
                                var newPoint = new Point(e.pageX - offset.left, e.pageY - offset.top);

                                path.lineTo(newPoint);
                            }).on("mousedown", function(e) {
                                path = new Path({
                                    stroke: {
                                        color: 'red',
                                        width: 2,
                                        lineCap: "round",
                                        lineJoin: "round"
                                    }
                                });

                                var offset = $(this).offset();
                                var newPoint = new Point(e.pageX - offset.left, e.pageY - offset.top);

                                for (var i = 0; i < 1; i++) {
                                    path.lineTo(newPoint.clone().translate(i * 1, 0));
                                }

                                surface.draw(path);
                            }).on("mouseup", function(e) {
                                path = undefined;
                            });

                            var surface = draw.Surface.create($(".surface"));
                            // 


                            $(".clear").click(function() {
                                surface.clear();
                            });
                        </script>
                    </div>
