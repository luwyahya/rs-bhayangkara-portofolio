<div>
    <c-panel item="item" header="'Monitoring Efek Samping Obat'">
    </c-panel>
    <div class="panel panel-default container_12" ng-show="isGrid">
        <div class="panel-body">
            <md-content style="padding-bottom:5px">
                <div class="grid_12" ng-show="false">
                    <fieldset style="margin-top: 10px;">
                        <div class="grid_2">
                            <label c-label c-label-text="Tanggal Pengkajian" real></label>
                            <input style="width: 100%" k-ng-model="item.tglpengkajianmeso" kendo-datepicker
                                placeholer="yyyy-MM-dd" k-format="'yyyy-MM-dd'" parsedate="yyyy-MM-dd"/>
                        </div>
                        <div class="grid_1">
                            <label c-label c-label-text=""></label>
                            <em style="margin-top:6px;" ng-click='resetFilter()' id="iconButton" data-role="button" class="k-button k-button-icon k-primary" role="button" aria-disabled="false" tabindex="0">
                                <span class="k-sprite k-icon k-i-search"></span>Cari </em>
                        </div>
                    </fieldset>
                </div>
            </md-content>
        </div>
        <div class="grid_12">
            <div id="gridResumeHead" kendo-grid k-data-source="sourceResumeHead" options="resumeOptHead" k-ng-model="modelGrid" ng-click="klik(modelGrid)" ng-dblclick="editGrid(modelGrid)">
            </div>
        </div>
        <div class="grid_12">
            <p style="font-size:1.2em"><b>Keterangan :</b><br>Klik 2x untuk melakukan Edit Pengkajian</p> 
        </div>
        <div class="grid_4"></div>
        <div class="grid_2">
            <!-- <button class="btnTemplate1 cancel" ng-click="kembali()"><i class="fa fa-plus"></i>Kembali
            
            </button> -->
        </div>
        <div class="grid_2">
            <button class="btnTemplate1" ng-click="showInput()"><i class="fa fa-plus"></i>Tambah
            
            </button>
        </div>
        <div class="grid_2">
            <button class="btnTemplate1 cancel" ng-click="hapusGrid()"><i class="fa fa-trash"></i>Hapus
            </button>
        </div>
        <div class="grid_2">
            <button class="btnTemplate1" ng-click="cetakjs()"><i class="fa fa-print"></i>Cetak
            </button>
        </div>
    </div>

    <md-content class="md-padding" ng-show="isEdit">
        <div class="grid_12" style="margin-top:10px">
            <div class="grid_10"></div>
            <div class="grid_2">
                <button class="btnTemplate1" ng-click="Back()"><i class="fa fa-arrow-left"></i>Kembali
        
                    </button>
            </div>
            <div class="grid_12">
                <div class="grid_3">
                    <div class="grid_12">
                        <label c-label item="item">Tanggal dan Jam Pengkajian</label>
                    </div>
                    <div class="grid_12">
                        <input style="width: 100%" k-ng-model="item.tglpengkajian" kendo-datetimepicker
                            placeholer="yyyy-MM-dd hh:mm" k-format="'yyyy-MM-dd hh:mm'" parsedate="yyyy-MM-dd hh:mm" />
                    </div>
                </div>                
            </div>
        </div>
        <div class="grid_12" style="margin-top:10px">
            <div class="grid_12">
                <div class="grid_12">
                    <div class="grid_12">
                        <label c-label item="item">Apakah pasien mengalami Efek Samping Obat (E.S.O) :</label>
                    </div>
                    <div class="grid_3">
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.obj[411000]" k-data-text-field="'nama'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listEfekSamping" />
                    </div>
                </div>                
            </div>
            <hr>
        </div>
        <div class="grid_12" style="margin-bottom:10px">
            
            <div class="grid_12 text-center" style="margin-bottom:5px"><b style="font-size:1.4em">PASIEN</b></div>
            <div class="grid_12">
                <label c-label item="item">Penyakit Utama</label>
            </div>

            <div class="grid_12" style="margin-top:5px">
                <textarea c-text-box class="k-textbox" style="height: 100px; width: 100%; " ng-model="item.obj[411001]"></textarea>
            </div>
        </div>

        <div class="grid_3" style="margin-top:10px">
            <div class="grid_12">
                <div class="grid_12">
                    <div class="grid_12">
                        <label c-label item="item">Jenis Kelamin</label>
                    </div>
                    <div class="grid_6">
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.obj[411003]"  k-data-text-field="'nama'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listJenisKelamin" />
                    </div>
                    <div class="grid_6">
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.obj[411004]" k-data-text-field="'nama'" k-data-value-field="'id'" ng-show="isPerempuan" k-filter="'contains'" k-auto-bind="false" k-data-source="listHamil" />
                    </div>
                </div>                
            </div>
        </div>
        
        <div class="grid_3" style="margin-top:10px">
            <div class="grid_12">
                <div class="grid_12">
                    <div class="grid_12">
                        <label c-label item="item">Kondisi</label>
                    </div>
                    <div class="grid_12" style="margin-top:5px">
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.obj[411002]" k-data-text-field="'nama'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listKondisi" />
                    </div>
                </div>                
            </div>
        </div>

        <div class="grid_12" style="margin-top:10px">
            <div class="grid_12">
                <div class="grid_12">
                    <div class="grid_12" style="margin-bottom:5px">
                        <label c-label item="item">Penyakit / kondisi lain yang menyertai</label>
                    </div>
                </div>
                <div class="grid_8">
                    <div class="grid_4">
                        <div class="grid_12" style="margin-bottom: 10px;">
                            <input type="checkbox" class="k-checkbox" ng-model="item.obj[411005]"
                                id="item.obj[411005]" ng-checked="iChecked1">
                            <label class="c-label k-checkbox-label" for="item.obj[411005]" required>Gangguan Ginjal</label>
                        </div>
                    </div>
                    <div class="grid_4">
                        <div class="grid_12" style="margin-bottom: 10px;">
                            <input type="checkbox" class="k-checkbox" ng-model="item.obj[411006]"
                                id="item.obj[411006]" ng-checked="iChecked2">
                            <label class="c-label k-checkbox-label" for="item.obj[411006]" required>Gangguan Hati</label>
                        </div>
                    </div>
                    <div class="grid_4">
                        <div class="grid_12" style="margin-bottom: 10px;">
                            <input type="checkbox" class="k-checkbox" ng-model="item.obj[411007]"
                                id="item.obj[411007]"  ng-checked="iChecked3">
                            <label class="c-label k-checkbox-label" for="item.obj[411007]" required>Alergi</label>
                        </div>
                    </div>
                    <div class="grid_4">
                        <div class="grid_12" style="margin-bottom: 10px;">
                            <input type="checkbox" class="k-checkbox" ng-model="item.obj[411008]"
                                id="item.obj[411008]" ng-checked="iChecked4">
                            <label class="c-label k-checkbox-label" for="item.obj[411008]" required>Kondisi Medis Lainnya</label>
                        </div>
                    </div>
                    <div class="grid_4">
                        <div class="grid_12" style="margin-bottom: 10px;">
                            <input type="checkbox" class="k-checkbox" ng-model="item.obj[411009]"
                                id="item.obj[411009]" ng-checked="iChecked5">
                            <label class="c-label k-checkbox-label" for="item.obj[411009]" required>Factor Industri, Pertanian</label>
                        </div>
                    </div>
                    <div class="grid_4">
                        <div class="grid_12" style="margin-bottom: 10px;">
                            <input type="checkbox" class="k-checkbox" ng-model="item.obj[411010]"
                                id="item.obj[411010]" ng-checked="iChecked6">
                            <label class="c-label k-checkbox-label" for="item.obj[411010]" required>Kimia, dan Lain-lain</label>
                        </div>
                    </div>
                </div>                
            </div>
        </div>

        

        <div class="grid_12" style="margin-top:10px">
            <hr>
            <div class="grid_12 text-center" style="margin-bottom:5px"><b style="font-size:1.4em">REAKSI EFEK SAMPING OBAT</b></div>


            <div class="grid_12" style="margin-top:10px">
                <div class="grid_12">
                    <div class="grid_3">
                        <div class="grid_12">
                            <label c-label item="item">Saat/Tanggal mulai terjadi E.S.O</label>
                        </div>
                        <div class="grid_12">
                            <input style="width: 100%" k-ng-model="item.obj[411011]" kendo-datetimepicker
                                placeholer="yyyy-MM-dd hh:mm" k-format="'yyyy-MM-dd hh:mm'" parsedate="yyyy-MM-dd hh:mm" />
                        </div>
                    </div>                
                </div>
            </div>
            <div class="grid_12" style="margin-top:10px">
                <div class="grid_12">
                    <div class="grid_12">
                        <div class="grid_12">
                            <label c-label item="item">Bentuk/Manifestasi E.S.O yang terjadi</label>
                        </div>
                        <div class="grid_6">
                            <input required c-text-box type="input"  class="k-textbox" ng-model="item.obj[411012]"/>
                        </div>
                    </div>                
                </div>
            </div>


            <div class="grid_12" style="margin-top:10px">
                <label c-label item="item">Tindakan yang telah dilakukan untuk mengatasi reaksi E.S.O </label>
            </div>

            <div class="grid_12" style="margin-top:5px">
                <textarea c-text-box class="k-textbox" style="height: 100px; width: 100%; " ng-model="item.obj[411013]"></textarea>
            </div>
        </div>


        <div class="grid_12" style="margin-top:10px">
            
            <div class="grid_12">
                <div class="grid_12 headerBox">
                    <p>OBAT</p>
                </div>
                <div class="clear"></div>
                <div class="grid_12 borderBox">

                    <div kendo-grid k-data-source="dataGridObat" options="GridObat" k-ng-model="modelObat"></div>
                </div>
                <div class="grid_10"></div>
                <div class="grid_2">
                    <button class="btnTemplate1" ng-click="hapusObat()"><i class="fa fa-trash"></i>Hapus Obat</button>
                </div>
            </div>
        </div>
        
        <div class="grid_6" style="margin-top:10px">
            <div class="grid_12">
                <div class="grid_12">
                    <div class="grid_12">
                        <label c-label item="item">Apakah reaksi E.S.O hilang setelah obat dihentikan?</label>
                    </div>
                    <div class="grid_4" style="margin-top:5px">
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.obj[411014]" k-data-text-field="'nama'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listReaksi" />
                    </div>
                </div>                
            </div>
        </div>


        <div class="grid_12" style="margin-top:10px">
            
            <hr>
            <div class="grid_12 text-center" style="margin-bottom:5px"><b style="font-size:1.4em">PELAPOR</b></div>

            <div class="grid_12">
                <div class="grid_4" style="margin-top:20px">
                    <b>Ruangan Asal</b>
                    <div class="grid_12" style="padding: 5pt">
                        <div>
                            <div class="grid_12">
                                <input style="width: 100%; " kendo-combo-box k-ng-model="item.obj[411015]" k-data-text-field=" 'nama' " k-filter=" 'contains' " k-data-value-field=" 'id' " k-auto-bind="false " k-data-source="listRuangan " />
                            </div>
                        </div>
                    </div>
                </div>
                <div class="grid_4" style="margin-top:20px">
                    <b>Apoteker</b>
                    <div class="grid_12" style="padding: 5pt">
                        <div>
                            <div class="grid_12">
                                <input style="width: 100%; " kendo-combo-box k-ng-model="item.obj[411016]" k-data-text-field=" 'nama' " k-filter=" 'contains' " k-data-value-field=" 'id' " k-auto-bind="false " k-data-source="listDokter " />
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="grid_12">
                <div class="grid_8"></div>
                <div class="grid_2" ng-show="isButtonTambah">
                    <button class="btnTemplate1" ng-click="simpanMeso()"><i class="fa fa-save"></i>Simpan
            
                        </button>
                </div>
                <div class="grid_2" ng-show="isButtonEdit">
                    <button class="btnTemplate1" ng-click="UpdateMeso()"><i class="fa fa-save"></i>Update
            
                        </button>
                </div>
                <div class="grid_2">
                    <button class="btnTemplate1" ng-click="Back()"><i class="fa fa-arrow-left"></i>Kembali
            
                        </button>
                </div>
            </div>
    </md-content>

    <div kendo-window="popUpTambah" k-title="'Obat'" k-width="900" k-height="550" k-visible="false" k-on-open="win2visible = true"
        k-on-close="win2visible = false">
        <div class="panel panel-default container_12" style="padding: 0px 10px;">
            <div class="grid_12">
                <div class="grid_6">
                    <label c-label item="item" required>Nama Obat</label>
                    <!-- <input  required style="width: 100%;"  kendo-combo-box k-ng-model="item.obatobat"
                            k-data-text-field="'namaproduk'" k-data-value-field="'id'" k-filter="'contains'"
                            k-auto-bind="false" k-data-source="listobatobat" ng-show="false"/>-->
                    <input required c-text-box type="input" class="k-textbox" ng-model="item.obatobat2" />



                </div>
                <div class="grid_6">
                    <label c-label item="item" required>Bentuk Sediaan</label>
                    <input required c-text-box type="input" class="k-textbox"
                        ng-model="item.bentuksediaan" />
                </div>
                <div class="grid_6">
                    <label c-label item="item" required>Obat yang dicurigai menimbulkan E.S.O</label>
                    <!-- <input  required style="width: 100%;"  kendo-combo-box k-ng-model="item.obatdicurigai"
                            k-data-text-field="'namaproduk'" k-data-value-field="'id'" k-filter="'contains'"
                            k-auto-bind="false" k-data-source="listobatdicurigai"  ng-show="false" /> -->
                    
                    <input required c-text-box type="input" class="k-textbox" ng-model="item.obatdicurigai2" />

                </div>
            </div>
            <div class="grid_12">    
                <hr>
                <label c-label item="item" required><b>PEMBERIAN</b></label>
                <div class="grid_4">
                    <label c-label item="item" required>Rute</label>
                    <input required c-text-box type="input" class="k-textbox"
                        ng-model="item.obatrute" />
                </div>
                <div class="grid_4">
                    <label c-label item="item" required>Dosis</label>
                    <input required c-text-box type="input" class="k-textbox"
                        ng-model="item.obatdosis" />
                </div>
            </div>
            <div class="grid_12">  
                <div class="grid_4">
                    <label c-label item="item" required>Tgl Mulai</label>
                    <input style="width: 100%" k-ng-model="item.obattglmulai" kendo-datetimepicker
                            placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" parsedate="yyyy-MM-dd HH:mm"/>
                </div>
                
                <div class="grid_4">
                    <label c-label item="item" required>Tgl Akhir</label>
                    <input style="width: 100%" k-ng-model="item.obattglakhir" kendo-datetimepicker
                            placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" parsedate="yyyy-MM-dd HH:mm"/>
                </div>
                
            </div>
            <div class="grid_12">   
                <hr>
                <div class="grid_12">
                    <label c-label item="item" required>Indikasi Penggunaan</label>
                    <input required c-text-box type="input" class="k-textbox"
                        ng-model="item.obatindikasipenggunaan" />
                </div>
            </div>
            <div class="grid_12">
                <div class="grid_8"></div>
                <div class="grid_2" style="margin-left: -5.5%;">
                    <button class="btnTemplate1" ng-click="simpanObat()">Simpan</button>
                </div>
                <div class="grid_2" style="margin-left: 2.5%;">
                    <button class="btnTemplate1 cancel" ng-click="tutupObat()">Tutup</button>
                </div>
        </div>
    </div>
