<div class="grid_12">
    <c-form item='item'>
        <div ng-include='"../app/module/RawatInap/HeaderDataPasien"'></div>
        <div class='grid_12 panel panel-default'>
            <div class='panel-heading'>Kondisi Pasien</div>
            <div class='panel-body'>
                <div class="grid_12">
                    <div class="grid_4">
                        <!-- Status keluar -->
                        <label c-label item="item" c-label-text="statusKeluar"></label>
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.statusKeluar"
                            k-data-text-field="'statuskeluar'" k-filter="'contains'" k-data-value-field="'id'"
                            k-auto-bind="false" k-data-source="listStatusKeluar" k-on-change="loadKelas()"
                            ng-disabled="disabledStatus" />
                    </div>
                    <div class="grid_4" ng-hide="item.statusKeluar.id === 2">
                        <!-- Kondisi Keluar -->
                        <label c-label item="item" c-label-text="kondisiKeluar"></label>
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.kondisiKeluar"
                            k-data-text-field="'kondisipasien'" k-filter="'contains'" k-data-value-field="'id'"
                            k-auto-bind="false" k-data-source="listKondisiPasien" />
                    </div>
                    <div class="grid_4" ng-hide="item.statusKeluar.id === 2">
                        <!-- Status Pulang -->
                        <label c-label item="item" c-label-text="statusPulang"></label>
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.statusPulang"
                            k-data-text-field="'statuspulang'" k-filter="'contains'" k-data-value-field="'id'"
                            k-auto-bind="false" k-data-source="listStatusPulang" />
                    </div>
                    <div class="grid_1" style="margin-top:5px" ng-show="item.statusKeluar.id === 2">
                        <input type="checkbox" class="k-checkbox" id="rawatGabung" ng-model="item.rawatGabung"
                            ng-click="cekRawatGabung(item.rawatGabung)">
                        <label class="k-checkbox-label" for="rawatGabung"><b>Rawat Gabung</b></label>
                    </div>
                    <div class="grid_1" style="margin-top:5px" ng-show="item.statusKeluar.id === 2">
                        <input type="checkbox" class="k-checkbox" id="rawatTitipan" ng-model="item.rawatTitipan"
                            ng-click="cekRawatTitipan(item.rawatTitipan)">
                        <label class="k-checkbox-label" for="rawatTitipan"><b>Rawat Titipan</b></label>
                    </div>
                    <div class="grid_2" ng-show="item.statusKeluar.id === 2">
                        <label c-label item="item" c-label-text="tanggalRencanaPindah"></label>
                        <input kendo-date-time-picker k-options="formatJam24" k-ng-model="item.tglRencanaKeluar"
                            style="width: 100%" />
                    </div>
                    <div class="grid_4" ng-show="item.statusKeluar.id === 2">
                        <label c-label item="item" c-label-text="ruanganRencanaPindah"></label>
                        <!-- <input style="width: 100%;" kendo-combo-box k-ng-model="item.ruangan" k-data-text-field="'namaRuangan'" k-filter="'contains'" k-data-value-field="'id'" k-auto-bind="false" k-data-source="sourceRuangan" k-on-change="cariKamar()"/> -->
                        <input style="width: 100%; " kendo-combo-box k-ng-model="item.ruangan "
                            k-data-text-field=" 'namaruangan' " k-filter=" 'contains' " k-data-value-field=" 'id' "
                            k-auto-bind="false " k-data-source="listRuangan"
                            k-on-change="pilihRuangan(item.ruangan.id)" />
                    </div>
                </div>

                <div class="grid_12" ng-show="item.statusKeluar.id === 5">
                    <div class="grid_4">
                        <label c-label item="item" c-label-text="tanggalMeninggal"></label>
                        <input style="width: 100%" kendo-date-time-picker k-ng-model="item.tglMeninggal" k-max="now"
                            k-options="formatJam24" />
                    </div>
                    <div class="grid_4">
                        <label c-label item="item" c-label-text="PenyebabKematian"></label>
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.penyebabKematian"
                            k-data-text-field="'penyebabkematian'" k-filter="'contains'" k-data-value-field="'id'"
                            k-auto-bind="false" k-data-source="listPenyebabKematian" k-on-change="IsiPenyebab()" />
                    </div>
                    <div class="grid_4" ng-show="PenyebabKematianManual">
                        <label c-label item="item" c-label-text="PenyebabKematian"></label>
                        <input c-text-box type="input" filter="'string'" class="k-textbox"
                            ng-model="item.PenyebabKematianText" />
                    </div>
                    <!-- hilangkan dokter pemeriksa -->
                    <!--<label c-label item="item" c-label-text="DokterPemeriksa"></label>
                    <div class="grid_4" ng-show="item.statusKeluar.id === 5">
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.dokterPemeriksa" k-data-text-field="'namaLengkap'" k-filter="'contains'" k-data-value-field="'id'" k-auto-bind="false" k-data-source="dokterPemeriksa" />
                    </div>-->
                </div>


                <div class="grid_12" ng-show="item.statusKeluar.id === 2">
                    <div class="grid_4" ng-show="item.statusKeluar.id === 2">
                        <label c-label item="item" c-label-text="kelas"></label>
                        <input style="width: 100%; " kendo-combo-box k-ng-model="item.kelas "
                            k-data-text-field=" 'namakelas'" k-filter=" 'contains' " k-data-value-field=" 'value' "
                            k-auto-bind="false " k-data-source="listKelas" />
                        <!-- input style="width: 100%;" kendo-combo-box ng-model="item.kelasLoad" k-ng-model="item.kelas" k-data-text-field="'namaKelas'" k-filter="'contains'" k-data-value-field="'id'" k-auto-bind="false" k-data-source="sourceKelas" k-on-change="cariRuangan()"/> -->
                    </div>
                    <div class="grid_4">
                        <label c-label item="item" c-label-text="kamar"></label>
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.kamar"
                            k-data-text-field="'namakamar'" k-data-value-field="'id'" k-filter="'contains'"
                            k-auto-bind="false" k-data-source="listKamar" />
                        <!-- <input style="width: 100%;" kendo-combo-box k-ng-model="item.kamar" k-data-text-field="'namaKamar'" k-filter="'contains'" k-data-value-field="'id'" k-auto-bind="false" k-data-source="sourceKamar"  k-on-change="cariNoBed()"/> -->
                    </div>
                    <div class="grid_4">
                        <label c-label item="item" c-label-text="Nomor Tempat Tidur"></label>
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.nomorTempatTidur"
                            k-data-text-field="'reportdisplay'" k-data-value-field="'id'" k-filter="'contains'"
                            k-auto-bind="false" k-data-source="listNoBed" />
                        <!-- <input style="width: 100%;" kendo-combo-box k-ng-model="item.noBed" k-data-text-field="'nomorBed'" k-filter="'contains'" k-data-value-field="'id'" k-auto-bind="false" k-data-source="sourceNoBed" /> -->
                    </div>
                </div>

                <div class="grid_12" ng-show="item.statusKeluar.id === 2" style="margin-left:5px">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text=keterangan></label>
                        <textarea ng-model="item.keteranganLainnya" style="width: 99%; height: 100px;"></textarea>
                    </div>
                </div>

                <div class="grid_12" ng-show="item.statusKeluar.id === 4">
                    <div class="grid_4">
                        <label c-label item="item" c-label-text="tanggalRujuk"></label>
                        <input style="width: 100%" kendo-date-picker k-max="now" k-ng-model="item.tglRujuk"
                            k-value="now" placeholer="dd-mm-yyyy" k-format="'dd-MM-yyyy'" />
                    </div>
                    <div class="grid_4">
                        <div class="grid_12">
                            <label c-label>Faskes Tujuan</label>
                        </div>
                        <div ng-repeat="stat in listJenisRujukan | orderBy:'id'">
                            <div class="grid_4">
                                <input type="radio" name="{{stat.name}}" id="{{stat.name}}" class="k-radio"
                                    ng-model="item.jenisRujukan" value="{{stat.id}}">
                                <label class=" k-radio-label" for="{{stat.name}}">{{stat.name}}</label>
                            </div>
                        </div>
                    </div>
                    <div class="grid_4">
                        <label c-label item="item" c-label-text="DiRujukKe"></label>
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.diRujukKe"
                            k-data-text-field="'nama'" k-filter="'contains'" k-data-value-field="'kode'"
                            k-auto-bind="false" k-data-source="listFaskess" />
                    </div>
                    <div class="grid_4">
                        <label c-label item="item" c-label-text="dokterPerujuk"></label>
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.dokterPerujuk"
                            k-data-text-field="'namaLengkap'" k-filter="'contains'" k-data-value-field="'id'"
                            k-auto-bind="false" k-data-source="listDokter" />
                    </div>
                    <div class="grid_4">
                        <label c-label item="item" c-label-text="AlamatPerujuk"></label>
                        <textarea ng-model="item.alamatPerujuk"></textarea>
                    </div>
                    <div class="grid_4">
                        <label c-label item="item" c-label-text="AlasanRujuk"></label>
                        <textarea ng-model="item.alasanRujuk"></textarea>
                    </div>
                </div>
            </div>
            <div class='grid_12 panel panel-default' ng-hide="item.statusKeluar.id === 2">
                <div class='panel-heading'>Pasien Pulang</div>
                <div class='panel-body'>
                    <div class="grid_12">
                        <div class="grid_4">
                            <!-- Tanggal Keluar -->
                            <label c-label item="item" c-label-text="tanggalKeluar"></label>
                            <input style="width: 100%" k-ng-model="item.tglKeluar" kendo-datetimepicker k-max="now"
                                placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" />
                        </div>
                        <div class="grid_4">
                            <!-- Asal Rujukan -->
                            <label c-label item="item" c-label-text="namaPembawaPulang"></label>
                            <input c-text-box type="input" filter="'string'" class="k-textbox"
                                ng-model="item.namaPembawaPulang" />
                        </div>
                        <div class="grid_4">
                            <!-- Asal Rujukan -->
                            <label c-label item="item" c-label-text="hubunganKeluarga"></label>
                            <input style="width: 100%;" kendo-combo-box k-ng-model="item.hubunganKeluarga"
                                k-data-text-field="'hubungankeluarga'" k-filter="'contains'" k-data-value-field="'id'"
                                k-auto-bind="false" k-data-source="listHubunganKel" />
                        </div>
                        </c-panel>
                        <!-- <div class="grid_12" style="margin-top:20px"  ng-show="item.statusKeluar.id === 2">
                        <div class="grid_6"></div>
                        <div class="grid_3">
                            <button class="c-button cancel" style="width: 100%; font-size: 20px; padding:0px, margin:0px;" ng-click="Cancel()">Batal</button>
                        </div>
                        <div class="grid_3">
                            <button class="c-button success" style="width: 100%; font-size: 20px; padding:0px, margin:0px;" ng-click="SavePindah()">Simpan</button>
                        </div>
                    </div> -->
                    </div>
                </div>
            </div>
            <!--   <div ng-include=' "../app/module/Shared/TemplateButtonSimpan" '></div> -->
            <div ng-include='"../app/template/Shared/TemplateButtonRegistrasiNew " ' style="margin-top:30px"
                ng-hide="showTindakan"></div>
            <div ng-include=' "../app/template/Shared/TemplateLoading" '></div>
        </div>

        <div class="grid_12">
            <div kendo-window="popUpCariRmIbu" k-title="'Cari Norm Ibu'" k-visible="false"
                k-on-open="win2visible = true" k-on-close="win2visible = false">
                <div class="panel panel-default container_12" style="padding: 0px 10px;">
                    <div class="grid_12">
                        <div class="grid_3">
                            <label c-label>No RM Ibu</label>
                            <input c-text-box type="input" class="k-textbox" ng-model="item.NoCM"
                                ng-keypress="($event.which == 13)? VerificationNamaIbu():item.NoCM" />
                            <kendo-button sprite-css-class="'k-icon k-i-lock'" ng-click="VerificationNamaIbu()"
                                style="width: 100%">Cari No
                                RM Ibu</kendo-button>
                        </div>
                        <div class="panel panel-default panel-white">
                            <div class="panel-heading-white"><span class="title" c-translate>Rekam Medis Ibu</span>
                            </div>
                            <div class="panel-body">
                                <div class="grid_3" ng-show="nocmHide">
                                    <!-- <label c-label c-label-text="NamaPasien"></label> -->
                                    <label c-label>No RM</label>
                                    <input c-text-box type="input" class="k-textbox" ng-disabled="'true'"
                                        ng-model="item.rmibu.nocm" />
                                </div>
                                <div class="grid_3">
                                    <!-- <label c-label c-label-text="NamaPasien"></label> -->
                                    <label c-label>Nama Ibu</label>
                                    <input c-text-box type="input" class="k-textbox" ng-disabled="'true'"
                                        ng-model="item.rmibu.namapasien" />
                                </div>
                                <div class="grid_3">
                                    <!-- <label c-label c-label-text="TglLahir"></label> -->
                                    <label c-label>Tanggal Lahir</label>
                                    <input c-text-box type="input" class="k-textbox" ng-disabled="'true'"
                                        ng-model="item.rmibu.tglLahir" />
                                </div>
                                <div class="grid_3">
                                    <!-- <label c-label c-label-text="JenisKelamin"></label> -->
                                    <label c-label>Jenis Kelamin</label>
                                    <input c-text-box type="input" class="k-textbox" ng-disabled="'true'"
                                        ng-model="item.rmibu.jeniskelamin" />
                                </div>
                                <div class="grid_3">
                                    <!-- <label c-label c-label-text="Agama"></label> -->
                                    <label c-label>Agama</label>
                                    <input c-text-box type="input" class="k-textbox" ng-disabled="'true'"
                                        ng-model="item.rmibu.agama" />
                                </div>
                                <div class="grid_3">
                                    <!-- <label c-label c-label-text="Agama"></label> -->
                                    <label c-label>No Telpon</label>
                                    <input c-text-box type="input" class="k-textbox" ng-disabled="'true'"
                                        ng-model="item.rmibu.noTelpon" />
                                </div>
                                <div class="grid_3">
                                    <!-- <label c-label c-label-text="Agama"></label> -->
                                    <label c-label>Pendidikan</label>
                                    <input c-text-box type="input" class="k-textbox" ng-disabled="'true'"
                                        ng-model="item.rmibu.pendidikan" />
                                </div>
                                <div class="grid_3">
                                    <!-- <label c-label c-label-text="Agama"></label> -->
                                    <label c-label>Pekerjaan</label>
                                    <input c-text-box type="input" class="k-textbox" ng-disabled="'true'"
                                        ng-model="item.rmibu.pekerjaan" />
                                </div>
                                <div class="grid_3">
                                    <!-- <label c-label c-label-text="AlamatPasien"></label> -->
                                    <label c-label>Alamat Lengkap</label>
                                    <input c-text-box type="input" class="k-textbox" ng-disabled="'true'"
                                        ng-model="item.rmibu.alamatlengkap" />
                                </div>
                                <div class="dialog_buttons pull-right" style="margin-top:5%">
                                    <input type="button" class="confirm_yes k-button" value="Simpan"
                                        style="width: 100px" ng-click="saveRmIbu()" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid_12">
                <div kendo-window="popUpKasusPenyakit" k-title="'KASUS PENYAKIT'" k-visible="false"
                    k-on-open="win2visible = true" k-on-close="win2visible = false">
                    <div class="panel panel-default container_12" style="padding: 0px 10px;">
                        <div class="grid_12">
                            <div class="grid_12">
                                <label c-label real>Untuk Keperluan Pelaporan RS ONLINE</label>
                            </div>
                            <div class="grid_12">
                                <div class="grid_12">
                                    <label c-label>Kasus Penyakit</label>
                                </div>
                                <div class="grid_3" style="margin-left: 5px">
                                    <input type="radio" name="umum" id="1" class="k-radio" ng-model="item.kp" value="1">
                                    <label class="k-radio-label" for="1">Non Covid</label>
                                </div>
                                <div class="grid_3">
                                    <input type="radio" name="suspect" id="56" class="k-radio" ng-model="item.kp"
                                        value="56">
                                    <label class="k-radio-label" for="56">Suspect</label>
                                </div>
                                <div class="grid_3">
                                    <input type="radio" name="confirm" id="57" class="k-radio" ng-model="item.kp"
                                        value="57">
                                    <label class="k-radio-label" for="57">Confirm</label>
                                </div>
                            </div>
                            <div class="dialog_buttons pull-right" style="margin-top:5%">
                                <input type="button" class="confirm_yes k-button" value="Simpan" style="width: 70px"
                                    ng-click="Savee()" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>
