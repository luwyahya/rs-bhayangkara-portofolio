<div kendo-window="winHistori" k-title="'Histori'" k-width="1200" k-height="450" k-visible="false"
    k-on-open="win2visible = true" k-on-close="win2visible = false">
    <div class="panel panel-default container_12">

        <fieldset class="effect-shadow" style=" border-radius: 4px">
            <legend id="filterData">
                <a ng-click="showAndHide()">Riwayat Dokumen Pasien</a>
            </legend>
            <div class="grid_12">

                <div class="grid_2">

                    <div class="grid_12">
                        <label c-label item="item" c-label-text="NoRekamMedis"></label>
                        <input c-text-box type="input" class="k-textbox" ng-disabled="'true'"
                            ng-model="item.pasien.nocm" />
                    </div>
                </div>
                <div class="grid_2">

                    <div class="grid_12">
                        <label c-label item="item" c-label-text="namaPasien"></label>
                        <input c-text-box type="input" class="k-textbox" ng-disabled="'true'"
                            ng-model="item.pasien.namapasien" />
                    </div>
                </div>

                <div class="grid_2">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="jenisKelamin"></label>
                        <input c-text-box type="input" class="k-textbox" ng-disabled="'true'"
                            ng-model="item.pasien.jeniskelamin" />
                    </div>
                </div>
                <div class="grid_2">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="tanggalLahir"></label>
                        <input c-text-box type="input" class="k-textbox" ng-disabled="'true'"
                            ng-model="item.pasien.tgllahir" />

                    </div>
                </div>
                <div class="grid_4">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="alamat"></label>
                        <input c-text-box type="input" class="k-textbox" ng-disabled="'true'"
                            ng-model="item.pasien.alamatlengkap" />
                    </div>
                </div>
            </div>
            <div class="grid_12" style="margin-top: 10px">
                <div id="gridRiwayat" kendo-grid k-data-source="sourceRiwayat" options="riwayatOpt"></div>
            </div>
        </fieldset>

    </div>
</div>
<div kendo-window="winPinjam" k-title="'Peminjaman'" k-width="400" k-height="120" k-visible="false"
    k-on-open="win2visible = true" k-on-close="win2visible = false">
    <label c-label item="item " c-label-text="Keterangan "></label>
    <input c-text-box type="input" class="k-textbox" ng-model="item.keteranganPinjam" />
    <div class="clear">

<div kendo-window="winKirim" k-title="'Kirim Dokumen'" k-width="400" k-height="150" k-visible="false"
    k-on-open="win2visible = true" k-on-close="win2visible = false">
    <label c-label item="item " c-label-text="Ruangan Asal "></label>
    <input style="width: 100%;" kendo-combo-box k-ng-model="item.ruanganAsal" k-data-text-field="'namaruangan'"
        k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listRuanganAsal" />

    <label c-label item="item " c-label-text="Ruangan Tujuan "></label>
    <input style="width: 100%;" kendo-combo-box k-ng-model="item.ruanganTujuan" k-data-text-field="'namaruangan'"
        k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listRuanganTujuan" />
    <div class="clear">
        <button class="k-button" ng-click="simpanKirim()" style="float:right;margin-top:4%">Simpan</button>
    </div>
</div>
