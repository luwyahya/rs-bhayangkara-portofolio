<div>
    <div class="panel panel-default ">
        <div class="panel-heading headerBox"><span class="title" c-translate>Parameter Pencarian</span></div>
        <div class="panel-body">
            <div class="grid_12">
                <div class="grid_6">
                    <div class="grid_12">
                        <label c-label>Tanggal Meninggal</label>
                    </div>
                    <div class="grid_12">
                        <div class="grid_6">
                            <input style="width: 100%" k-ng-model='item.from' kendo-date-picker placeholer="dd-mm-yyyy" k-format="'dd-MM-yyyy'" />
                        </div>
                        <div class="grid_6">
                            <input style="width: 100%" k-ng-model='item.until' k-max="now" kendo-date-picker placeholer="dd-mm-yyyy" k-format="'dd-MM-yyyy'" />
                        </div>
                    </div>
                </div>
                <div class="grid_2" style="margin-top:5px">
                    <div class="grid_12">
                        <label c-label>No Registrasi</label>
                    </div>
                    <div class="grid_12">
                        <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.noReg" />
                    </div>
                </div>
                <div class="grid_1" style="margin-top:5px">
                    <div class="grid_12">
                        <label c-label>No Rm</label>
                    </div>
                    <div class="grid_12">
                        <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.noRm" />
                    </div>
                </div>
                <div class="grid_2" style="margin-top:5px">
                    <div class="grid_12">
                        <label c-label>Nama Pasien</label>
                    </div>
                    <div class="grid_12">
                        <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.namaPasien" />
                    </div>
                </div>

                <div class="grid_1" style="margin-top:5px">
                    <label c-label c-label-text=""></label>
                    <em style="margin-top: 6px;" ng-click='findData()' id="iconButton" data-role="button" class="k-button k-button-icon" role="button" aria-disabled="false" tabindex="0"><span
                            class="k-sprite k-icon k-i-search">Cari</span></em>
                </div>
            </div>
        </div>
    </div>
    <div class="panel panel-default panel-white">
        <div class="panel-heading-white"><span class="title" c-translate>{{title}}</span></div>
        <div class="panel-body">
            <div class="grid_12" style="margin-bottom:5px">
                <kendo-grid k-ng-model="data" k-data-source="dataPasienBatal" k-pageable="'true'" k-sortable="'true'" ng-click="klikGrid(data)" k-selectable="'row'" k-resizable="'true'" options='mainGridOptions'>
                </kendo-grid>
            </div>
            <div class="clear"></div>
        </div>
    </div>
    <div class="grid_12">
        <div class="grid_2" style="margin-top: 16px">
            <button class="btnTemplate1" ng-click="inputTindakan()">Input Tindakan</button>
        </div>
        <div class="grid_2" style="margin-top: 16px">
            <button class="btnTemplate1" ng-click="detailTagihan()">Detail Tagihan</button>
        </div>
        <div class="grid_2" style="margin-top: 16px">
            <button class="btnTemplate1" ng-click="pemeriksaanDokterForensik()">Pemeriksaan Dokter Forensik</button>
        </div>
        <div class="grid_3" style="margin-top: 16px">
            <button class="btnTemplate1" ng-click="suratjalan()">Surat Jalan Ambulan</button>
        </div>
        <div class="grid_3" style="margin-top: 16px">
            <button class="btnTemplate1" ng-click="cetaksuratjalan()">Cetak Surat Jalan Ambulan</button>
        </div>
        <div class="grid_2" style="margin-top: 16px">
            <button class="btnTemplate1 cancel" ng-click="BatalPeriksa()"><i
					class="fa fa-arrow-left"></i>Batal Periksa</button>
        </div>
    </div>
    <div kendo-window="popupPassword" k-title="'Pemeriksaan Dokter Forensik '" k-width="400" k-visible="false" k-on-open="win2visible = true" k-on-close="win2visible = false">
        <div class="panel panel-default container_12">
            <div class="grid_12">
                <!-- <fieldset class="effect-shadow" style="border-radius:  4px; margin-top: 5px;"> -->
                <div class="grid_10">
                    <div class="grid_12">
                        <label c-label item="item ">Password</label>
                    </div>
                    <div class="grid_12">
                        <input c-text-box type="password" filter="'char'" class="k-textbox" ng-model="item.password" />
                    </div>
                </div>
                <!-- </fieldset> -->
                <div class="grid_12">
                    <div class="k-edit-buttons  k-state-default pull-right" style="margin-top:10px">
                        <button class="k-button  k-button-icontext" ng-click="gas()"><i
										class="fa fa-times-circle"></i>&nbsp;Simpan</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
<div class="grid_12" style="margin-top:60px">
    <div ng-include='"../app/template/Shared/TemplateLoading"'></div>
</div>

<div kendo-window="popUp" k-title="'Masukkan Tanggal Setor'" k-width="300" k-visible="false" k-on-open="win2visible = true" k-on-close="win2visible = false">
    <div class="panel panel-default container_12" style="padding: 0px 10px;">
        <div class="grid_12">

            <div class="grid_12">
                <label c-label item="item" c-label-text="Periode"></label>
            </div>
            <div class="clear"></div>

            <div class="grid_12">
                <!-- AwalPeriode -->
                <div class="grid_12 padDatePicker">
                    <input style="width: 100%" k-ng-model="item.tglsetor" kendo-datetimepicker k-max="now" placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" />
                </div>

                <div class="clear"></div>
            </div>

        </div>
        <div class="clear"></div>
        <!-- kata kunci confirm -->
        <div class="dialog_buttons pull-right" style="margin-top:5%">
            <input type="button" class="confirm_no k-button" value="Kembali" style="width: 70px" ng-click="kembali()" /> &nbsp;
            <input type="button" class="confirm_yes k-button" value="Ya" style="width: 70px" ng-click="lanjutsimpan()" />
        </div>
        <div kendo-window="popup_editor" k-title="''" k-visible="false" k-width="800" k-height="800">
            <div class="panel panel-default container_12">
                <div class="grid_12">
                    <div class="grid_4">
                        <label c-label item="item" c-label-text="No.Registrasi"></label>
                    </div>
                    <div class="clear"></div>

                    <div class="grid_8">
                        <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.noregistrasi" ng-disabled="true" />
                    </div>

                </div>
                <div class="grid_12">
                    <div class="grid_4">
                        <label c-label item="item" c-label-text="Petugas"></label>
                    </div>
                    <div class="clear"></div>

                    <div class="grid_8">
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.petugas" k-data-text-field="'namalengkap'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="ListDataPegawai" />
                    </div>
                </div>
                <div class="grid_12">
                    <div class="grid_4">
                        <label c-label item="item" c-label-text="Tanggal Pemberangkatan"></label>
                    </div>
                    <div class="clear"></div>
                    <div class="grid_8 padDatePicker">
                        <div class="grid_12">
                            <input style="width: 100%" k-ng-model="item.tglberangkat" kendo-datetimepicker placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" />
                        </div>
                    </div>

                </div>


                <div class="grid_12">
                    <div class="grid_4">
                        <label c-label class="label-aja" item="item">No Polisi/Kendaraan</label>
                    </div>
                    <div class="grid_8">
                        <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.nopol" />
                    </div>
                </div>

                <div class="grid_12">
                    <div class="grid_4">
                        <label c-label class="label-aja" item="item">Tujuan</label>
                    </div>
                    <div class="grid_8">
                        <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.tujuan" />
                    </div>
                </div>
                <div class="grid_12">
                    <div class="grid_4">
                        <label c-label class="label-aja" item="item">Keperluan</label>
                    </div>
                    <div class="grid_8">
                        <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.keperluan" />
                    </div>
                </div>
                <div class="grid_12">
                    <div class="grid_4">
                        <label c-label class="label-aja" item="item">Keluarga Pasien</label>
                    </div>
                    <div class="grid_8">
                        <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.keluargapasien" />
                    </div>
                </div>
                <div class="grid_3">
                    <button class="btnTemplate1" style="margin-top: 10px;" ng-click="simpansuratjalan()">Simpan</button>
                </div>

                <div class="grid_1">
                </div>
                <div class="grid_3">
                    <button class="btnTemplate1" style="margin-top: 10px;" ng-click="cetaksuratjalan()">Cetak</button>
                </div>
                <div class="grid_1">
                </div>
                <div class="grid_3">
                    <button class="btnTemplate1" style="margin-top: 10px;" ng-click="kembalirekanan()">Kembali</button>
                </div>
            </div>
        </div>
        <div id="tempatLaporan" ng-hide="istempatLaporan"></div>
