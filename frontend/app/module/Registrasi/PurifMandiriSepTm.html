	<div class="grid_12">

		<div class="grid_1">
			<div class="grid_12">
				<label>&nbsp;</label>
			</div>
			<div class="clear"></div>

			<div class="grid_12">
				<button class="btnTemplate1" style="margin-left: 0;" ng-show="! isLoading"
					ng-click="CariLapPasienPulang()">Cari</button>
			</div>

		</div>
		<div class="grid_1">
			<div class="grid_12">
				<label>&nbsp;</label>
			</div>
			<div class="clear"></div>

			<div class="grid_12">
				<button class="btnTemplate1" style="margin-left: 0;" ng-show="! isLoading"
					ng-click="sendPurif()">Purif</button>
			</div>
		</div>
		<div class="grid_3">
			<label c-label item="item" c-label-text="Departement"></label>
			<input style="width: 100%;" kendo-combo-box k-ng-model="item.departement" k-data-text-field="'departemen'"
				k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listDepartemen" />
		</div>
		<div class="grid_3">
			<input type="checkbox" class="k-checkbox" id="isTglPulang" ng-model="item.isTglPulang" value="true"
				ng-click="cekTglPulang(item.isTglPulang)">
			<label class="k-checkbox-label" for="isTglPulang"><b>Tanggal Pulang</b></label>
		</div>
		<div class="grid_3">
			<div class="grid_12">
				<label c-label item="item" c-label-text="Periode Pencarian"></label>
			</div>
			<div class="clear"></div>

			<div class="grid_12">
				<!-- AwalPeriode -->
				<div class="grid_6 padDatePicker">
					<input style="width: 100%" k-ng-model="item.periodeAwal" kendo-datetimepicker k-max="now"
						placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" parsedate="yyyy-MM-dd HH:mm" />
				</div>

				<!-- AkhirPeriode -->
				<div class="grid_6 padDatePicker">
					<input style="width: 100%" k-ng-model="item.periodeAkhir" kendo-datetimepicker
						placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" />
				</div>
				<div class="clear"></div>
			</div>
