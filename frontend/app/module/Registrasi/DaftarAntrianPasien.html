<div class="panel panel-default container_12" ng-show="klikDiagnosa">
    <!--<div class="panel-heading"><label class='title' c-label item="item" c-label-text="diagnosaPasien"></label></div>-->
    <div class="panel-body">
        <div class="panel panel-white">
            <div class="panel-heading"><label class='title' c-label item="item" c-label-text="dataPasien"></label>
            </div>
            <div class="grid_12" style="padding:5px !important">
                <div class="grid_1">
                    <label c-label item="item" c-label-text="noCm"></label>
                    <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="item.nocm" disabled />
                </div>
                <div class="grid_2">
                    <label c-label item="item" c-label-text="namaPasien"></label>
                    <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="item.namapasien" disabled />
                </div>
                <div class="grid_2">
                    <label c-label item="item" c-label-text="noRegistrasi"></label>
                    <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="item.noregistrasi" disabled />
                </div>
                <div class="grid_2">
                    <label c-label item="item" c-label-text="tanggalRegistrasi"></label>
                    <input style="width: 100%" k-ng-model='item.tglregistrasi' kendo-date-time-picker k-options="formatJam24" disabled />
                </div>
                <div class="grid_2">
                    <label c-label item="item" c-label-text="ruangan"></label>
                    <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="item.namaruangan" disabled />
                </div>
                <div class="grid_1">
                    <label c-label item="item" c-label-text="kelas"></label>
                    <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="item.namakelas" disabled />
                </div>
                <div class="grid_2">
                    <label c-label item="item" c-label-text="kelompokPasien"></label>
                    <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="item.kelompokpasien" disabled />
                </div>
            </div>
        </div>
        <div class="panel panel-white">
            <div class="panel-heading"><label class='title' c-label item="item" c-label-text="dataDiagnosa"></label>
            </div>
            <div class="grid_12" ng-hide="inputDataDiagnosis">
                <div kendo-grid k-data-source="dataDiagnosisPrimer" options="gridDiagnosa"></div>
            </div>
            <div class="grid_12" ng-show="inputDataDiagnosis">
                <div class="grid_12">
                    <div class="grid_12" style="margin-top:10px">
                        <label c-label style="padding:5px;font-size:14px; font-weight:600">Pencarian
                            berdasarkan:</label>
                    </div>
                    <div class="grid_12" style="margin-top:10px">
                        <md-radio-group ng-model="findBy" layout="row" layout-sm="row" layout-align="left left" layout-wrap>
                            <div class="grid_2">
                                <md-radio-button value="0" class="md-primary">Menurut Kode</md-radio-button>
                            </div>
                            <div class="grid_2">
                                <md-radio-button value="1" class="md-primary">Menurut Nama </md-radio-button>
                            </div>
                        </md-radio-group>
                    </div>
                </div>
                <div class="grid_12" style="margin-top:20px">
                    <div class="grid_2">
                        <label c-label c-label-text="jenisDiagnosis"></label>
                        <input kendo-combo-box style="width:100%" k-ng-model="item.jenisDiagnosis" k-data-text-field="'jenisdiagnosa'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listJenisDiagnosa" />
                    </div>
                    <div class="grid_2">
                        <label c-label c-label-text="kodeDiagnosa"></label>
                        <input kendo-combo-box style="width:100%" k-ng-model="item.diagnosisPrimer" k-data-text-field="'kddiagnosa'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listDiagnosa" ng-disabled="findBy=='1'" />
                    </div>
                    <div class="grid_4">
                        <label c-label c-label-text="namaDiagnosis"></label>
                        <input kendo-combo-box style="width:100%" k-ng-model="item.diagnosisPrimer" k-data-text-field="'namadiagnosa'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listDiagnosa" ng-disabled="findBy=='0'" />
                    </div>
                    <div class="grid_4">
                        <label c-label c-label-text="keterangan"></label>
                        <input c-text-box type="input" class="k-textbox" ng-model="item.keteranganDiagnosis" style="width: 100%;" />
                    </div>
                </div>
                <div class="grid_12">
                    <div class="grid_4 pull-right">
                        <div class="grid_6">
                            <button class="k-button k-warning" ng-click="removeDataDiagnosisPrimer()" style="float:left;font-size:18px;width:100%">Hapus Semua</button>
                        </div>
                        <div class="grid_6">
                            <button class="k-button k-success" ng-click="addDataDiagnosisPrimer()" style="float:left;font-size:18px;width:100%">Tambah</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="grid_12" ng-show="inputDataDiagnosis">
                <div kendo-grid k-data-source="listInputDiagnosis" options="gridDiagnosaBaru"></div>
            </div>
        </div>
    </div>
    <div class="grid_12 place_button">
        <div class="grid_4 pull-right" ng-hide="inputDataDiagnosis">
            <div class="grid_6">
                <button class="k-button k-warning" ng-click="toogleKlikDiagnosa()" style="float:left;font-size:18px;width:100%">Kembali</button>
            </div>
            <div class="grid_6">
                <button class="k-button k-primary" ng-click="klikInputData()" style="float:left;font-size:18px;width:100%">Input Baru</button>
            </div>
        </div>
        <div class="grid_4 pull-right" ng-show="inputDataDiagnosis">
            <div class="grid_6">
                <button class="k-button k-error" ng-click="klikInputData()" style="float:left;font-size:18px;width:100%">Batal</button>
            </div>
            <div class="grid_6">
                <button class="k-button k-primary" ng-click="simpanDiagnosa()" style="float:left;font-size:18px;width:100%">Simpan</button>
            </div>
        </div>
    </div>
</div>

<div kendo-window="winDialog" k-title="'Batal Periksa'" k-width="400" k-visible="false" k-on-open="win2visible = true" k-on-close="win2visible = false">
    <label c-label item="item" c-label-text="Ruangan"></label>
    <input style="width: 100%;" kendo-combo-box k-ng-model="items.ruangan" k-data-text-field="'namaRuangan'" k-data-value-field="'id'" k-auto-bind="false" k-data-source="listRuangan" disabled />
    </br>
    <label c-label item="item" c-label-text="Pembatalan" style="margin-top:1.5em"></label>
    <input style="width: 100%;" kendo-combo-box k-ng-model="items.pembatalan" k-data-text-field="'name'" k-data-value-field="'id'" k-auto-bind="false" k-data-source="listPembatalan" />
    </br>
    <label c-label item="item" c-label-text="Alasan Pembatalan" style="margin:1.5em 0 .5em"></label>

    <br/>
    <div class="dialog_buttons pull-right" style="margin-top:5%">
