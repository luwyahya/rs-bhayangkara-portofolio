<style>
    .red {
        background-color: #ff3860;
        color: #FFFFFF;
        /*font-weight: bold;*/
    }
    .hejo {
        background-color: #98FB98;
        color: #000000;
        /*font-weight: bold;*/
    }
</style>
<div class="grid_12">
    <div class="panel panel-default container_12">
        <div class="panel-heading" c-translate>Laporan Data PoliKlinik Sudah isi CPPT (Catatan Dokter)</div>
    </div>
    <div class="grid_12">
        <div class="grid_4">
            <div class="grid_6">
                <label c-label item="item" c-label-text="Tanggal Awal"></label>
                <input style="width: 100%" k-ng-model="item.tglAwal" kendo-datetimepicker
                    placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" />
            </div>
            <div class="grid_6">
                <label c-label item="item" c-label-text="Tanggal Akhir"></label>
                <input style="width: 100%" k-ng-model="item.tglAkhir" kendo-datetimepicker
                    placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" />
            </div>
            
        </div>
        <div class="grid_2" style="margin-top: 18px;">
            <input kendo-combo-box k-ng-model="item.dpjp" k-data-text-field="'namalengkap'" k-data-value-field="'id'"
                k-filter="'contains'" k-auto-bind="false" k-data-source="listDokter" />
        </div>
        <div class="grid_4" style="margin-top: 20px;">
            <div class="grid_6">
                <button class="c-button"  ng-click="cariFilter()">Cari</button>
            </div>
        </div>
    </div>
    <div class="grid_12">
        <div class="grid_12 borderBox">
           <div id="kGrid" 
           kendo-grid k-data-source="dataGrid" 
           k-selectable="'row'" 
           options="columnGrid"                        
           k-pageable="'true'" 
           k-sortable="'true'" 
           k-ng-model="dataSelected">
           </div>
       </div> 
    </div>
</div>
<div class="grid_12" style="margin-top:60px">
    <div ng-include='"../app/template/Shared/TemplateLoading"'></div>
</div>
<div kendo-window="popUpDetail" k-title="'Detail Pasien'" k-width="1500" k-height="600" k-visible="false">
    <div class="grid_12">
        <div class="grid_12" style="margin-top:10px">
            <div class="grid_12 headerBox">
                <p>Detail Laporan</p>
            </div>
            <div class="clear"></div>
    
            <div class="grid_12 borderBox">
                <kendo-grid data-source="dataPasienDetail" options="columnPasienDetail"
                    k-groupable="true"></kendo-grid>
            </div>
        </div>
    </div>
</div>
<div kendo-window="popUpDetailPasien" k-title="'Detail Pasien'" k-width="1500" k-height="600" k-visible="false">
    <div class="grid_12">
        <div class="grid_12" style="margin-top:10px">
            <div class="grid_12 headerBox">
                <p>Detail Laporan</p>
            </div>
            <div class="clear"></div>
    
            <div class="grid_12 borderBox">
                <kendo-grid data-source="dataPasienDetailPasien" options="columnPasienDetailPasien"
                    k-groupable="true"></kendo-grid>
            </div>
        </div>
    </div>
</div>
