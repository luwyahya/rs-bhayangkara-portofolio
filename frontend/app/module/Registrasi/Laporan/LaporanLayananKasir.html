<div ng-controller="LaporanLayananKasirCtrl">
	<div ng-show="dataVOloaded">
		<!-- <c-panel item="item" header="'Daftar Tagihan Rekanan'" disabled> -->
		<div class="grid_12 headerBox">
			<h1 style="color: white;"><b>Laporan Penerimaan Kasir Detail</b></h1>
		</div>
		<div class="grid_12">
			<div class="grid_2">
				<label c-label item="item" c-label-text="Tanggal Registrasi"></label>
				<input style="width: 100%" k-ng-model="item.tglawal" kendo-datetimepicker placeholer="yyyy-mm-dd"
					k-format="'yyyy-MM-dd HH:mm'" />
			</div>

			<div class="grid_2">
				<label c-label item="item" c-label-text="Tanggal Akhir"></label>
				<input style="width: 100%" k-ng-model="item.tglakhir" kendo-datetimepicker placeholer="yyyy-mm-dd"
					k-format="'yyyy-MM-dd HH:mm'" />
			</div>
			<div class="grid_3">
				<label c-label item="item" c-label-text="Departement"></label>
				<input style="width: 100%;" kendo-combo-box k-ng-model="item.departement"
					k-data-text-field="'departemen'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
					k-data-source="listDepartemen" k-on-change="getIsiComboRuangan()" />
			</div>
			<div class="grid_3">
				<label c-label item="item" c-label-text="Ruangan"></label>
				<input ng-disabled="isDisable" style="width: 100%;" kendo-combo-box k-ng-model="item.ruangan"
					k-data-text-field="'ruangan'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
					k-data-source="listRuangan" />
			</div>
			<div class="grid_2">
				<label c-label c-label-text="namaKasir" real></label>
				<select ng-show="listKasir.length" kendo-multi-select k-options="selectOptionsKasir"
					k-filter="'contains'" k-data-source="listKasir" k-ng-model="item.KasirMulti"></select>
			</div>
		</div>
		<div class="grid_12">
			<div class="grid_2">
				<label c-label item="item" c-label-text="Nama Penindak"></label>
				<select ng-show="listDokter.length" kendo-multi-select k-options="selectOptionsDokter"
					k-filter="'contains'" k-data-source="listDokter" k-ng-model="item.DokterMulti"></select>
				<!-- <input style="width: 100%;" kendo-combo-box k-ng-model="item.namaDokter"
					k-data-text-field="'namalengkap'" k-data-value-field="'id'" k-filter="'contains'"
					k-auto-bind="false" k-data-source="listPegawai" /> -->
			</div>
			<div class="grid_2">
				<label class="c-label">Nama Rekanan</label>
				<input kendo-combo-box tyle="width:100%" k-ng-model="item.namaPenjamin"
					k-data-text-field="'namarekanan'" k-data-value-field="'id'" k-filter="'contains'"
					k-auto-bind="false" k-data-source="listKelompokPasien" />
			</div>
			<div class="grid_2">
				<div class="grid_12">
					<label c-label item="item">No Registrasi</label>
				</div>
				<div class="clear"></div>

				<div class="grid_12">
					<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.noReg"
						ng-keypress="($event.which == 13)? SearchData():item.noReg" />
				</div>
			</div>
			<div class="grid_1" style="margin-top: 15px;">
				<button class="btnTemplate1" style="margin-left: 0;" ng-click="LoadDataLayanan()">Cari Layanan</button>
			</div>
			<div class="grid_1" style="margin-top: 15px;">
				<button class="btnTemplate1" style="margin-left: 0;" ng-click="LoadDataResep()">Cari Resep</button>
			</div>
		</div>

		<div class="grid_12">
			<div class="grid_12">
				<kendo-grid  k-data-source="dataSourceLaporanPelayananDokter" options="mainGroupOptionsLapLayananDok"
					k-pageable="'true'" k-sortable="'true'" k-resizable="'true'" k-selectable="'row'" k-groupable="true">
				</kendo-grid>
			</div>
		</div>
		<div class="clear"></div>
		<div class="grid_12">
			<div class="grid_12" style="float:right">
				<div class="grid_4 " style="margin-top: 25px ">
					<button class="c-button" ng-show="!isLoading" item="item" is-validate ng-click="Cetak()">
						<span class="title">Cetak Rekap Layanan Dokter</span>
					</button>
				</div>
				<div class="grid_4 " style="margin-top: 25px ">
					<button class="c-button" ng-show="!isLoading" item="item" is-validate ng-click="CetakDetail()">
						<span class="title">Cetak Detail Layanan Dokter</span>
					</button>
				</div>
				<!-- <div class="grid_4 " style="margin-top: 25px ">
                        <button class="c-button" ng-show="!isLoading" item="item" is-validate ng-click="CetakTagihan()">
                            <span class="title">Cetak Tagihan Penjamin</span>
                        </button>
                    </div> -->
			</div>
		</div>
		<br />
		<div class="grid_12" style="margin-top:60px">
			<div ng-include='"../app/template/Shared/TemplateLoading"'></div>
		</div>
		<div kendo-window="winDialog" k-title="'Jadwal Dokter'" k-width="1200" k-height="400" k-visible="false"
			k-on-open="win2visible = true" k-on-close="win2visible = false">
			<div class="grid_12">
				<div class="grid_12 borderBox">
					<div id="kGrid" kendo-grid k-data-source="dataGridDokter" k-selectable="'row'"
						k-columns="columnGridDokter" k-pageable="'true'" k-sortable="'true'" k-ng-model="dataSelected">
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
