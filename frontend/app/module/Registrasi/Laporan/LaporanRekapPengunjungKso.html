    <div kendo-window="popUpclosing" k-title="'Closing Pasien '" k-width="600" k-visible="false"
			k-on-open="win2visible = true" k-on-close="win2visible = false">
        <div class="panel panel-default container_12">
            <div class="grid_12">
                <fieldset class="effect-shadow" style="border-radius:  4px; margin-top: 5px;">
                    <div class="grid_10">
                        <div class="grid_12">
                            <label c-label item="item ">Password</label>
                        </div>
                        <div class="grid_12">
                            <input c-text-box type="password" filter="'char'" class="k-textbox"
                                ng-model="item.password" />
                        </div>
                    </div>
                </fieldset>
                <div class="grid_12">
                    <div class="k-edit-buttons  k-state-default pull-right" style="margin-top:10px">
                        <button class="k-button  k-button-icontext" ng-click="verif2()"><i
                                class="fa fa-times-circle"></i>&nbsp;Simpan</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
     <div kendo-window="popUpclosing2" k-title="'Closing Pasien '" k-width="600" k-visible="false"

                </div>
            </div>
        </div>
