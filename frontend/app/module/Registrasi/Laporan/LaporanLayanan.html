<div ng-controller="LaporanLayananCtrl">
	<div ng-show="dataVOloaded">
		<!-- <c-panel item="item" header="'Daftar Tagihan Rekanan'" disabled> -->
		<div class="grid_12 headerBox">
			<h1 style="color: white;"><b>Laporan Layanan</b></h1>
		</div>
		<div class="grid_12">
			<div class="grid_2">
				<label c-label item="item" c-label-text="Tanggal awal"></label>
				<input style="width: 100%" k-ng-model="item.tglawal" kendo-datetimepicker placeholer="yyyy-mm-dd"
					k-format="'yyyy-MM-dd HH:mm'" />
			</div>

			<div class="grid_2">
				<label c-label item="item" c-label-text="Tanggal Akhir"></label>
				<input style="width: 100%" k-ng-model="item.tglakhir" kendo-datetimepicker placeholer="yyyy-mm-dd"
					k-format="'yyyy-MM-dd HH:mm'" />
			</div>
			<div class="grid_1">
				<div class="grid_12">
					<div class="grid_12">
						<input type="checkbox" class="k-checkbox" ng-model="model.cekpilihManual" id="pilihManual"
							ng-click="ceklispilihManual(model.cekpilihManual)" style="margin-top: 10px;">
						<label class="c-label k-checkbox-label" for="pilihManual" required>Tgl SBM <br /></label>
						<br />
						<input type="checkbox" class="k-checkbox" ng-model="model.cekpilihManual2" id="pilihManual2"
							ng-click="ceklispilihManual2(model.cekpilihManual2)">
						<label class="c-label k-checkbox-label" for="pilihManual2" required>Banyak Dept</label>
						<br />
						<input type="checkbox" class="k-checkbox" ng-model="model.cekpilihManual6" id="pilihManual6"
							ng-click="ceklispilihManual6(model.cekpilihManual6)">
						<label class="c-label k-checkbox-label" for="pilihManual6" required>With Disc</label>
						<!-- </div>
					<div class="grid_2"></div>
					<div class="grid_5"> -->
						<!-- <input type="checkbox" class="k-checkbox" ng-model="model.cekpilihManual"
							id="pilihManual" ng-click="ceklispilihManual(model.cekpilihManual)" style="margin-top: 10px;">
						<label class="c-label k-checkbox-label" for="pilihManual" required>Hanya Dokter</label> -->
					</div>
				</div>
			</div>
			<div class="grid_1">
				<div class="grid_12">
					<div class="grid_12">
						<input type="checkbox" class="k-checkbox" ng-model="model.cekpilihManual3" id="pilihManual3"
							ng-click="ceklispilihManual3(model.cekpilihManual3)" style="margin-top: 10px;">
						<label class="c-label k-checkbox-label" for="pilihManual3" required>Seluruh Dokter
							<br /></label>
						<br />
						<input type="checkbox" class="k-checkbox" ng-model="model.cekpilihManual4" id="pilihManual4"
							ng-click="ceklispilihManual4(model.cekpilihManual4)">
						<label class="c-label k-checkbox-label" for="pilihManual4" required>Selain Tindakan</label>
						<!-- <br/>
						<input type="checkbox" class="k-checkbox" ng-model="model.cekpilihManual5"
							id="pilihManual5" ng-click="ceklispilihManual5(model.cekpilihManual5)">
						<label class="c-label k-checkbox-label" for="pilihManual5" required>To Penunjang</label> -->
						<br />
						<input type="checkbox" class="k-checkbox" ng-model="model.cekpilihManual7" id="pilihManual7"
							ng-click="ceklispilihManual7(model.cekpilihManual7)">
						<label class="c-label k-checkbox-label" for="pilihManual7" required>JasKep</label>
					</div>
				</div>
			</div>
			<div class="grid_2" ng-show="isListDep">
				<label c-label item="item" c-label-text="Banyak Departement"></label>
				<!-- <input style="width: 100%;" kendo-combo-box k-ng-model="item.departement"
					k-data-text-field="'departemen'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
					k-data-source="listDepartemen" k-on-change="getIsiComboRuangan()" /> -->

				<select kendo-multi-select k-options="selectDepartemen" k-data-source="listDepartemen"
					k-data-text-field="'departemen'" k-data-value-field="'id'" k-ng-model="selectedDepartemen" \>
				</select>
			</div>
			<div class="grid_2" ng-show="isDep">
				<label c-label item="item" c-label-text="Departement"></label>
				<input style="width: 100%;" kendo-combo-box k-ng-model="item.departement"
					k-data-text-field="'departemen'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
					k-data-source="listDepartemen" k-on-change="getIsiComboRuangan()" />

				<!-- <select kendo-multi-select k-options="selectDepartemen" k-data-source="listDepartemen"
					k-data-text-field="'departemen'" k-data-value-field="'id'"
					k-ng-model="selectedDepartemen" \>
				</select> -->
			</div>
			<div class="grid_2" ng-show="isRu">
				<label c-label item="item" c-label-text="Ruangan"></label>
				<input ng-disabled="isDisable" style="width: 100%;" kendo-combo-box k-ng-model="item.ruangan"
					k-data-text-field="'ruangan'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
					k-data-source="listRuangan" />
			</div>
			<div class="grid_2" ng-show="isDepPenun">
				<label c-label item="item" c-label-text="Departement Penunjang"></label>
				<input style="width: 100%;" kendo-combo-box k-ng-model="item.departementP"
					k-data-text-field="'departemen'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
					k-data-source="listDepartemen" k-on-change="getIsiComboRuangan()" />

				<!-- <select kendo-multi-select k-options="selectDepartemen" k-data-source="listDepartemen"
					k-data-text-field="'departemen'" k-data-value-field="'id'"
					k-ng-model="selectedDepartemen" \>
				</select> -->
			</div>
			<div class="grid_2">
				<label class="c-label">Nama Penjamin</label>
				<input kendo-combo-box tyle="width:100%" k-ng-model="item.namaPenjamin"
					k-data-text-field="'kelompokpasien'" k-data-value-field="'id'" k-filter="'contains'"
					k-auto-bind="false" k-data-source="listKelompokPasien" />
			</div>
		</div>
		<div class="grid_12">
			<div class="grid_2" ng-show="isPetugas">
				<label c-label item="item" c-label-text="Nama Pelaksana"></label>
				<!-- <input style="width: 100%;" kendo-combo-box k-ng-model="item.namaDokter"
					k-data-text-field="'namalengkap'" k-data-value-field="'id'" k-filter="'contains'"
					k-auto-bind="false" k-data-source="listPegawai" /> -->

				<select kendo-multi-select k-options="selectDokter" k-data-source="listPegawai"
					k-data-text-field="'namalengkap'" k-data-value-field="'id'" k-ng-model="selectedDokter" \>
				</select>
			</div>
			<div class="grid_2">
				<label c-label item="item" c-label-text="Kelas"></label>
				<input style="width: 100%;" kendo-combo-box k-ng-model="item.kelas" k-data-text-field="'namakelas'"
					k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listKelas" />
			</div>
			<div class="grid_3">
				<label c-label item="item" c-label-text="Tindakan"></label>
				<!-- <input ng-disabled="isDisable" style="width: 100%;" kendo-combo-box k-ng-model="item.produk"
					k-data-text-field="'namaproduk'" k-
					data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
					k-data-source="listProduk" /> -->

				<select kendo-multi-select k-options="selectProdukPelayanan" k-data-source="listProduk"
					k-data-text-field="'namaproduk'" k-data-value-field="'id'" k-ng-model="selectedProdukPelayanan" \>
				</select>
			</div>
			<!-- <div class="grid_4" style="margin-top: 3px;">
				<label c-label item="item">Ruangan</label>
				<select kendo-multi-select k-options="selectRuanganPelayanan" k-data-source="listRuangan"
					k-data-text-field="'namaruangan'" k-data-value-field="'id'"
					k-ng-model="selectedRuanganPelayanan" \>
				</select>
			</div> -->
			<div class="grid_1">
				<label class="c-label">Kondisi</label>
				<input kendo-combo-box tyle="width:100%" k-ng-model="item.Kondisi" k-data-text-field="'kondisi'"
					k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="ListKondisi" />
			</div>
			<div class="grid_2">
				<label c-label item="item" c-label-text="Petugas Pelaksana"></label>
				<input ng-disabled="isDisable" style="width: 100%;" kendo-combo-box k-ng-model="item.PetugasPel"
					k-data-text-field="'jenispetugaspe'" k-data-value-field="'id'" k-filter="'contains'"
					k-auto-bind="false" k-data-source="listPetugasPel" />
			</div>
			<div class="grid_1" style="margin-top: 15px;">
				<button class="btnTemplate1" style="margin-left: 0;" ng-click="LoadData()">Cari</button>
			</div>
			<div class="grid_1" style="margin-top: 15px;">
				<button class="btnTemplate1" style="margin-left: 0;" ng-click="JadwalDokter()">Jadwal Dokter</button>
			</div>
		</div>
		<div class="grid_12">
			<div class="grid_2">
				<input type="checkbox" class="k-checkbox" ng-model="item.cekpilihSemua" id="pilihSemua">
				<label class="c-label k-checkbox-label" for="pilihSemua" required>Semua</label>
			</div>
		</div>

		<div class="grid_12">
			<div class="grid_12" ng-show="withOutDisc">
				<kendo-grid k-data-source="dataSourceLaporanPelayananDokter" options="mainGroupOptionsLapLayananDok"
					class="max-height"></kendo-grid>
			</div>
			<div class="grid_12" ng-show="withDisc">
				<kendo-grid id="kGrid" data-source="dataSourceLaporanPelayananDokter"
					options="columnLaporanLayananDokterWithDisc" k-pageable="'true'" k-sortable="'true'"
					k-resizable="'true'" k-selectable="'row'" on-change="onChange(data)" k-ng-model="dataPasienSelected"
					ng-click="klikGrid(dataPasienSelected)">
				</kendo-grid>
				<!-- <div id="kGrid" kendo-grid k-data-source="dataSourceLaporanPelayananDokter" k-selectable="'row'" k-groupable="true"
					class="max-height" options="mainGroupOptionsLapLayananDok" k-resizable="'true'" k-sortable="'true'"
					k-ng-model="dataPasienSelected" ng-click="klik(dataPasienSelected)">
				</div>  -->
				<!-- <kendo-grid k-data-source="dataSourceLaporanPelayananDokter" options="mainGroupOptionsLapLayananDok"
					class="max-height"></kendo-grid> -->
			</div>
		</div>
		<div class="clear"></div>
		<div class="grid_12">
			<div class="grid_12" style="float:right">
				<div class="grid_4 " style="margin-top: 25px ">
					<button class="c-button" ng-show="!isLoading" item="item" is-validate ng-click="Cetak()">
						<span class="title">Cetak Rekap Layanan Dokter</span>
					</button>
				</div>
				<div class="grid_4 " style="margin-top: 25px ">
					<button class="c-button" ng-show="!isLoading" item="item" is-validate ng-click="CetakDetail()">
						<span class="title">Cetak Detail Layanan Dokter</span>
					</button>
				</div>
				<!-- <div class="grid_4 " style="margin-top: 25px ">
                        <button class="c-button" ng-show="!isLoading" item="item" is-validate ng-click="CetakTagihan()">
                            <span class="title">Cetak Tagihan Penjamin</span>
                        </button>
                    </div> -->
			</div>
		</div>
		<br />
		<div class="grid_12" style="margin-top:60px">
			<div ng-include='"../app/template/Shared/TemplateLoading"'></div>
		</div>
		<div kendo-window="winDialog" k-title="'Jadwal Dokter'" k-width="1200" k-height="400" k-visible="false"
			k-on-open="win2visible = true" k-on-close="win2visible = false">
			<div class="grid_12">
				<div class="grid_12 borderBox">
					<div id="kGrid" kendo-grid k-data-source="dataGridDokter" k-selectable="'row'"
						k-columns="columnGridDokter" k-pageable="'true'" k-sortable="'true'" k-ng-model="dataSelected">
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
