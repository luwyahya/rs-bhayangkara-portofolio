<style>
    .k-grid .k-grid-header .k-header .k-link {
        height: auto;
    }

    .k-grid .k-grid-header .k-header {
        white-space: normal;
    }

    .k-grid .k-grid-header .k-header {
        text-align: center;
    }

    .style-center {
        display: inline-block;
        text-align: center;
        width: 100%;
    }

    .style-right {
        display: inline-block;
        text-align: right;
        width: 100%;
    }

    .style-left {
        display: inline-block;
        text-align: left;
        width: 100%;
    }

    .photo-pasiens {
        /* display: inline-block; */
        width: 400px;
        height: auto;
        border-radius: 50%;
        /* background-size: 32px 35px; */
        /* background-position: center center; */
        vertical-align: middle;
    }

    .effect-shadow {
        -webkit-box-shadow: 2px 2px 5px #b6b6b6;
        -moz-box-shadow: 2px 2px 5px #b6b6b6;

    fieldset {
        border: 1px solid #c8c8c8;

        width: 300px;

<c-panel item="item" header="'Laporan Pengunjung'" disabled>
</c-panel>
<div class="grid_12">
    <div class="grid_4" style="margin-top:5px">
        <div class="grid_12">
            <label c-label item="item" c-label-text="Periode Registrasi"></label>
        </div>
        <div class="clear"></div>

        <div class="grid_12">
            <!-- AwalPeriode -->
            <div class="grid_6 padDatePicker">
                <input style="width: 100%" k-ng-model="item.periodeAwal" kendo-datetimepicker k-max="now"
                    placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" parsedate="yyyy-MM-dd HH:mm" />
            </div>

            <!-- AkhirPeriode -->
            <div class="grid_6 padDatePicker">
                <input style="width: 100%" k-ng-model="item.periodeAkhir" kendo-datetimepicker
                    placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" />
            </div>
            <div class="clear"></div>
        </div>
    </div>
    <div class="grid_2" style="margin-top:5px" ng-show="instalasi">
        <div class="grid_12">
            <label c-label item="item" c-label-text="Instalasi"></label>
        </div>
        <input style="width: 100%; " kendo-combo-box k-ng-model="item.departemen" k-data-text-field=" 'namadepartemen' "
            k-filter=" 'contains' " k-data-value-field=" 'id' " k-auto-bind="false " k-data-source="listDepartemen" />
    </div>
    <div class="grid_2" style="margin-top:5px" ng-show="ruangan">
        <label c-label c-label-text="namaRuangan" real></label>
        <input style="width: 100%; " kendo-combo-box k-ng-model="item.ruangan" k-data-text-field=" 'namaruangan' "
            k-filter=" 'contains' " k-data-value-field=" 'id' " k-auto-bind="false " k-data-source="listRuangans " />
    </div>
    <div class="grid_2" style="margin-top:5px">
        <div class="grid_12">
            <label c-label item="item" c-label-text="Dokter"></label>
        </div>
        <input style="width: 100%; " kendo-combo-box k-ng-model="item.dokter" k-data-text-field=" 'namalengkap' "
            k-filter=" 'contains' " k-data-value-field=" 'id' " k-auto-bind="false " k-data-source="listDokter " />
    </div>
    <div class="grid_2" style="margin-top:5px">
        <div class="grid_12">
            <label c-label item="item" c-label-text="Kabupaten"></label>
        </div>
        <input style="width: 100%; " kendo-combo-box k-ng-model="item.kabupaten" k-data-text-field=" 'namakotakabupaten' "
            k-filter=" 'contains' " k-data-value-field=" 'id' " k-auto-bind="false " k-data-source="listKotaKabupaten" />
    </div>
    <div class="grid_2" style="margin-top:5px">
        <div class="grid_12">
            <label c-label item="item" c-label-text="Tipe Pasien"></label>
        </div>
        <input style="width: 100%; " kendo-combo-box k-ng-model="item.kelompokpasien" k-data-text-field=" 'kelompok' "
            k-filter=" 'contains' " k-data-value-field=" 'id' " k-auto-bind="false " k-data-source="listKelompokPasien" k-on-change="getIsiComboRekanan()" />
    </div>
    <div class="grid_2" style="margin-top:5px">
        <div class="grid_12">
            <label c-label item="item" c-label-text="Rekanan"></label>
        </div>
        <input style="width: 100%; " kendo-combo-box k-ng-model="item.rekanan" k-data-text-field=" 'rekanan' "
            k-filter=" 'contains' " k-data-value-field=" 'id' " k-auto-bind="false " k-data-source="listRekanan" />
    </div>
    <div class="grid_2" style="margin-top:5px">
        <div class="grid_12">
            <label c-label item="item" c-label-text="Ruangan Terakhir"></label>
        </div>
        <input style="width: 100%; " kendo-combo-box k-ng-model="item.ruanganlast" k-data-text-field=" 'namaruangan' "
            k-filter=" 'contains' " k-data-value-field=" 'id' " k-auto-bind="false " k-data-source="listRuangans" />
    </div>
    <div class="grid_2" style="margin-top:5px">
        <div class="grid_12">
            <label c-label item="item" c-label-text="Jaminan Khusus"></label>
        </div>
        <input style="width: 100%; " kendo-combo-box k-ng-model="item.jaminankhusus" k-data-text-field=" 'jaminankhusus' "
            k-filter=" 'contains' " k-data-value-field=" 'id' " k-auto-bind="false " k-data-source="listJaminanKhusus" />
    </div>
    <div class="grid_2" style="margin-top:5px">
        <div class="grid_12">
            <label c-label item="item" c-label-text="Provinsi"></label>
        </div>
        <input style="width: 100%; " kendo-combo-box k-ng-model="item.provinsi" k-data-text-field=" 'namapropinsi' "
            k-filter=" 'contains' " k-data-value-field=" 'id' " k-auto-bind="false " k-data-source="listProvinsi" />
    </div>
    <div class="grid_1" style="margin-top: 10px;">
    <div class="grid_12">
        <input type="checkbox" class="k-checkbox" ng-model="model.cekpilihManual"
            id="pilihManual" ng-click="ceklispilihManual(model.cekpilihManual)">
        <label class="c-label k-checkbox-label" for="pilihManual" required>Laporan RM</label>
    </div>
    <div class="grid_12" style="margin-top: 4%;">
        <input type="checkbox" class="k-checkbox" ng-model="model.cekpilihManual2"
            id="pilihManual2" ng-click="ceklispilihManual2(model.cekpilihManual2)">
        <label class="c-label k-checkbox-label" for="pilihManual2" required>CSR</label>
    </div>
    </div>
    <div class="grid_1" style="margin-top:5px">
        <div class="grid_12">
            <label>&nbsp;</label>
        </div>
        <div class="clear"></div>

        <div class="grid_12">
            <button class="btnTemplate1" style="margin-left: 0;" ng-click="SearchData()"> <i
                    class="fa fa-search"></i>Cari</button>
        </div>
    </div>
</div>

    <div class="grid_12">
        <div class="grid_12 headerBox">
            <p>Daftar Pengunjung</p>
        </div>
        <div class="clear"></div>
        <div class="grid_12 borderBox">
            <kendo-grid id="kGrid" data-source="dataSourceGrid" options="columnGrid" k-pageable="'true'"
                k-sortable="'true'" k-resizable="'true'" k-selectable="'row'" k-ng-model="dataPasienSelected"
                ng-click="klikGrid(dataPasienSelected)"></kendo-grid>
        </div>
        <div class="clear"></div>
    </div>
