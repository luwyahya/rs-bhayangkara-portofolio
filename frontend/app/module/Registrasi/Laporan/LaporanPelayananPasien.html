<style>
	.k-grid .k-grid-header .k-header .k-link {
		height: auto;
	}

	.k-grid .k-grid-header .k-header {
		white-space: normal;
	}

	.k-grid .k-grid-header .k-header {
		text-align: center;
	}
</style>
<!-- <div ng-controller="LaporanPasienDaftarCtrl"> -->
<div ng-show="dataVOloaded">
	<!-- <c-panel item="item" header="'Daftar Tagihan Rekanan'" disabled> -->
	<div class="grid_12 headerBox">
		<h1 style="color: white;">
			<b>Laporan Bulanan Pelayanan Kesehatan Di RS BHAYANGKARA TK IV CIANJUR</b>
		</h1>
	</div>

	<div class="grid_12">

		<div class="grid_3">
			<label c-label item="item" c-label-text="Bulan"></label>
			<input style="width: 100%" k-ng-model="item.tglawal" kendo-datetimepicker placeholer="yyyy-mm-dd"
				k-format="'yyyy-MM-dd HH:mm'" />
		</div>


		<div class="grid_1">
			<div class="grid_12">
				<label>&nbsp;</label>
			</div>
			<div class="clear"></div>
			<div class="grid_12">
				<button class="btnTemplate1" style="margin-left: 0;" ng-click="Search()">Cari</button>
			</div>
		</div>


	</div>

	<div class="grid_12" style="margin-top:10px">
		<md-content>
			<md-tabs md-dynamic-height md-border-bottom md-selected="myVar">
				<md-tab label="Laporan">
					<md-content class="md-padding">
						<div class="grid_12 headerBox">
							<p>Laporan</p>
						</div>
						<div class="clear"></div>

						<div class="grid_12 borderBox">
							<kendo-grid id="kGrid" data-source="sourceLaporanDaftar" options="columnLaporanDaftar"
								k-selectable="'row'" k-sortable="'true'" k-resizable="'true'" k-ng-model="dataSelected"
								ng-click="klik(dataSelected)">
							</kendo-grid>
						</div>
					</md-content>
				</md-tab>
			</md-tabs>
		</md-content>

	</div>

	<div class="clear"></div>
	<div class="grid_12">
		<div class="grid_12" style="float:right">

		</div>
	</div>
	<br />
</div>

<div class="grid_12" style="margin-top:60px" ng-show="isLoadingData">
	<div ng-include='"../app/template/Shared/TemplateLoading"'></div>
</div>

<div kendo-window="popUpDetail" k-title="'Detail'" k-width="1500" k-height="600" k-visible="false">
	<div class="grid_12">
		<div class="grid_12" style="margin-top:10px">
			<div class="grid_12 headerBox">
				<p>Detail </p>
			</div>
			<div class="clear"></div>

			<div class="grid_12 borderBox" ng-show="isruangan">
				<kendo-grid data-source="dataPasienDetail" options="columnPasienDetail" k-groupable="true"></kendo-grid>
			</div>
			<div class="grid_12 borderBox" ng-show="iskunjL">
				<kendo-grid data-source="dataPasienDetailKunjL" options="columnPasienDetailKunjL" k-groupable="true">
				</kendo-grid>
			</div>
		</div>
	</div>
</div>
<div class="grid_2">
            <button class="btnTemplate1" style="margin-left: 0;" ng-click="Detail()"><i
                    class="fa fa-th-list"></i>Detail</button>
            <!-- <c-button style="width: 100%; padding:0px, margin:0px;" ng-click="Detail()" position="'right'">
                <span class="title">Rincian</span>
            </c-button> -->
        </div>

<div kendo-window="winDialogss" k-title="'Detail'" k-width="1500" k-height="600" k-visible="false">
	<div class="grid_12">
		<div class="grid_12" style="margin-top:10px">
			<div class="grid_12 headerBox">
				<p>Detail </p>
			</div>
			<div class="clear"></div>

			<div class="grid_12 borderBox">
				<kendo-grid id="kGrid" data-source="dataJumlahBed" options="columnBed"
					k-selectable="'row'" k-sortable="'true'" k-resizable="'true'" k-ng-model="dataSelected"
					ng-click="klik(dataSelected)">
				</kendo-grid>
			</div>
		</div>
	</div>
	<div class="grid_2">
	    <button class="btnTemplate1" style="margin-left: 0;" ng-click="DetailForm()"><i
	            class="fa fa-plus"></i>Tambah</button>
	    <!-- <c-button style="width: 100%; padding:0px, margin:0px;" ng-click="Detail()" position="'right'">
	        <span class="title">Rincian</span>
	    </c-button> -->
	</div>
	<div class="grid_2">
	    <button class="btnTemplate1" style="margin-left: 30;" ng-click="editData()"><i
	            class="fa fa-arrow-right"></i>Edit</button>
	    <!-- <c-button style="width: 100%; padding:0px, margin:0px;" ng-click="Detail()" position="'right'">
	        <span class="title">Rincian</span>
	    </c-button> -->
	</div>
	<div class="grid_2"></div>
	<div class="grid_2">
	    <button class="btnTemplate1 cancel" style="margin-left: 10;" ng-click="saveDelete()"><i
	            class="fa fa-trash"></i>Hapus</button>
	    <!-- <c-button style="width: 100%; padding:0px, margin:0px;" ng-click="Detail()" position="'right'">
	        <span class="title">Rincian</span>
	    </c-button> -->
	</div>
</div>

<div kendo-window="winDialogs" k-title="'Ruangan'" k-width="800" k-height="400" k-visible="false"
    k-on-open="win2visible = true" k-on-close="win2visible = false">
        <div class="grid_12">
            <label c-label item="item ">Nama Bed</label>
            <input style="width: 100%;" kendo-combo-box k-ng-model="item.namaexternal"
                        k-data-text-field="'namaexternal'" k-data-value-field="'id'" k-filter="'contains'"
                        k-auto-bind="false" k-data-source="listBed" />
        </div>
        <div class="grid_12">
            <label c-label item="item ">Bulan</label>
            <input style="width: 100%" k-ng-model="item.tgl" kendo-datetimepicker k-max="now"
                placeholder="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" />
        </div>
        <div class="grid_12">
            <label c-label item="item ">Jumlah</label>
            <input c-text-box type="number" filter="'number'" class="k-textbox" ng-model="item.jumlah" />
        </div>
        <div class="clear">
            <button class="k-button" ng-click="simpanRuanganBed(item)" style="float:right;margin-top:4%">Simpan</button>
    </div>
</div>

<div kendo-window="edit" k-title="'Ruangan'" k-width="800" k-height="400" k-visible="false"
    k-on-open="win2visible = true" k-on-close="win2visible = false">
        <div class="grid_12">
            <label c-label item="item ">Nama Bed</label>
            <input style="width: 100%;" kendo-combo-box k-ng-model="item.namaexternal"
                        k-data-text-field="'namaexternal'" k-data-value-field="'id'" k-filter="'contains'"
                        k-auto-bind="false" k-data-source="listBed" />
        </div>
        <div class="grid_12">
            <label c-label item="item ">Bulan</label>
            <input style="width: 100%" ng-model="item.tgl" kendo-datetimepicker k-max="now"
                placeholder="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" />
        </div>
        <div class="grid_12">
            <label c-label item="item ">Jumlah</label>
            <input c-text-box type="number" filter="'number'" class="k-textbox" ng-model="item.jumlah" />
        </div>
        <div class="clear">
            <button class="k-button" ng-click="simpanEdit(item)" style="float:right;margin-top:4%">Simpan</button>
    </div>
</div>
