<div ng-show="dataVOloaded">
    <!-- <c-panel item="item" header="'Daftar Tagihan Rekanan'" disabled> -->
    <div class="grid_12 headerBox">
        <h1 style="color: white;"><b>Laporan Pasien Pulang Csr</b></h1>
    </div>

    <div class="grid_12">

        <div class="grid_3">
            <label c-label item="item" c-label-text="Tanggal awal"></label>
            <input style="width: 100%" k-ng-model="item.tglawal" kendo-datetimepicker placeholer="yyyy-mm-dd"
                k-format="'yyyy-MM-dd HH:mm'" />
        </div>

        <div class="grid_3">
            <label c-label item="item" c-label-text="Tanggal Akhir"></label>
            <input style="width: 100%" k-ng-model="item.tglakhir" kendo-datetimepicker placeholer="yyyy-mm-dd"
                k-format="'yyyy-MM-dd HH:mm'" />
        </div>
        <div class="grid_3" ng-show="isRuanganRJ">
            <label c-label item="item" c-label-text="Departement"></label>
            <input style="width: 100%;" kendo-combo-box k-ng-model="item.departement" k-data-text-field="'departemen'"
                k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listDepartemen"
                k-on-change="getIsiComboRuangan()" />
        </div>
        <div class="grid_3 "  ng-show="isRuanganRJ">
            <label c-label item="item" c-label-text="Ruangan"></label>
            <input ng-disabled="isDisable" style="width: 100%;" kendo-combo-box k-ng-model="item.ruangan"
                k-data-text-field="'ruangan'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
                k-data-source="listRuangan" />
        </div>
    </div>
    <div class="grid_12">
        <div class="grid_3">
            <label class="c-label">Nama Penjamin</label>
            <input kendo-combo-box tyle="width:100%" k-ng-model="item.namaPenjamin" k-data-text-field="'kelompokpasien'"
                k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listKelompokPasien" />
        </div>
        <div class="grid_4" style="margin-top:5px" ng-show="Perusahaan">
            <label class="c-label">Institusi Asal Pasien</label>
            <input kendo-combo-box tyle="width:100%" k-ng-model="item.institusiAsalPasien"
                k-data-text-field="'namaRekanan'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
                k-data-source="sourceDataRekanan" />
        </div>
        <!-- <div class="grid_2" ng-show="isRJ">
            <input type="checkbox" class="k-checkbox" ng-model="model.cekpilihManual"
                id="pilihManual" ng-click="ceklispilihManual(model.cekpilihManual)">
            <label class="c-label k-checkbox-label" for="pilihManual" required>Rawat Jalan</label>
        </div>
        <div class="grid_2" ng-show="isRM">
            <input type="checkbox" class="k-checkbox" ng-model="model.cekpilihManual2"

        </div> -->
        <div class="grid_2">
            <label class="c-label">Jenis CSR/Atensi</label>
            <input kendo-combo-box tyle="width:100%" k-ng-model="item.jaminanKhusus" k-data-text-field="'namaexternal'"
                k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listJaminanKhusu" />
        </div>
        <div class="grid_1">
            <div class="grid_12">
                <label>&nbsp;</label>
            </div>
            <div class="clear"></div>

            <div class="grid_12">
                <button class="btnTemplate1" style="margin-left: 0;" ng-show="! isLoading"
                    ng-click="CariLapPasienPulang()">Cari</button>
            </div>

        </div>
        <div class="grid_1">
            <div class="grid_12">
                <label>&nbsp;</label>
            </div>
            <div class="clear"></div>

            <div class="grid_12">
                <button class="btnTemplate1" style="margin-left: 0;" ng-show="! isLoading"
                    ng-click="ClearSearch()">Clear</button>
            </div>
        </div>
    </div>
    <div class="grid_12">
        <md-content>
            <md-tabs md-dynamic-height md-border-bottom md-selected="myVar">'
                <md-tab label="Laporan Pasien Pulang CSR">
                    <md-content class="md-padding">
                        <div class="grid_12" style="margin-top:10px">
                            <div class="grid_12 headerBox">
                                <p>Data Laporan</p>
                            </div>
                            <div class="clear"></div>
                    
                            <div class="grid_12 borderBox">
                                <kendo-grid data-source="dataPasienPulang" options="columnPasienPulang" k-ng-model="dataPasienSelected"
                                    ng-click="click(dataPasienSelected)" k-groupable="true"></kendo-grid>
                            </div>
                        </div>
                    </md-content>
                </md-tab>
                <md-tab label="Laporan Rekap Pasien Pulang CSR">
                    <md-content class="md-padding">
                        <div class="grid_12" style="margin-top:10px">
                            <div class="grid_12 headerBox">
                                <p>Data Laporan</p>
                            </div>
                            <div class="clear"></div>
                    
                            <div class="grid_12 borderBox">
                                <kendo-grid data-source="dataRekap" options="columnRekap" k-ng-model="dataPasienSelected"
                                    ng-click="click(dataPasienSelected)" k-groupable="true"></kendo-grid>
                            </div>
                        </div>
                    </md-content>
                </md-tab>
            </md-tabs>
        </md-content>
    </div>

        <div class="grid_12">
        </div>
    </div>
    <div class="clear"></div>
    <div class="grid_12">
        <div class="grid_12" style="float:right">
            <div class="grid_3 " style="margin-top: 25px ">
                <button class="c-button" ng-show="!isLoading" item="item" is-validate ng-click="Cetak()">
                    <span class="title">Cetak</span>
                </button>
            </div>
            <div class="grid_12" style="margin-top:60px" >
                <div ng-include='"../app/template/Shared/TemplateLoading"'></div>
            </div>
