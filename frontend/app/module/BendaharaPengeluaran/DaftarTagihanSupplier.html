<style>
	.style-center {
		display: inline-block;
		text-align: center;
		width: 100%;
	}

	.style-right {
		display: inline-block;
		text-align: right;
		width: 100%;
	}

	.style-left {
		display: inline-block;
		text-align: left;
		width: 100%;
	}
</style>
<div>
	<!-- <c-panel item="item" header="'Daftar Tagihan Rekanan'" disabled> -->
	<div class="grid_12 headerBox">
		<h1 style="color: white;"><b>Daftar Tagihan Rekanan</b></h1>
	</div>

	<div class="grid_12">
		<div class="grid_2">
			<label c-label item="item">No Faktur/ No Dokumen</label>
			<input placeholder="No Faktur" c-text-box type="input" class="k-textbox" ng-model="item.noFaktur" />
		</div>
		<div class="grid_3">
			<label c-label item="item">Nama Supplier</label>
			<input placeholder="Nama Supplier" c-text-box type="input" class="k-textbox" ng-model="item.NamaSupplier" />
		</div>

		<div class="grid_2">
			<label c-label item="item" c-label-text="Periode Awal"></label>
			<input style="width: 100%" k-ng-model="item.periodeAwal" kendo-date-picker k-max="now"
				placeholer="yyyy-MM-dd" k-format="'yyyy-MM-dd'" />
		</div>
		<div class="grid_2">
			<label c-label item="item" c-label-text="Periode Akhir"></label>
			<input style="width: 100%" k-ng-model="item.periodeAkhir" kendo-date-picker placeholer="yyyy-MM-dd"
				k-format="'yyyy-MM-dd'" />
		</div>
		<div class="grid_2">
			<label c-label item="item" c-label-text="Status"></label>
			<input style="width: 100%;" kendo-combo-box k-data-source="listStatus" k-ng-model="item.status"
				k-data-text-field="'namaExternal'" k-filter="'contains'" k-data-value-field="'id'" k-auto-bind="false"
				k-data-source="" />
		</div>
		<div class="grid_1" style="margin-top:22px;">
			<button class="c-button" ng-click="SearchData()">Cari</button>
		</div>
	</div>
	<div class="grid_6">
		<div class="grid_12">
		</div>
	</div>
	<div class="clear"></div>
	<br />

	<!-- PenyusunanTRPNBP -->
	<div class="grid_12">
		<div class="grid_12 headerBox">
			<p>Tagihan Rekanan</p>
		</div>
		<div class="clear"></div>
		<div class="grid_12 borderBox">
			<div id="kGrid" kendo-grid k-data-source="dataGrid" k-selectable="'row'" k-pageable="true"
				k-sortable="'true'" k-columns="columnGrid" k-ng-model="dataSelected">
			</div>
		</div>
		<div class="clear"></div>
		<div class="clear"></div>
		<br />
	</div>
	<div class="grid_12">
		<div class="grid_2">
			<label c-label item="item">No Terima</label>
			<input placeholder="No Terima" c-text-box type="input" class="k-textbox" ng-model="item.noTerima" />
		</div>
		<div class="grid_6"></div>
		<div class="grid_2" style="float:right;margin-top:10px;">
			<button class="c-button" ng-click="Bayar()">Bayar Tagihan</button>
		</div>
		<div class="grid_2" style="float:right;margin-top:10px;">
			<button class="c-button" ng-click="Detail()">Detail Tagihan</button>
		</div>
	</div>
</div>

<div kendo-window="popUpVerifikasi" k-title="'Verifikasi'" k-width="1000" k-height="500" k-visible="false"
	k-on-open="win2visible = true" k-on-close="win2visible = false">
	<div class="panel panel-default container_12" style="padding: 0px 10px;">
		<div class="panel panel-default container_12">
			<div class="grid_12">
				<fieldset class="effect-shadow" style=" border-radius: 4px">
					<legend id="filterData">
						<a ng-click="showAndHide()">Detail Posting</a>
					</legend>
					<div class="grid_12">
						<div class="grid_12 headerBox">
							<p>Detail Posting</p>
							<kendo-grid id="kGrids" class="max-height" k-groupable="true"
								data-source="dataSourceKelompokTransaksi" options="columnGridKelompokTransaksi"
								k-selectable="'row'" k-sortable="'true'" k-resizable="'true'"
								k-ng-model="dataSelectedKelompokTransaksi"
								ng-dblclick="klikGridKelompokTransaksi(dataSelectedKelompokTransaksi)">
							</kendo-grid>
						</div>
					</div>
				</fieldset>
			</div>
		</div>
		<div class="k-edit-buttons  k-state-default pull-right" style="margin-top:10px">
			<button class="k-button k-button-icontext k-primary k-grid-update" ng-click="SaveKelompokTransaksi()"><span
					class="k-icon k-update"></span>Simpan</button>
			<button class="k-button  k-button-icontext" ng-click="batalPenerimaan()"><span
					class="k-icon k-cancel"></span>Batal</button>
		</div>
	</div>
</div>
