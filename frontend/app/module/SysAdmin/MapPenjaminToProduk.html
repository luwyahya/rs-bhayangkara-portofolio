<div class="grid_12 headerBox">
	<h1 style="color: white;"><b>Map Penjamin To Produk</b></h1>
</div>
<div class="grid_12">
  
	<div class="grid_2">
		<div class="grid_12" style="margin: 10px 0 0 0;">
			<label c-label item="item" c-label-text="Kelompok Pasien"></label>
		</div>
		<div class="grid_12">
			<input style="width: 100%;" kendo-combo-box k-ng-model="item.kelompokpasien"
				k-data-text-field="'kelompokpasien'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
				k-data-source="listkelompokpasien" / k-on-change="PenjaminToRekanan()" ng-click="PenjaminToRekanan()">
		</div>
	</div>
	<div class="grid_2">
		<div class="grid_12" style="margin: 10px 0 0 0;">
			<label c-label item="item" c-label-text="Nama Rekanan"></label>
		</div>
		<div class="grid_12">
			<input style="width: 100%;" kendo-combo-box k-ng-model="item.rekanan"
				k-data-text-field="'rekanan'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
				k-data-source="listrekanan" />
		</div>
	</div>
	<!-- <div class="grid_2">
		<div class="grid_12" style="margin: 10px 0 0 0;">
			<label c-label item="item" c-label-text="Detail Jenis Produk"></label>
		</div>
		<div class="grid_12">
			<input style="width: 100%;" kendo-combo-box k-ng-model="item.kelompokproduk"
				k-data-text-field="'kelompokproduk'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
				k-data-source="listkelompok" / k-on-change="jenis()" ng-click="jenis()">
		</div>
	</div> -->
	<div class="grid_2">
		<div class="grid_12" style="margin: 10px 0 0 0;">
			<label c-label item="item" c-label-text="Kelas Tanggungan"></label>
		</div>
		<div class="grid_12">
			<input style="width: 100%;" kendo-combo-box k-ng-model="item.kelas"
				k-data-text-field="'namakelas'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
				k-data-source="listkelas" >
		</div>
	</div>
	<div class="grid_6">
	
		<div class="grid_4" style="margin-top: 10px">
			<span>Tanggungan Penjamin</span>
			<div class="grid_6">
				<input type="radio" name="rupiah" id="rupiah" class="k-radio" ng-model="item.tipepotongan" value="1">
				<label class="k-radio-label" for="rupiah">Rupiah</label>
			</div>
			<div class="grid_6	">
				<input type="radio" name="persen" id="persen" class="k-radio" ng-model="item.tipepotongan" value="2">
				<label class="k-radio-label" for="persen">Persen</label>
			</div>
		</div>
		<div class="grid_6" style="margin-top: 20px">
	
			<div class="grid_12">
				<input c-text-box type="number" filter="" class="k-textbox" ng-model="item.nilai" placeholder="Nilai"  k-on-change="hitungulang()"/>
			</div>
		</div>
	
	</div>
	
</div>

<div class="grid_12">
	<div class="grid_6">
		<div class="grid_12 headerBox">
			<p>Kelompok Produk</p>
		</div>
		<div class="grid_12">
			<div class="grid_3" style="margin: 10px 0 0 0;">
				<label c-label item="item" c-label-text="Kelompok Produk"></label>
			</div>
			<div class="grid_8">
				<input style="width: 100%;" kendo-combo-box k-ng-model="item.kelompokproduk"
					k-data-text-field="'kelompokproduk'" k-data-value-field="'id'" k-filter="'contains'"
					k-auto-bind="false" k-data-source="listkelompok"/  k-on-change="RuanganToDepartement()" ng-click="jenis()">
			</div>
		</div>
		<div class="grid_12">
			<div class="grid_3" style="margin: 10px 0 0 0;">
				<label c-label item="item" c-label-text="Jenis"></label>
			</div>
			<div class="grid_8">
				<input style="width: 100%;" kendo-combo-box k-ng-model="item.jenis" k-data-text-field="'jenisproduk'"
					k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listjenisProduk"
					k-on-change="detailjenis()" ng-click="detailjenis()" />
			</div>
		</div>
		<div class="grid_12">
			<div class="grid_3" style="margin: 10px 0 0 0;">
				<label c-label item="item" c-label-text="Detail Jenis"></label>
			</div>
			<div class="grid_8">
				<input style="width: 100%;" kendo-combo-box k-ng-model="item.detailjenis"
					k-data-text-field="'detailjenisproduk'" k-data-value-field="'id'" k-filter="'contains'"
					k-auto-bind="false" k-data-source="listdetailjenisProduk" k-on-change="detailjenisToProduk(item)"
					ng-click="detailjenisToProduk(item)" for="detailjenisToProduk" />
			</div>
		</div>
		<div class="grid_12">
			<div class="grid_3" style="margin: 10px 0 0 0;">
				<label c-label item="item" c-label-text="Cari Id Produk"></label>
			</div>
			<div class="grid_6">
				<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.IdProduk"
					placeholder="Semua Id Produk" />
			</div>
			<div class="grid_2" style="margin-top: 5px">
				<button class="c-button" ng-click="CariKodeProduk()">Cari</button>
			</div>
		</div>

		<div class="grid_12">
			<div class="grid_3" style="margin: 10px 0 0 0;">
				<label c-label item="item" c-label-text="Cari Nama Produk"></label>
			</div>
			<div class="grid_6">
				<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.Produk"
					placeholder="Semua Nama Produk" />
			</div>
			<div class="grid_2" style="margin-top: 5px">
				<button class="c-button" ng-click="Cari()">Cari</button>
			</div>
		</div>


	</div>
	<div class="grid_6">
		<div class="grid_12 headerBox containerBorderBox" style="padding:0px">
			<p>Produk</p>
		</div>
		<!--    <div class="grid_12 borderBox containerBorderBox">
						<div class="grid_3" style="margin: 10px 0 0 0;">
						<label c-label item="item" c-label-text="Cari Produk"></label>
						</div>
						<div class="grid_8">
						<input style="width: 100%;" kendo-combo-box k-ng-model="item.namaproduk" k-data-text-field="'namaproduk'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="daftarProduk" k-on-change="detailjenisToProduk(item)" ng-click="detailjenisToProduk(item)">
						</div>
						</div> -->
		<div class="grid_12 borderBox containerBorderBox" style="overflow-y: scroll; height:300px;">

			<div id="kGrid" kendo-grid kendo-grid options="mainGridOptions" k-data-source="dataSource"
				k-selectable="'row'" k-columns="columnProduk" k-pageable="'true'" k-sortable="'true'"
				k-ng-model="dataSelected" ng-click="klik2(dataSelected)">
			</div>
		</div>
		
	</div>
</div>
<div class="grid_12">
	<div class="grid_12" style="float:right;">
		<div class="grid_8"></div>
		<div class="grid_2" style="margin-top: 5px">
			<button class="c-button" ng-click="reset()">Reset</button>
		</div>
		<div class="grid_2" style="margin-top: 5px">
			<button class="c-button" ng-click="Simpan()">Simpan</button>
		</div>
	</div>
</div>
