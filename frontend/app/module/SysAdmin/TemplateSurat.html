<div class="panel panel-default container_12">
    <div class="panel-body">
        <div class="grid_12">
            <div class="grid_12">
                <div class="grid_12">
                    <c-panel item="item" header="'Master Template Surat'" disabled> </c-panel>
                </div>
            </div>
            <div class="grid_12" ng-hide="isInput">

                <div class="grid_12">

                    <div class="grid_12" style="margin-top: 10px">

                        <div class="grid_4">
                            <div class="grid_12">
                                <label c-label item="item" c-label-text="Deskripsi"></label>
                            </div>
                            <div class="grid_12">
                                <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.qDeskripsi" />
                            </div>
                        </div>


                        <div class="grid_1">
                            <label c-label c-label-text=""></label>
                            <em style="margin-top:6px;" ng-click='Search()' id="iconButton" data-role="button"
                                class="k-button k-button-icon k-primary" role="button" aria-disabled="false"
                                tabindex="0"><span class="k-sprite k-icon k-i-search">Refresh</span></em>
                            <em style="margin-top:6px;" ng-click='Clear()' id="iconButton" data-role="button"
                                class="k-button k-button-icon k-primary" role="button" aria-disabled="false"
                                tabindex="0"><span class="k-sprite k-icon k-i-cancel">Refresh</span></em>

                        </div>
                    </div>
                </div>
                <div class="grid_12" style="margin-top: 10px">
                    <div class="grid_12">
                        <kendo-grid id="kGrids" k-data-source="dataSource" k-selectable="'row'" k-groupable="'true'"
                            k-options="columnGrid" k-ng-model="dataSelected" ng-click="klikGrid(dataSelected)">
                        </kendo-grid>
                    </div>
                </div>

            </div>
            <div class="grid_12" ng-show="isInput" style="padding-top:10px">

                <fieldset style="  border-color: #41abf2;
                padding: 10px;
                border-radius: 10px;">
                    <legend>Template </legend>
                    <div class="grid_4">
                        <div class="grid_12">
                            <label c-label item="item" c-label-text="Deskripsi"></label>
                        </div>
                        <div class="grid_12">
                            <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.deskripsi" />
                        </div>

                    </div>
                    <div class="grid_12">
                        <textarea kendo-editor k-options="optionEdit" k-ng-model="item.template"></textarea>

                    </div>
                    <div class="grid_12">
                        <div class="grid_9"></div>
                        <div class="grid_3">

                            <div class="grid_6" style="margin-top: 22px">
                                <button class="btnTemplate1" ng-click="save()"><i class="fa fa-save"></i>Simpan</button>
                            </div>

                            <div class="grid_6" style="margin-top: 22px">
                                <button class="btnTemplate1 cancel" ng-click="tutup()"><i
                                        class="fa fa-refresh"></i>Batal</button>
                            </div>

                        </div>
                    </div>

                </fieldset>
            </div>

        </div>
    </div>
    <div class="grid_12" style="margin-top:60px">
        <div ng-include='"../app/template/Shared/TemplateLoading"'></div>
    </div>


    <style>
        .k-window-titlebar {
            background-color: #10c4b2;
            font-weight: 800;
        }

        .k-i-close {
            display: none;
        }

        button:disabled {
            background: #B5B2B1;
        }

        .custom-button {
            margin: 0 0 10px;
            background: none;
            color: black;
            border-radius: 0.8em;
            border: 1px solid;
            background-color: white;
        }

        .k-edit,
        .k-i-download {
            background-position: -313px -221px;
        }

        /* a.k-button.k-button-icontext {
        min-width: 84px;
        background-color: #e0360b;
        border: none;
        margin: .1em;
    } */

        .duplicateDate {
            background-color: red;
            border: 2px solid red !important;
        }

        span.errorCuti {
            text-align: center;
            width: 100%;
            padding: 10px 20px;
            color: red;
            font: italic 14px/30px arial, sans-serif;
        }

        table.k-editor {
            width: 100%;
            height: 500px;
            table-layout: fixed;
            border-style: solid;
            border-width: 1px;
            border-collapse: separate;
            border-spacing: 4px;
            font-size: 100%;
            vertical-align: top;
            position: relative;
        }
    </style>
