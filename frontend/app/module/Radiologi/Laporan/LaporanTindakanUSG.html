<div class="grid_12">
    <div class="grid_12 headerBox">
        <h1 style="color: white;"><b>Laporan Tindakan USG</b></h1>
    </div>


    <div class="grid_6">
        <div class="grid_12">
            <label c-label item="item" c-label-text="Periode Tanggal"></label>
        </div>
        <div class="grid_12">
            <!-- AwalPeriode -->
            <div class="grid_4 padDatePicker">
                <input style="width: 100%" k-ng-model="item.tglAwal" kendo-datetimepicker k-max="now"
                    placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" parsedate="yyyy-MM-dd HH:mm"
                    ng-disabled='cekBelumVerifs' />
            </div>

            <!-- AkhirPeriode -->
            <div class="grid_4 padDatePicker">
                <input style="width: 100%" k-ng-model="item.tglAkhir" kendo-datetimepicker placeholer="yyyy-MM-dd HH:mm"
                    k-format="'yyyy-MM-dd HH:mm'" ng-disabled='cekBelumVerifs' />
            </div>
            <div class="grid_2" style="margin-top: -5px;">
                <button class="btnTemplate1" style="margin-left: 0;" ng-click="clickCari()"><i
                        class="fa fa-search"></i>Cari</button>
                <!-- <button class="c-button" ng-click="cariFilter()">Cari</button> -->
            </div>
        </div>

    </div>

    <div class="grid_12">
        <div class="grid_12 headerBox">
            <kendo-grid id="kGrid" data-source="dataGrid" options="columnGrid" k-selectable="'row'" k-sortable="'true'"
                k-resizable="'true'" k-pageable="'true'" k-ng-model="dataSelected" ng-click="klikGrid(dataSelected)">
            </kendo-grid>
        </div>

    </div>

    <!-- <div class="grid_3" style="margin-top: 22px" aria-hidden="false">
        <button class="btnTemplate1" ng-click="cetakPdf()"><i class="fa fa-print"></i>Cetak</button>
    </div> -->

    <div class="grid_12 place_button" style="float:left;">
        <div class="loading" style="z-index:2; bottom: 30%;" class="animated" ng-show="isLoading">
            <img height="160" src="../app/stylesheets/Flat/loading-image.gif" />
            <br /> <span>Harap Tunggu</span>
        </div>
    </div>

    <div id="tempatLaporan" ng-hide="istempatLaporan"></div>
</div>

    </div>
</div>

<div kendo-window="popUpDokter" k-title="'Pilih Dokter Pengirim'" k-width="400" k-height="125" k-visible="false"
    k-on-open="win2visible = true" k-on-close="win2visible = false">
    <label c-label item="item " c-label-text="Dokter "></label>
    <input style="width: 100%; " kendo-combo-box k-ng-model="item.pilihDokter" k-data-text-field="'namalengkap'"
        k-filter=" 'contains' " k-data-value-field=" 'id' " k-auto-bind="false " k-data-source="listDokter" />
    <div class="clear">
        <button class="k-button" ng-click="simpanDokter(item.pilihDokter)"
            style="float:right;margin-top:4%">Simpan</button>
    </div>
</div>

<div kendo-window="popup_editor" k-title="'Input Dokter'" k-visible="false" k-width="700">
    <div class="panel panel-default container_12">
        <div class="grid_6">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Tgl Pelayanan"></label>
            </div>
            <div class="clear"></div>

            <div class="grid_12">
                <input c-text-box type="input" filter="" class="k-textbox" ng-model="itemdok.tglPelayanans"
                    ng-disabled="true" />

        </div>

            <div class="grid_12">
                <label c-label item="item" c-label-text="Nama Pelayanan"></label>

            <div class="grid_12">

                <div class="grid_12">
                    <input style="width: 100%;" kendo-combo-box k-ng-model="model.pegawais"

            </div>
            <div class="pull-right" style="margin-top:4%">

            </div>
        </div> -->

        <div class="k-edit-buttons  k-state-default pull-right" style="margin-top:10px">

            <input k-ng-model="item.tglbaca" kendo-datetimepicker placeholer="yyyy-MM-dd HH:mm"
