<style>
	.style-center {
		display: inline-block;
		text-align: center;
		width: 100%;
	}

	.style-right {
		display: inline-block;
		text-align: right;
		width: 100%;
	}

	.style-left {
		display: inline-block;
		text-align: left;
		width: 100%;
	}
</style>


<div>
	<div class="grid_12 headerBox">
		<h1 style="color: white;"><b>Penerimaan Pembayaran</b></h1>
	</div>
	<div class="clear"></div>

	<br />
	<div class="grid_2">
	</div>
	<div class="grid_8">
		<!-- Kriteria -->
		<div class="grid_12">
			<div class="grid_12 borderBox containerBorderBox">
				<div class="grid_6">
					<!-- TotalTagihan -->
					<div class="grid_12">
						<div class="grid_12">
							<label c-label item="item" c-label-text="TotalTagihan"></label>
						</div>
						<div class="clear"></div>

						<div class="grid_12">
							<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.totalTagihan"
								ng-disabled="true" style="text-align: right" />
						</div>
					</div>

					<!-- TotalDeposit -->
					<!--<div class="grid_12">
						<div class="grid_12">
							<label c-label item="item" c-label-text="Total Deposit"></label>
						</div>
						<div class="clear"></div>

						<div class="grid_12">
							<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.totalDeposit" ng-disabled="true"/>
						</div>
					</div>-->

					<!-- BiayaAdministrasi -->
					<div class="grid_12" ng-show="showBiayaADministrasi">
						<div class="grid_12">
							<label c-label item="item" c-label-text="BiayaAdministrasi"></label>
						</div>
						<div class="clear"></div>

						<div class="grid_12">
							<input c-text-box type="input" filter="" class="k-textbox"
								ng-model="item.biayaAdministrasi" />
						</div>
					</div>

					<!-- Diskon -->
					<div class="grid_12" ng-show="showDiskon">
						<div class="grid_12">
							<label c-label item="item" c-label-text="Diskon"></label>
						</div>
						<div class="clear"></div>

						<div class="grid_12">
							<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.diskon" />
						</div>
					</div>

					<!-- JumlahBayar -->
					<div class="grid_12">
						<div class="grid_12">
							<label c-label item="item" c-label-text="JumlahBayar"></label>
						</div>
						<div class="clear"></div>

						<div class="grid_12">
							<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.jumlahBayarFix"
								ng-disabled="true" style="text-align: right" />
						</div>
					</div>

					<div class="clear"></div>

					<!-- Kembali -->
					<!--<div class="grid_12">
						<div class="grid_12">
							<label c-label item="item" c-label-text="Kembali"></label>
						</div>
						<div class="clear"></div>

						<div class="grid_12">
							<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.kembali" />
						</div>
					</div>-->

					<!-- Terbilang -->
					<div class="grid_12">
						<div class="grid_12">
							<label c-label item="item" c-label-text="Terbilang"></label>
						</div>
						<div class="clear"></div>

						<div class="grid_12">
							<textarea style="width: 99%; height: 40px;resize: none;"
								ng-disabled="true">{{item.terbilang}}</textarea>
						</div>
					</div>
				</div>

				<div class="grid_6">
					<!-- CaraBayar -->
					<div class="grid_12">
						<div class="grid_12">
							<label c-label item="item" c-label-text="Tgl Bayar"></label>
						</div>
						<div class="clear"></div>

						<div class="grid_12">
							<input style="width: 100%" k-ng-model="item.TglBayar" kendo-datetimepicker
								placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'"
								parsedate="yyyy-MM-dd HH:mm" />
						</div>
					</div>
					<div class="grid_12" style="margin-top: 10px">
						<div class="grid_12">
							<label c-label item="item" c-label-text="CaraBayar"></label>
						</div>
						<div class="clear"></div>

						<div class="grid_12">
							<input style="width: 100%;" kendo-combo-box k-ng-model="item.caraBayar"
								k-data-text-field="'namaExternal'" k-data-value-field="'id'" k-filter="'contains'"
								k-auto-bind="false" k-data-source="listCaraBayar" />
						</div>
					</div>

					<div class="clear"></div>

					<!-- CC -->
					<div class="grid_12" ng-show="showCC2" style="margin-top: 10px;">
						<div class="grid_12 headerBox containerBorderBox" style="padding:0px">
							<p>CC</p>
						</div>
						<div class="grid_12 borderBox containerBorderBox">
							<!-- NoKartu -->
							<div class="grid_12">
								<div class="grid_12">
									<label c-label item="item" c-label-text="NoKartu"></label>
								</div>
								<div class="clear"></div>

								<div class="grid_12">
									<input c-text-box type="input" filter="" class="k-textbox"
										ng-model="item.noKartu" />
								</div>
							</div>

							<!-- NamaKartu -->
							<div class="grid_12">
								<div class="grid_12">
									<label c-label item="item" c-label-text="NamaKartu"></label>
								</div>
								<div class="clear"></div>

								<div class="grid_12">
									<input c-text-box type="input" filter="" class="k-textbox"
										ng-model="item.namaKartu" />
								</div>
							</div>

							<!-- JenisKartu -->
							<div class="grid_12">
								<div class="grid_12">
									<label c-label item="item" c-label-text="JenisKartu"></label>
								</div>
								<div class="clear"></div>

								<div class="grid_12">
									<input style="width: 100%;" kendo-combo-box k-ng-model="item.jenisKartu"
										k-data-text-field="'namaExternal'" k-data-value-field="'id'"
										k-filter="'contains'" k-auto-bind="false" k-data-source="listJenisKartu" />
								</div>
							</div>
						</div>
					</div>
					<div class="clear"></div>

					<!-- Transfer -->
					<div class="grid_12" ng-show="showTransfer" style="margin-top: 10px;">
						<div class="grid_12">
							<div class="grid_12 headerBox containerBorderBox" style="padding:0px">
								<p>Transfer Dari</p>
							</div>
							<div class="grid_12 borderBox containerBorderBox">
								<!-- NoKartu -->
								<div class="grid_12">
									<div class="grid_12">
										<label c-label item="item" c-label-text="NoKartu"></label>
									</div>
									<div class="clear"></div>

									<div class="grid_12">
										<input c-text-box type="input" filter="" class="k-textbox"
											ng-model="item.noKartu" />
									</div>
								</div>

								<!-- Nama Bank -->
								<div class="grid_12">
									<div class="grid_12">
										<label c-label item="item" c-label-text="NamBank"></label>
									</div>
									<div class="clear"></div>

									<div class="grid_12">
										<input style="width: 100%;" kendo-combo-box k-ng-model="item.namaBank"
											k-data-text-field="'nama'" k-data-value-field="'id'" k-filter="'contains'"
											k-auto-bind="false" k-data-source="listNamaBank" />
									</div>
								</div>

								<!-- NamaKartu -->
								<div class="grid_12">
									<div class="grid_12">
										<label c-label item="item" c-label-text="NamaPemilik"></label>
									</div>
									<div class="clear"></div>

									<div class="grid_12">
										<input c-text-box type="input" filter="" class="k-textbox"
											ng-model="item.namaKartu" />
									</div>
								</div>
							</div>
						</div>
						<div class="grid_12">
							<div class="grid_12 headerBox containerBorderBox" style="padding:0px">
								<p>Transfer Ke Rekening</p>
							</div>
							<div class="grid_12 borderBox containerBorderBox">
								<!-- Nama Bank -->
								<div class="grid_12">
									<div class="grid_12">
										<label c-label item="item" c-label-text="NamBank"></label>
									</div>
									<div class="clear"></div>

									<div class="grid_12">
										<input style="width: 100%;" kendo-combo-box k-ng-model="item.namaBankKe"
											k-data-text-field="'nama'" k-data-value-field="'id'" k-filter="'contains'"
											k-auto-bind="false" k-data-source="listNamaBank" />
									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="clear"></div>

					<!-- nominal bayar -->
					<div class="grid_12">
						<div class="grid_12">
							<label c-label item="item" c-label-text="Nominal"></label>
						</div>
						<div class="clear"></div>

						<div class="grid_12">
							<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.nominal"
								style="text-align: right" />
						</div>
					</div>
					<div class="clear"></div>

					<!-- Button Tambah Cara Bayar -->
					<div class="grid_4">
						<div class="grid_12">
							<label>&nbsp;</label>
						</div>
						<div class="clear"></div>

						<div class="grid_12">
							<button class="btnTemplate1" style="margin-left: 0;" ng-click="tambahCaraBayar()">Tambah
								Bayar</button>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- Daftar Bayar -->
		<div class="grid_12" style="margin-top: 10px">
			<div class="grid_12 headerBox">
				<p>Daftar Bayar</p>
			</div>
			<div class="clear"></div>

			<!-- grid table -->
			<div class="grid_12 borderBox">
				<div id="kGrid" kendo-grid k-data-source="daftarBayar" k-selectable="'row'"
					k-ng-model="dataDaftarBayarSelected" k-columns="columnDaftarBayar">
					<div k-detail-template>
						<kendo-tabstrip>
							<div>
								<div kendo-grid k-options="detailGridOptions(dataItem)"></div>
							</div>
						</kendo-tabstrip>
					</div>
				</div>
			</div>
			<div class="clear"></div>
		</div>
		<div class="clear"></div>

		<div class="grid_6" style="margin: 10px 0px 20px">
			<div class="grid_12 headerBox containerBorderBox" style="padding:0px">
				<p>Detail</p>
			</div>
			<div class="grid_12 borderBox containerBorderBox">
				<div class="grid_12">
					<div class="grid_12">
						<label c-label item="item" c-label-text="Sudah Terima Dari"></label>
					</div>

					<div class="grid_12">
						<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.namaPasien" />
					</div>
				</div>
			</div>
		</div>
		<!-- Kriteria -->
		<div class="grid_6" style="margin: 10px 0px 20px">
			<div class="grid_12 headerBox containerBorderBox" style="padding:0px">
				<p>Total</p>
			</div>
			<div class="grid_12 borderBox containerBorderBox">
				<!-- totalFixBayar -->
				<div class="grid_12">
					<div class="grid_12">
						<label c-label item="item" c-label-text="Total Bayar"></label>
					</div>
					<div class="clear"></div>

					<div class="grid_12">
						<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.totalFixBayar"
							ng-disabled="true" style="text-align: right" />
					</div>
				</div>
			</div>
		</div>
		<div class="clear"></div>

		<!--  -->
		<div class="grid_8" ng-show="tagihan">
			<div class="grid_9">
				<div class="grid_12">
					<label c-label>KETERANGAN</label>
				</div>
				<div class="grid_5" style="margin-left: 5px">
					<input type="radio" name="mandiri" id="1" class="k-radio" ng-model="item.ketaranganlain"
						value="PELAYANAN APOTIK">
					<label class="k-radio-label" for="1">PELAYANAN APOTIK</label>
				</div>
				<div class="grid_5">
					<input type="radio" name="dibantu" id="2" class="k-radio" ng-model="item.ketaranganlain"
						value="PELAYANAN TINDAKAN">
					<label class="k-radio-label" for="2">PELAYANAN TINDAKAN</label>
				</div>
			</div>
		</div>

		<div class="grid_3" style="margin-top:30px">
			<div ng-include='"../app/template/Shared/Keuangan/TemplateButtonKasir"'></div>
		</div>
	</div>
</div>
<div id="tempatLaporan" ng-hide="istempatLaporan"></div>
<div id="tempatLaporan2" ng-hide="istempatLaporan2"></div>
