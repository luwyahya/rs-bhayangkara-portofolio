<div class="grid_12">
  <div class="grid_12">
    <div class="grid_12 borderBox">
      <kendo-grid
        id="grid"
        data-source="GridPasien"
        options="mainGridOptions"
        k-pageable="'true'"
        k-sortable="'true'"
        k-groupable="'true'"
        k-resizable="'true'"
        k-selectable="'row'"
        k-ng-model="dataPasienSelected"
        ng-click="klikGrid(dataPasienSelected)"
        ng-dblclick="klikdua(dataPasienSelected)"
      >
      </kendo-grid>
    </div>
  </div>
</div>

<div class="grid_12" ng-show="popUpTap">
  <div class="grid_12">
    <div
      id="kGrid"
      kendo-grid
      k-data-source="dataSourceTap"
      k-selectable="'row'"
      options="columnEka"
      k-ng-model="dataSelected"
      style="font-size: 8px"
    ></div>
  </div>
</div>
