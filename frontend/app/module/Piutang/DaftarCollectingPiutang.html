<div class="grid_12 headerBox">
	<h1 style="color: white;"><b>Daftar Collecting Piutang</b></h1>
</div>

<!-- Kriteria -->
<div class="grid_12">
	<div class="grid_12">
		<!-- Nama -->
		<div class="grid_2">
			<div class="grid_12">
				<label c-label item="item" style="margin-top: 10px">No Collect</label>
			</div>
			<div class="clear"></div>

			<div class="grid_12">
				<input c-text-box type="input" filter="'varchar'" class="k-textbox" ng-model="item.noCollect" />
				<!--<input style="width: 100%;" kendo-combo-box k-ng-model="item.namaCollector" k-data-text-field="'namaExternal'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listCollector" />-->
			</div>
		</div>
		<div class="grid_2">
			<div class="grid_12">
				<label c-label item="item" style="margin-top: 10px">Nama Collector</label>
			</div>
			<div class="clear"></div>

			<div class="grid_12">
				<input c-text-box type="input" filter="'varchar'" class="k-textbox" ng-model="item.namaCollector" />
				<!-- <input style="width: 100%;" kendo-combo-box k-ng-model="item.namaCollector" k-data-text-field="'namaExternal'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listCollector" /> -->
			</div>
		</div>

		<!-- Penjamin -->


		<!-- Periode Pulang -->
		<div class="grid_3">
			<div class="grid_12">
				<label c-label item="item" style="margin-top: 10px">Periode Collect</label>
			</div>
			<div class="grid_12">
				<!-- AwalPeriode -->
				<div class="grid_6 padDatePicker">
					<input style="width: 100%" k-ng-model="item.tanggalAwal" kendo-date-picker placeholer="yyyy-MM-dd"
						k-format="'yyyy-MM-dd'" />
				</div>
				<div class="grid_6 padDatePicker">
					<input style="width: 100%" k-ng-model="item.tanggalAkhir" kendo-date-picker placeholer="yyyy-MM-dd"
						k-format="'yyyy-MM-dd'" />
				</div>
				<div class="clear"></div>
			</div>
		</div>
		<div class="grid_2">
			<div class="grid_12">
				<label c-label item="item" style="margin-top: 10px">Status</label>
			</div>
			<div class="grid_12">
				<input style="width: 100%;" kendo-combo-box k-ng-model="item.status" k-data-text-field="'namaStatus'"
					k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listStatus" />
			</div>
		</div>
		<div class="grid_3" style="margin-top: 17px">
			<div class="grid_6" style="margin-top: 10px">
				<div class="grid_12">
					<button class="c-button" ng-click="cariData()">Cari</button>
				</div>
			</div>
			<!-- <div class="grid_6" style="margin-top: 10px">
						<div class="grid_12">
							<button class="c-button" ng-click="ClearSearch()">Clear</button>
						</div>
					</div> -->
		</div>
	</div>


</div>

				<legend id="filterData">

				</legend> 
				<div class="grid_4">

					<div class="grid_12">
						<label c-label item="item">Tanggal Verif</label>
					</div>
					<div class="clear"></div>
					<div class="grid_12">
						<input style="width: 100%" k-ng-model="item.tglbku" kendo-date-picker k-max="now"
							placeholer="dd-mm-yyyy" k-format="'dd-MM-yyyy'" />
					</div>
				</div>
				<!-- <div class="grid_8">

					<div class="grid_12">

					</div>

					<div class="grid_12">
						<input style="width: 100%" k-ng-model="item.tglTransferKeBank" kendo-date-picker
							placeholer="dd-mm-yyyy" k-format="'dd-MM-yyyy'" />
					</div>
				</div> -->
				<div class="grid_12">
					<div class="grid_6">
						<div class="grid_12">
							<label c-label item="item">Jumlah Verifikasi</label>
						</div>
						<div class="clear"></div>
						<div class="grid_12">
							<input c-text-box type="input" filter="numeric" class="k-textbox" ng-model="item.jumlahRp"
								ng-disabled="false" />
						</div>
					</div>
					<div class="grid_6">

						<div class="grid_12">
							<label c-label item="item">Terbilang</label>
						</div>
						<div class="clear"></div>

						<div class="grid_12">
							<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.terbilang"
								ng-disabled="true" />
						</div>
					</div>
				</div>
				<div class="grid_12">
					<div class="grid_6">
						<div class="grid_12">
							<label c-label item="item">No Bukti</label>
						</div>
						<div class="clear"></div>
						<div class="grid_12">
							<input c-text-box type="input" class="k-textbox" ng-model="item.noBukti"
								ng-disabled="txtDisable" />
						</div>
					</div>
					<div class="grid_6">

						<div class="grid_12">
							<label c-label item="item">Keterangan</label>
						</div>
						<div class="clear"></div>

						<div class="grid_12">
							<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.ketTransaksi" />
						</div>
					</div>
					<div class="grid_12">
						<div class="grid_3">
							<label c-label item="item">Kelompok Transaksi</label>
						</div>
					
						<div class="grid_9">
							<input style="width: 100%;" kendo-combo-box k-ng-model="item.kelompoktransaksi"
								k-data-text-field="'kelompoktransaksidetail'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
								k-data-source="listkelompoktransaksi" />
						</div>
					</div>
				</div> 
			</fieldset>
		</div>
