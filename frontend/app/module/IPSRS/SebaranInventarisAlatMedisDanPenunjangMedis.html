<div>
    <div class="panel panel-default container_12" ng-hide="klikDiagnosa">
        <div class="panel-heading"><label class='title' c-label item="item">Sebaran Inventaris Alat Medis dan Penunjang Medis</label></div>
        <div class="panel-body">
            <div class="grid_12">
                <div class="grid_1" style="margin-top:5px">
                    <button class="btnTemplate1" style="margin-left: 0;" ng-click="TambahAlat()">Tambah Alat</button>
                </div>
                <div class="grid_1" style="margin-top:5px">
                    <button class="btnTemplate1" style="margin-left: 0;" ng-click="EditAlat()">Edit Alat</button>
                </div>
                <!-- <div class="grid_4" style="margin-top:5px">
                    <div class="grid_12" style="margin-left:10px">
                        <label c-label c-label-text="tanggalMasuk"></label>
                    </div>
                    <div class="grid_12">
                        <div class="grid_6 padDatePicker">
                            <input style="width: 100%" k-ng-model="item.periodeAwal"  kendo-datetimepicker k-max="now" placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" parsedate="yyyy-MM-dd HH:mm" />
                        </div>
                        <div class="grid_6 padDatePicker">
                            <input style="width: 100%" k-ng-model="item.periodeAkhir" kendo-datetimepicker  placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" />
                        </div>
                    </div>
                </div> -->
                <div class="grid_1" style="margin-top:5px">
                    <button class="btnTemplate1" style="margin-left: 0;" ng-click="InputJadwalKalibrasi()">Input Jadwal Kalibrasi</button>
                </div>
                <div class="grid_1" style="margin-top:5px">
                    <button class="btnTemplate1" style="margin-left: 0;" ng-click="InputJadwalPemeliharaan()">Input Jadwal Pemeliharaan</button>
                </div>
                <div class="grid_1" style="margin-top:5px">
                    <button class="btnTemplate1" style="margin-left: 0;" ng-click="LihatJadwalKalibrasi()">Lihat Jadwal Kalibrasi</button>
                </div>
                <div class="grid_1" style="margin-top:5px">
                    <button class="btnTemplate1" style="margin-left: 0;" ng-click="LihatJadwalPemeliharaan()">Lihat Jadwal Pemeliharaan</button>
                </div>
                <div class="grid_1" style="margin-top:5px">
                    <label c-label real>Nama Alat</label>
                    <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="itema.namaPasien"
                        ng-keypress="($event.which == 13)? SearchEnter():itema.namaPasien" />
                </div>
                <div class="grid_1" style="margin-top:5px">
                    <label c-label real>No Seri</label>
                    <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="itema.noRegistrasi"
                        ng-keypress="($event.which == 13)? SearchEnter():itema.noRegistrasi" />
                </div>
                <!-- <div class="grid_3  " style="margin-top:5px">
                    <label c-label c-label-text="masukanNamaPasien" real></label>
                    <input c-text-box type="input" filter="'string'" class="k-textbox" ng-model="namaPasien" />
                </div> -->
                <div class="grid_2" style="margin-top:5px">
                    <label c-label c-label-text="lokasi" real></label>
                    <input style="width: 100%;" kendo-combo-box k-ng-model="itema.ruangan"
                        k-data-text-field="'namaruangan'" k-data-value-field="'id'" k-filter="'contains'"
                        k-auto-bind="false" k-data-source="listRuangan" />
                    <!--<input style="width: 100%;" kendo-combo-box k-ng-model="item.Ruangan" k-data-text-field="'namaRuangan'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="ruangans"/>-->
                </div>
                <div class="grid_1" style="margin-top: 20px; margin-left: 10px;">
                    <div class="grid_12" style="margin-top: -20px;">
                        <label c-label c-label-text=""></label>
                        <em style="margin-top:6px;" ng-click='findData()' id="iconButton" data-role="button"
                        class="k-button k-button-icon" role="button" aria-disabled="false"><span
                            class="k-sprite k-icon k-i-refresh">Refresh</span></em>
                    </div>
                </div>
            </div>
            <div class="grid_12">
                <div class="grid_12 borderBox">

                    <div kendo-grid id="grid" k-ng-model="item"
                        k-data-source="GridPasien" k-selectable="'row'" k-sortable="'true'" class="max-height"
                        options="ColumnPasien" ng-click="klikGrid(item)" ng-dblclick="klikdua(item)">
                    </div>

                </div>
            </div>
        </div>
    </div>
    

    <div class="grid_12" style="margin-top:60px">
        <div ng-include='"../app/template/Shared/TemplateLoading"'></div>
    </div>
    <div kendo-window="TambahAlat" k-title="'Tambah Alat'" k-width="700" k-height="700" k-visible="false"
        k-on-open="win2visible = true" k-on-close="win2visible = false">
        <div class="grid_12" style="margin-top: 10px;">
            <label c-label item="item ">Unit Kerja</label>
            <input style="width: 100%;" kendo-combo-box k-ng-model="itema.ruangan"
                k-data-text-field="'namaruangan'" k-data-value-field="'id'" k-filter="'contains'"
                k-auto-bind="false" k-data-source="listRuangan" />
        </div>
        <div class="grid_12">
            <label c-label item="item ">Nama Alat</label>
            <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="itema.namaalat" />
        </div>
        <div class="grid_12" style="margin-top: 10px;">
            <label c-label item="item ">Merk</label>
            <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="itema.merk" />
        </div>
        <div class="grid_12" style="margin-top: 10px;">
            <label c-label item="item ">Tipe</label>
            <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="itema.tipe" />
        </div>
        <div class="grid_12" style="margin-top: 10px;">
            <label c-label item="item ">No Seri</label>
            <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="itema.noseri" />
        </div>
        <div class="grid_12" style="margin-top: 10px;">
            <label c-label item="item ">Kondisi</label>
            <input style="width: 100%;" kendo-combo-box k-ng-model="itema.kondisi"
                k-data-text-field="'kondisi'" k-data-value-field="'id'" k-filter="'contains'"
                k-auto-bind="false" k-data-source="listKondisi" />
        </div>
        <div class="grid_12" style="margin-top: 10px;">
            <label c-label item="item ">SOP</label>
            <input style="width: 100%;" kendo-combo-box k-ng-model="itema.sop"
                k-data-text-field="'sop'" k-data-value-field="'id'" k-filter="'contains'"
                k-auto-bind="false" k-data-source="listSOP" />
        </div>
        <div class="grid_12" style="margin-top: 10px;">
            <label c-label item="item ">Keterangan</label>
            <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="itema.keterangan" />
        </div>
        <div class="clear">
            <button class="k-button" ng-click="simpanAlat()" style="float:right;margin-top:4%">Simpan</button>
        </div>

    </div>
    <div kendo-window="editAlat" k-title="'Edit Alat'" k-width="700" k-height="700" k-visible="false"
        k-on-open="win2visible = true" k-on-close="win2visible = false">
        <div class="grid_12" style="margin-top: 10px;">
            <label c-label item="item ">Unit Kerja</label>
            <input style="width: 100%;" kendo-combo-box k-ng-model="itema.editruangan"
                k-data-text-field="'namaruangan'" k-data-value-field="'id'" k-filter="'contains'"
                k-auto-bind="false" k-data-source="listRuangan" />
        </div>
        <div class="grid_12">
            <label c-label item="item ">Nama Alat</label>
            <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="itema.editnamaalat" />
        </div>
        <div class="grid_12" style="margin-top: 10px;">
            <label c-label item="item ">Merk</label>
            <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="itema.editmerk" />
        </div>
        <div class="grid_12" style="margin-top: 10px;">
            <label c-label item="item ">Tipe</label>
            <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="itema.edittipe" />
        </div>
        <div class="grid_12" style="margin-top: 10px;">
            <label c-label item="item ">No Seri</label>
            <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="itema.editnoseri" />
        </div>
        <div class="grid_12" style="margin-top: 10px;">
            <label c-label item="item ">Kondisi</label>
            <input style="width: 100%;" kendo-combo-box k-ng-model="itema.editkondisi"
                k-data-text-field="'kondisi'" k-data-value-field="'id'" k-filter="'contains'"
                k-auto-bind="false" k-data-source="listKondisi" />
        </div>
        <div class="grid_12" style="margin-top: 10px;">
            <label c-label item="item ">SOP</label>
            <input style="width: 100%;" kendo-combo-box k-ng-model="itema.editsop"
                k-data-text-field="'sop'" k-data-value-field="'id'" k-filter="'contains'"
                k-auto-bind="false" k-data-source="listSOP" />
        </div>
        <div class="grid_12" style="margin-top: 10px;">
            <label c-label item="item ">Keterangan</label>
            <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="itema.editketerangan" />
        </div>
        <div class="clear">
            <button class="k-button" ng-click="updateAlat()" style="float:right;margin-top:4%">Simpan</button>
        </div>

    </div>
        <style>
            img.photo-pasien {
                width: 300px;
                height: 100%;
                object-fit: contain;
            }

            legend {
                cursor: pointer;
                padding: 10px;
            }

            .effect-shadow {
                -webkit-box-shadow: 2px 2px 5px #b6b6b6;
                -moz-box-shadow: 2px 2px 5px #b6b6b6;
                box-shadow: 2px 2px 5px #b6b6b6;
            }
        </style>
