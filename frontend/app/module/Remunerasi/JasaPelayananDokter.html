	<div class="grid_12 headerBox">
    	<h1 style="color: white;"><b>Daftar Pelayanan Dokter</b></h1>
    </div>
    <div class="clear"></div>

    <br/>
		<div class="grid_12">
			<div class="panel panel-default container_12">
				<!-- <div class="grid_2">
				</div> -->
				<div class="panel-body">
					<div class="grid_4">
						<div class="grid_12">
							<label c-label item="item">Nama Dokter</label>
						</div>
						<div class="grid_12">
							<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.nama" disabled />
						</div>
					</div>
					<div class="grid_3">
					</div>
					<div class="grid_2">
						<div class="grid_12">
							<label c-label item="item">Nama Layanan</label>
						</div>
						<div class="grid_12">
							<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.produk" />
						</div>
					</div>

					<div class="grid_2">
						<div class="grid_12">
							<label c-label item="item" c-label-text="Tanggal Pelayanan"></label>
						</div>
							<div class="grid_12 padDatePicker">
								<input style="width: 100%" k-ng-model="item.periodeAwal"  kendo-datetimepicker k-max="now" placeholer="yyyy-MM-dd" k-format="'yyyy-MM-dd'" parsedate="yyyy-MM-dd" />
							</div>
					</div>

					<div class="grid_1">
						<div class="grid_12">
							<label>&nbsp;</label>
						</div>
						<div class="clear"></div>
						<div class="grid_12">
							<button class="btnTemplate1" style="margin-left: 0;" ng-click="SearchData()">Cari</button>
						</div>
					</div>


				</div>
			</div>
		</div>

    <div class="grid_12">
    	<div class="grid_12 borderBox">
			<kendo-grid  id="kGrid"  data-source="data1" options="columnData1"
				k-selectable="'row'" 
				k-sortable="'true'"
				k-resizable="'true'"
				k-ng-model="data1Selected"
				ng-click="klikGrid1(data1Selected)">
					
			</kendo-grid>
			
		</div>
