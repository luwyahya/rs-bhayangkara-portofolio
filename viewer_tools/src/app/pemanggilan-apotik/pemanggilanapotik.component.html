<main>
  <style>
    body {
      background-image: src="./assets/img/theme/promo-1.png";
      background-repeat: no-repeat, repeat;
      background-color: #cccccc;
    }
  </style>
  <div class="position-relative body">
    <!-- shape Hero -->
    <div class="card bg-gradient-green shadow-lg border-0">
      <div class="p-1">
        <div class="row align-items-center">
          <div class="col-lg-8">
            <div class="row ">
              <img src="./assets/img/logors.jpg" style="height: 55px;margin-left: 20px;">
                <h3 class="text-white font-weight-bold"> Rumah Sakit Polri Kramata Jati</h3> 
            </div> 
        </div>
      </div>
    </div>
    </div>
   <br>
  <div class="container-fluid">
    <div class="row  ">
      <div class="col-lg-12">
        <div class="row row-grid"> 
          <div class="col-lg-12">
            <div class="card   shadow border-0">
              <div class="card-body  ">
                <!-- <h1 class="text-primary text-uppercase text-center font-weight-bold" style="center">Pemanggilan Antrian</h1> -->
    
                <div class="py-1 bg-gradient-green">
                  <div class="row">
                    <div class="mb-3">
                      <div class="col-lg-12 col-sm-6">
                        <small class="text-uppercase font-weight-bold">Instalasi</small>
                        <div class="form-group">
                          <ng-select2 [data]="data" [placeholder]="'Demo with options'" class="warning" value=""
                            [options]="options" style="colo"></ng-select2>
                        </div>
                      </div>
                    </div>
                    <div class="mb-3">
                      <div class="col-lg-12 col-sm-6">
                        <small class="text-uppercase font-weight-bold">Ruangan</small>
                        <div class="form-group">
                          <ng-select2 [data]="data" [placeholder]="'Demo with options'" value="" [options]="options"
                            style="colo"></ng-select2>
                        </div>
                      </div>
                    </div>
                    <div class="mb-3">
                      <div class="col-lg-12 col-sm-6">
                        <small class="text-uppercase font-weight-bold">Status</small>
                        <div class="form-group">
                          <ng-select2 [data]="data" [placeholder]="'Demo with options'" value="" [options]="options"
                            ></ng-select2>
                        </div>
                      </div>
                    </div>
                    <div class="mb-3">
                      <div class="col-lg-12 col-sm-6" style="margin-top:20px">
                        <button class="btn btn-sm btn-primary " id="gfg" >Panggil</button>
                      </div>
    
                    </div>
    
    
                  </div>
                  <!-- Inputs (alternative) -->
    
    
                </div>
    
                <br>
                <div class="row  ">
                  <div class="col-lg-12">
                    <div class="row row-grid">
                          <div class="col-lg-6">
                            <div class="card   shadow border-0">
                              <div class="card-body  ">
                                <h1 class="text-primary text-uppercase text-center font-weight-bold" style="center">Racikan</h1>
                                <div  style="overflow-x:auto;">  
                                <table  datatable [dtOptions]="dtoption" height="300px"  class="table table-striped table-bordered table-responsive"  >
                                    <thead>
                                      <tr>
                                        <!-- <th width="30%">Nama Ruangan</th> -->
                                        <th width="10%">No Mr</th>
                                        <th width="30%">Nama Pasien</th>
                                        <th width="30%">Status</th>
                                        <th width="10%">Panggil</th>
                                        <th width="10%">Pelayanan</th>
                                      </tr>
                                    </thead> 

                                      <tbody>

                                            <tr *ngFor="let x of datanonracikan; index as i">
                                              <!-- <td width="30%">{{ x.namaruangan }}</td> -->
                                              <td width="10%">{{ x.nocm }}</td>
                                              <td width="30%">{{ x.namapasien }}</td>
                                              <td width="30%">{{ x.status }}</td>
                                              <td width="10%"><button class="btn btn-sm btn-primary " id="gfg" (click)="panggil(x,'N')">Panggil</button></td>
                                              <td width="10%"><button class="btn btn-sm btn-primary " id="gfg" (click)="panggil(x,'N')">Panggil</button></td>
                                            </tr>

                                      </tbody>

                                    </table> 
                                    </div>
                              </div>

                            </div>
                          </div>
                          <div class="col-lg-6">
                            <div class="card   shadow border-0">
                              <div class="card-body  ">
                                <h1 class="text-primary text-uppercase text-center font-weight-bold" style="center">Non Racikan</h1>
                                <table id="example" class="table table-striped table-bordered" style="width:100%">
                                  <thead>
                                    <tr>
                                      <!-- <th width="30%">Nama Ruangan</th> -->
                                      <th width="10%">No Mr</th>
                                      <th width="30%">Nama Pasien</th>
                                      <th width="30%">Status</th>
                                      <th width="10%">Panggil</th>
                                      <th width="10%">Pelayanan</th>
                                    </tr>
                                  </thead>
                          
                                  <tbody>
                          
                                    <tr *ngFor="let x of dataracikan; index as i">
                                      <!-- <td width="30%">{{ x.namaruangan }}</td> -->
                                      <td width="10%">{{ x.nocm }}</td>
                                      <td width="30%">{{ x.namapasien }}</td>
                                      <td width="30%">{{ x.status }}</td>
                                      <td width="10%"><button class="btn btn-sm btn-primary " id="gfg" (click)="panggil(x,'R')">Panggil</button></td>
                                      <td width="10%"><button class="btn btn-sm btn-primary " id="gfg" (click)="panggil(x,'R')">Panggil</button></td>
                                    </tr>
 
                                  </tbody>
                          
                                </table>
                              </div>
                          
                            </div>
                          </div>
                    </div>
                  </div>
                </div> 
                
                
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  </div> 
  <br> 
   

</main>
