<p-dialog header="RS PUSAT POLRI SAID SUKANTO" [(visible)]="showTerbaru" [responsive]="true" showEffect="fade"
  [modal]="true" [width]="1500" [minWidth]="800" [minHeight]="800" [baseZIndex]="8000" [positionTop]="80"
  appendTo="body">
  <div class="ui-g-12">
    <div>
      <form [formGroup]="formGroupSep">
        <div class="ui-g ui-fluid">
          <div class="ui-g-12">
            <p-panel header="Pilih Dokter" [toggleable]="true">
              <div class="ui-g" style="height:500px;">
                <div class="ui-g-12 ui-lg-12 ui-md-2">
                  <button pButton type="button" class="btnTemplatex" style="margin-left: 5%;"
                    *ngFor="let button of buttons" (click)="ChangeScreen(button)"
                    [class.selected]="CurrentPage == button.label">
                    {{ button.label }}
                  </button>
                </div>
              </div>
            </p-panel>
          </div>

        </div>
      </form>
    </div>
  </div>
</p-dialog>
