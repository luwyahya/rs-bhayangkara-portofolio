<div class="ui-g content">

  <div class="ui-g-12 ui-md-6 ui-lg-12">
    <div class="ui-g-12 ui-md-6 ui-lg-4">
      <a id="link-kios" (click)="app.goBack()">
        <span style="font-size:35px;" class="fa fa-arrow-left"></span>
      </a>

    </div>
    <div class="ui-g-12 ui-md-6 ui-lg-4">
      <h1 style="text-align: center"><img src="assets/humastemplate/images/icon-informasi.png">
        Informasi - Pusat Bantuan</h1>
    </div>
    <div class="ui-g-12 ui-md-6 ui-lg-4">

    </div>
  </div>
  <div class="ui-g-12 ui-md-12 ui-lg-12 " style="margin-top: -50px;" *ngIf="!showKeluhan">
    <div class="ui-g-12 ui-md-2 ui-lg-2 ui-g-offset-1">
      <a id="link-kios">

        <img class="img-responsive img-thumbnail-humas" (click)="showKontak = true"
          src="assets/humastemplate/images/bantuan-faq.png">
        <h1>Kontak Layanan</h1>
      </a>
    </div>
    <!-- <div class="ui-g-12 ui-md-2 ui-lg-2 ">
        <a id="link-kios">
          <img class="img-responsive img-thumbnail-humas" src="assets/humastemplate/images/bantuan-survey.png">
          <h1>Survey Kepuasan</h1>
        </a>
      </div> -->
    <div class="ui-g-12 ui-md-2 ui-lg-2">
      <a id="link-kios">
        <img class="img-responsive img-thumbnail-humas" (click)="showKeluhan = true"
          src="assets/humastemplate/images/bantuan-pengaduan.png">
        <h1>Pengaduan</h1>
      </a>
    </div>
    <div class="ui-g-12 ui-md-2 ui-lg-2">
      <a id="link-kios">
        <img class="img-responsive img-thumbnail-humas" (click)="showPrintUlang = true"
          src="assets/humastemplate/images/bantuan-kritik-saran.png">
        <h1>Print Ulang SEP</h1>
      </a>
    </div>
    <div class="ui-g-12 ui-md-2 ui-lg-2">
      <a id="link-kios">
        <img class="img-responsive img-thumbnail-humas" (click)="showGantiDokter = true"
          src="assets/humastemplate/images/bantuan-survey.png">
        <h1>Ganti Dokter Melayani</h1>
      </a>
    </div>
    <!-- <div class="ui-g-12 ui-md-2 ui-lg-2">
      <a id="link-kios">
        <img class="img-responsive img-thumbnail-humas" (click)="showBatalRegistrasi = true"
          src="assets/humastemplate/images/bantuan-survey.png">
        <h1>Batal Registrasi</h1>
      </a>
    </div> -->
    <!-- <div class="ui-g-12 ui-md-2 ui-lg-2">
      <a id="link-kios">
        <img class="img-responsive img-thumbnail-humas" (click)="showKeluhan = true"
          src="assets/humastemplate/images/bantuan-survey.png">
        <h1>Ganti Dokter</h1>
      </a>
    </div> -->
    <!-- <div class="ui-g-12 ui-md-2 ui-lg-2 ">
        <a id="link-kios">
          <img class="img-responsive img-thumbnail-humas"
            src="assets/humastemplate/images/bantuan-kritik-saran.png">
          <h1>Kritik & Saran</h1>
        </a>
      </div> -->


  </div>


  <div class="ui-g-12 ui-md-12 ui-lg-12 " *ngIf="showKeluhan">
    <div class="card card-w-title">
      <div class="card card-form-header">
        <h1>Pengaduan</h1>
      </div>
      <form [formGroup]="formGroup">
        <div class="ui-g ui-fluid">
          <div class="ui-g-6">
            <p-panel header="Data Pelanggan" [toggleable]="true" [style]="{'margin-bottom':'20px'}">
              <div class="ui-g" style="height:200px">
                <div class="ui-g-12 ui-lg-12 ui-md-4">
                  <mat-form-field>
                    <input matInput placeholder="No RM" formControlName="noRm">
                  </mat-form-field>
                </div>
                <div class="ui-g-12 ui-lg-12 ui-md-4">
                  <mat-form-field>
                    <input matInput placeholder="Nama Pasien" formControlName="namaPasien">
                  </mat-form-field>
                </div>
                <div class="ui-g-12 ui-lg-12 ui-md-4">
                  <mat-form-field>
                    <input matInput placeholder="No HP" formControlName="noHp">
                  </mat-form-field>
                </div>
              </div>
            </p-panel>
          </div>
          <div class="ui-g-6">
            <p-panel header="Data Keluhan" [toggleable]="true" [style]="{'margin-bottom':'20px'}">
              <div class="ui-g" style="height:200px">
                <div class="ui-g-12  ui-lg-12 ui-md-12">
                  <mat-form-field>
                    <textarea matInput placeholder="Keluhan" formControlName="keluhan"></textarea>
                  </mat-form-field>
                </div>
                <div class="ui-g-12  ui-lg-12 ui-md-12">
                  <mat-form-field>
                    <textarea matInput placeholder="Saran" formControlName="saran"></textarea>
                  </mat-form-field>
                </div>
              </div>
            </p-panel>
          </div>
          <div class="ui-g-12">
            <div class="ui-g-1 ui-g-offset-10">
              <button pButton type="button" (click)="simpan()" label="Simpan" icon="fa fa-save"></button>
            </div>
            <div class="ui-g-1 ">
              <button pButton type="button" (click)="showKeluhan = false" label="Tutup"
                icon="fa fa-angle-left"></button>
            </div>
          </div>
        </div>
      </form>
    </div>

  </div>

</div>
<p-dialog header="RS PUSAT POLRI SAID SUKANTO" [(visible)]="showKontak" [responsive]="true" showEffect="fade"
  [modal]="true" [width]="750" [minWidth]="100" [minHeight]="80" [baseZIndex]="8000" [positionTop]="80" appendTo="body">
  <div class="ui-g-12">
    <div class="ui-g ui-fluid">
      <div class="ui-g-12" style="font-size:15px">

        <h3>Kontak Layanan : </h3>
        <h3>Keluhan Reservasi Online : </h3>
        <h3>Email : -@yahoo.com</h3>
      </div>
      <div class="ui-g-12">
        <div class="ui-g-3 ui-g-offset-9">
          <button pButton type="button" (click)="showKontak = false" label="Tutup" icon="fa fa-angle-left"></button>
        </div>
      </div>
    </div>
  </div>
</p-dialog>

<p-dialog header="RS PUSAT POLRI SAID SUKANTO" [(visible)]="showPrintUlang" [responsive]="true" showEffect="fade"
  [modal]="true" [width]="1500" [minWidth]="800" [minHeight]="800" [baseZIndex]="8000" [positionTop]="80"
  appendTo="body">
  <div class="ui-g-12">
    <div>
      <form [formGroup]="formGroupSep">
        <div class="ui-g ui-fluid">
          <div class="ui-g-12">
            <p-panel header="Masukan No Pendaftaran/ NoSEP" [toggleable]="true">
              <div class="ui-g" style="height:500px;">
                <div class="ui-g-12 ui-lg-12 ui-md-4">
                  <mat-form-field class="input-no-cm">
                    <input matInput placeholder="No Pendaftaran/ NoSEP" formControlName="noregistrasi">
                  </mat-form-field>
                </div>
              </div>
            </p-panel>
          </div>

          <div class="ui-g-12">
            <div class="ui-g-6">
              <button pButton type="button" class="btnTemplate" (click)="cetakSep()" label="Cetak SEP"
                icon="fa fa-save"></button>
            </div>
            <div class="ui-g-6">
              <button pButton type="button" class="btnTemplate" (click)="showPrintUlang = false" label="Tutup"
                icon="fa fa-angle-left"></button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</p-dialog>

<p-dialog header="RS PUSAT POLRI SAID SUKANTO" [(visible)]="showGantiDokter" [responsive]="true" showEffect="fade"
  [modal]="true" [width]="1500" [minWidth]="800" [minHeight]="800" [baseZIndex]="8000" [positionTop]="80"
  appendTo="body">
  <div class="ui-g-12">
    <div>
      <form [formGroup]="formGroupSep">
        <div class="ui-g ui-fluid">
          <div class="ui-g-12">
            <p-panel header="Masukan No Pendaftaran Yang ada di SEP" [toggleable]="true">
              <div class="ui-g" style="height:600px;">
                <div class="ui-g-12 ui-lg-12 ui-md-4">
                  <mat-form-field class="input-no-cm">
                    <input matInput placeholder="No Pendaftaran" formControlName="noregistrasi">
                  </mat-form-field>
                </div>
                <div class="ui-g-12 ui-lg-12 ui-md-4">
                  <!-- <mat-form-field> -->
                  <p-dropdown formControlName="dokterDPJPMelayani" [options]="listDokterMelayani" [filter]="true"
                    [autoWidth]="false">
                  </p-dropdown>
                  <!-- </mat-form-field> -->
                </div>
              </div>
            </p-panel>
          </div>

          <div class="ui-g-12">
            <div class="ui-g-4">
              <button pButton type="button" class="btnTemplate" (click)="saveGantiDokter()" label="Ganti Dokter"
                icon="fa fa-save"></button>
            </div>
            <div class="ui-g-4">
              <button pButton type="button" class="btnTemplate" (click)="cetakSep()" label="Cetak SEP"
                icon="fa fa-save"></button>
            </div>
            <div class="ui-g-4">
              <button pButton type="button" class="btnTemplate" (click)="showGantiDokter = false" label="Tutup"
                icon="fa fa-angle-left"></button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</p-dialog>

<p-dialog header="RS PUSAT POLRI SAID SUKANTO" [(visible)]="showBatalRegistrasi" [responsive]="true" showEffect="fade"
  [modal]="true" [width]="1500" [minWidth]="800" [minHeight]="800" [baseZIndex]="8000" [positionTop]="80"
  appendTo="body">
  <div class="ui-g-12">
    <div>
      <form [formGroup]="formGroupSep">
        <div class="ui-g ui-fluid">
          <div class="ui-g-12">
            <p-panel header="Masukan No Pendaftaran" [toggleable]="true">
              <div class="ui-g" style="height:500px;">
                <div class="ui-g-12 ui-lg-12 ui-md-4">
                  <mat-form-field class="input-no-cm">
                    <input matInput placeholder="No Pendaftaran" formControlName="noregistrasi">
                  </mat-form-field>
                </div>
              </div>
            </p-panel>
          </div>

          <div class="ui-g-12">
            <div class="ui-g-6">
              <button pButton type="button" class="btnTemplate" (click)="batalRegistrasi()"
                label="SIMPAN BATAL REGISTRASI" icon="fa fa-save"></button>
            </div>
            <div class="ui-g-6">
              <button pButton type="button" class="btnTemplate" (click)="showBatalRegistrasi = false" label="Tutup"
                icon="fa fa-angle-left"></button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</p-dialog>
