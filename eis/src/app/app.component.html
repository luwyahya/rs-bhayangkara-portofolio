<ng-container *ngIf="customLayout; else noCustomLayout">
    <router-outlet></router-outlet>
</ng-container>
<ng-template #noCustomLayout>
    <mk-layout-wrapper>
        <mk-layout-header>
            <mk-layout-header-logo>TRANS<span style="color:#f50909; font-family: 'Comfortaa', cursive, 'OpenSans-Regular';">M</span>EDIC
            </mk-layout-header-logo>
            <mk-layout-header-logo-mini><b>M</b>2
            </mk-layout-header-logo-mini>
            <app-header-inner></app-header-inner>
            <span></span>
            <span></span>
            <!-- <span style="color:white; font-family: 'Comfortaa', cursive, 'OpenSans-Regular';text-justify:auto;"> -->
            <div class="icon">
                <div style="color:white; font-family: 'Comfortaa', cursive, 'OpenSans-Regular';text-justify:auto;">
                    <div>
                        <img class="icon-rs" src="assets/img/logors.png" height="50" width="50">
                        <b>                  RUMAH SAKIT BHAYANGKARA CIANJUR</b>
                    </div>
                </div>
            </div>
            <!-- </span> -->
        </mk-layout-header>
        <mk-layout-sidebar-left>
            <app-sidebar-left-inner></app-sidebar-left-inner>
        </mk-layout-sidebar-left>
        <mk-layout-sidebar-right>
            <app-sidebar-right-inner></app-sidebar-right-inner>
        </mk-layout-sidebar-right>
        <mk-layout-content>
            <div mk-layout-content-before-header>
                <div *mkLoadingPage="{checkPendingHttp: true, checkPendingRoute: true}">
                    <mk-material-bar></mk-material-bar>
                </div>
            </div>
            <router-outlet></router-outlet>
        </mk-layout-content>
        <mk-layout-footer>
            <mk-layout-footer-left>
                <strong>Powered by <a href="https://jasamedika.co.id/">Transmedic, 2021 @TRANSMEDIC</a></strong>
            </mk-layout-footer-left>
            <mk-layout-footer-right>
                <b>Version</b> 1.0
            </mk-layout-footer-right>
        </mk-layout-footer>
    </mk-layout-wrapper>
</ng-template>
